<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Collection Map — NukkadTales Admin</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --accent: #d4541f;
  --ink: #3a2b1d;
  --ink2: #6f5b46;
  --muted: #9c8a76;
  --line: #e9ddca;
  --ff: Fraunces, Georgia, serif;
  --fb: Nunito, Helvetica Neue, sans-serif;
  --bg: #fdf5ec;
  --card: #fff;
  --green: #15803d;
  --green-bg: #dcfce7;
}
body { font-family: var(--fb); background: var(--bg); color: var(--ink); min-height: 100vh; }
header {
  background: var(--ink);
  color: #fff;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
header h1 { font-family: var(--ff); font-size: 18px; font-weight: 700; flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; border-radius: 6px; border: none; cursor: pointer; font-family: var(--fb); font-size: 13px; font-weight: 600; transition: opacity .15s; }
.btn:disabled { opacity: .5; cursor: default; }
.btn-accent { background: var(--accent); color: #fff; }
.btn-outline { background: transparent; border: 1px solid rgba(255,255,255,.35); color: #fff; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--ink2); }
.btn-green { background: #15803d; color: #fff; }

/* AUTH */
#auth-screen { display: flex; align-items: center; justify-content: center; min-height: 80vh; }
.auth-box { background: var(--card); border-radius: 12px; padding: 32px; max-width: 340px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,.08); text-align: center; }
.auth-box h2 { font-family: var(--ff); color: var(--ink); margin-bottom: 6px; }
.auth-box p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
.auth-box input { width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; margin-bottom: 12px; }

/* TOOLBAR */
#toolbar {
  background: var(--card);
  border-bottom: 1px solid var(--line);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 100;
}
#search-input {
  flex: 1; min-width: 200px; max-width: 360px;
  padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
  font-size: 14px; font-family: var(--fb);
}
.tab-btn {
  padding: 7px 16px; border-radius: 6px; border: 1px solid var(--line);
  background: transparent; color: var(--ink2); font-family: var(--fb); font-size: 13px; font-weight: 600; cursor: pointer;
}
.tab-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }

/* MAIN */
#main { max-width: 1100px; margin: 0 auto; padding: 20px; }

/* STATUS */
#status-bar { font-size: 12px; color: var(--muted); padding: 6px 0 14px; }
#push-status { font-size: 12px; padding: 6px 0; }

/* PRODUCT VIEW */
.product-row {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 10px;
  display: flex;
  align-items: flex-start;
  gap: 14px;
  flex-wrap: wrap;
}
.product-row .ptitle { font-weight: 700; font-size: 14px; color: var(--ink); min-width: 180px; flex: 0 0 auto; }
.product-row .phandle { font-size: 11px; color: var(--muted); margin-top: 2px; }
.chips-area { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
  background: #fff7ed; color: var(--accent); border: 1px solid #fed7aa;
}
.chip.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.chip .chip-x { cursor: pointer; opacity: .6; font-size: 11px; line-height: 1; margin-left: 2px; }
.chip .chip-x:hover { opacity: 1; }
.chip-add { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px dashed var(--line); color: var(--muted); background: transparent; cursor: pointer; }
.chip-add:hover { border-color: var(--accent); color: var(--accent); }
.star-btn { font-size: 14px; cursor: pointer; opacity: .4; margin-left: 2px; }
.star-btn.active { opacity: 1; }

/* COLLECTION VIEW */
.coll-section {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  margin-bottom: 12px;
  overflow: hidden;
}
.coll-header {
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
}
.coll-header:hover { background: #fdf5ec; }
.coll-title { font-weight: 700; font-size: 14px; flex: 1; }
.coll-count { font-size: 12px; color: var(--muted); }
.coll-chevron { font-size: 12px; color: var(--muted); transition: transform .2s; }
.coll-chevron.open { transform: rotate(90deg); }
.coll-body { display: none; border-top: 1px solid var(--line); padding: 12px 16px; }
.coll-body.open { display: block; }
.coll-assign-all { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
.coll-assign-all button { font-size: 11px; padding: 3px 10px; }
.coll-product-row {
  display: flex; align-items: center; gap: 10px; padding: 6px 0;
  border-bottom: 1px solid var(--line); flex-wrap: wrap;
}
.coll-product-row:last-child { border-bottom: none; }
.coll-product-name { font-size: 13px; font-weight: 600; flex: 1; min-width: 160px; }
.coll-product-handle { font-size: 11px; color: var(--muted); }

/* DROPDOWN MENU */
.coll-picker-wrap { position: relative; display: inline-block; }
.coll-picker {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 200;
  background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,.12);
  min-width: 220px; max-height: 260px; overflow-y: auto; display: none;
}
.coll-picker.open { display: block; }
.coll-picker-search { padding: 8px 10px; border-bottom: 1px solid var(--line); }
.coll-picker-search input { width: 100%; border: none; outline: none; font-size: 13px; }
.coll-picker-item { padding: 8px 12px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.coll-picker-item:hover { background: var(--bg); }
.coll-picker-item.selected { color: var(--accent); font-weight: 600; }

/* TOAST */
#toast {
  position: fixed; bottom: 24px; right: 24px; z-index: 9999;
  background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 8px;
  font-size: 13px; font-weight: 600; display: none; pointer-events: none;
  box-shadow: 0 4px 16px rgba(0,0,0,.25);
}
#toast.err { background: #b91c1c; }
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-box">
    <h2>Collection Map</h2>
    <p>Enter your admin token to continue</p>
    <input type="password" id="auth-input" placeholder="Admin token…" onkeydown="if(event.key==='Enter')doAuth()">
    <button class="btn btn-accent" style="width:100%" onclick="doAuth()">Enter →</button>
  </div>
</div>

<div id="app" style="display:none">
  <header>
    <h1>✦ Collection Map</h1>
    <span style="font-size:12px;color:rgba(255,255,255,.5)" id="hdr-counts"></span>
    <button class="btn btn-outline btn-sm" onclick="refreshCollections()">↺ Refresh Collections</button>
    <button class="btn btn-green btn-sm" id="push-btn" onclick="pushToShopify()">↑ Push to Shopify</button>
  </header>

  <div id="toolbar">
    <input type="text" id="search-input" placeholder="Search products…" oninput="renderProducts()" />
    <button class="tab-btn active" id="tab-products" onclick="switchTab('products')">Products</button>
    <button class="tab-btn" id="tab-collections" onclick="switchTab('collections')">Collections</button>
    <span id="status-bar"></span>
  </div>

  <div id="main">
    <div id="push-status"></div>
    <div id="products-view"></div>
    <div id="collections-view" style="display:none"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const PROXY_BASE = 'https://cozy-dieffenbachia-95eb4b.netlify.app/.netlify/functions';
const MAP_URL    = PROXY_BASE + '/nt-collection-map';

let TOKEN = localStorage.getItem('nt_admin_token') || '';
let allProducts   = [];  // { handle, title, assigned:[], primary }
let allCollections = []; // { id, handle, title }
let mapData = {};        // handle → { assigned:[], primary }
let currentTab = 'products';

// ── AUTH ─────────────────────────────────────────────────────────────────────
function doAuth() {
  TOKEN = document.getElementById('auth-input').value.trim();
  if (!TOKEN) return toast('Enter your token', true);
  localStorage.setItem('nt_admin_token', TOKEN);
  init();
}
if (TOKEN) init();

// ── API ───────────────────────────────────────────────────────────────────────
async function api(body) {
  const r = await fetch(MAP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
    body: JSON.stringify(body),
  });
  return r.json();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  setStatus('Loading…');
  try {
    const res = await api({ action: 'load' });
    if (!res.ok) { setStatusHTML(`Error: ${res.error||'load failed'} — <a href="#" onclick="reAuth();return false" style="color:var(--accent)">Re-enter token</a>`); return; }
    allProducts    = res.products || [];
    allCollections = res.collections || [];
    mapData        = res.map || {};
    document.getElementById('hdr-counts').textContent = `${allProducts.length} products · ${allCollections.length} collections`;
    setStatus('');
    renderProducts();
    renderCollections();
  } catch(e) { setStatus('Error: ' + e.message); }
}

function reAuth() {
  localStorage.removeItem('nt_admin_token');
  TOKEN = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('auth-input').value = '';
}
}

function setStatus(msg) {
  document.getElementById('status-bar').textContent = msg;
}
function setStatusHTML(html) {
  document.getElementById('status-bar').innerHTML = html;
}

// ── TABS ──────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('products-view').style.display = tab === 'products' ? '' : 'none';
  document.getElementById('collections-view').style.display = tab === 'collections' ? '' : 'none';
  document.getElementById('tab-products').classList.toggle('active', tab === 'products');
  document.getElementById('tab-collections').classList.toggle('active', tab === 'collections');
}

// ── SAVE ──────────────────────────────────────────────────────────────────────
async function saveMap() {
  try {
    await api({ action: 'save_map', map: mapData });
  } catch {}
}

// ── PRODUCT VIEW ─────────────────────────────────────────────────────────────
function renderProducts() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const filtered = q
    ? allProducts.filter(p => p.title.toLowerCase().includes(q) || p.handle.toLowerCase().includes(q))
    : allProducts;

  const el = document.getElementById('products-view');
  if (!filtered.length) { el.innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px">No products found</p>'; return; }

  el.innerHTML = filtered.map(p => buildProductRow(p)).join('');
}

function buildProductRow(p) {
  const entry = mapData[p.handle] || { assigned: [], primary: null };
  const chipsHTML = entry.assigned.map(cid => {
    const c = allCollections.find(x => x.id === cid);
    if (!c) return '';
    const isPrimary = entry.primary === cid;
    return `<span class="chip ${isPrimary ? 'primary' : ''}" id="chip-${p.handle}-${cid}">
      ${isPrimary ? '★ ' : ''}<span class="star-btn ${isPrimary ? 'active' : ''}" onclick="setPrimary('${p.handle}','${cid}')" title="Set as primary (shown on product page)">★</span>
      ${esc(c.title)}
      <span class="chip-x" onclick="removeCollection('${p.handle}','${cid}')">×</span>
    </span>`;
  }).join('');

  return `<div class="product-row" id="prow-${p.handle}">
    <div>
      <div class="ptitle">${esc(p.title)}</div>
      <div class="phandle">${p.handle}</div>
    </div>
    <div class="chips-area">
      ${chipsHTML}
      <div class="coll-picker-wrap" id="wrap-${p.handle}">
        <button class="chip-add" onclick="togglePicker('${p.handle}')">+ Add collection</button>
        <div class="coll-picker" id="picker-${p.handle}">
          <div class="coll-picker-search"><input type="text" placeholder="Search collections…" oninput="filterPicker('${p.handle}',this.value)" onclick="event.stopPropagation()"></div>
          <div id="picker-items-${p.handle}">
            ${buildPickerItems(p.handle)}
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function buildPickerItems(handle) {
  const entry = mapData[handle] || { assigned: [], primary: null };
  return allCollections.map(c => {
    const sel = entry.assigned.includes(c.id);
    return `<div class="coll-picker-item ${sel ? 'selected' : ''}" onclick="toggleCollection('${handle}','${c.id}','${esc(c.title)}')">${sel ? '✓ ' : ''}${esc(c.title)}</div>`;
  }).join('');
}

function filterPicker(handle, q) {
  const el = document.getElementById('picker-items-' + handle);
  const entry = mapData[handle] || { assigned: [], primary: null };
  const lq = q.toLowerCase();
  el.innerHTML = allCollections
    .filter(c => !lq || c.title.toLowerCase().includes(lq))
    .map(c => {
      const sel = entry.assigned.includes(c.id);
      return `<div class="coll-picker-item ${sel ? 'selected' : ''}" onclick="toggleCollection('${handle}','${c.id}','${esc(c.title)}')">${sel ? '✓ ' : ''}${esc(c.title)}</div>`;
    }).join('');
}

function togglePicker(handle) {
  const picker = document.getElementById('picker-' + handle);
  const isOpen = picker.classList.contains('open');
  closeAllPickers();
  if (!isOpen) {
    picker.classList.add('open');
    picker.querySelector('input')?.focus();
  }
}

function closeAllPickers() {
  document.querySelectorAll('.coll-picker.open').forEach(p => p.classList.remove('open'));
}

document.addEventListener('click', e => {
  if (!e.target.closest('.coll-picker-wrap')) closeAllPickers();
});

function toggleCollection(handle, collId, collTitle) {
  if (!mapData[handle]) mapData[handle] = { assigned: [], primary: null };
  const arr = mapData[handle].assigned;
  const idx = arr.indexOf(collId);
  if (idx === -1) {
    arr.push(collId);
    if (!mapData[handle].primary) mapData[handle].primary = collId;
    toast(`Added: ${collTitle}`);
  } else {
    arr.splice(idx, 1);
    if (mapData[handle].primary === collId) mapData[handle].primary = arr[0] || null;
    toast(`Removed: ${collTitle}`);
  }
  // Sync to allProducts
  const prod = allProducts.find(p => p.handle === handle);
  if (prod) { prod.assigned = [...arr]; prod.primary = mapData[handle].primary; }
  refreshProductRow(handle);
  refreshCollectionRow(handle);
  saveMap();
}

function removeCollection(handle, collId) {
  if (!mapData[handle]) return;
  mapData[handle].assigned = mapData[handle].assigned.filter(id => id !== collId);
  if (mapData[handle].primary === collId) mapData[handle].primary = mapData[handle].assigned[0] || null;
  const prod = allProducts.find(p => p.handle === handle);
  if (prod) { prod.assigned = [...mapData[handle].assigned]; prod.primary = mapData[handle].primary; }
  refreshProductRow(handle);
  refreshCollectionRow(handle);
  saveMap();
}

function setPrimary(handle, collId) {
  if (!mapData[handle]) return;
  mapData[handle].primary = collId;
  const prod = allProducts.find(p => p.handle === handle);
  if (prod) prod.primary = collId;
  const c = allCollections.find(x => x.id === collId);
  toast(`Primary: ${c?.title || collId}`);
  refreshProductRow(handle);
  saveMap();
}

function refreshProductRow(handle) {
  const el = document.getElementById('prow-' + handle);
  if (!el) return;
  const prod = allProducts.find(p => p.handle === handle);
  if (!prod) return;
  el.outerHTML = buildProductRow(prod);
}

// ── COLLECTION VIEW ───────────────────────────────────────────────────────────
function renderCollections() {
  const el = document.getElementById('collections-view');
  if (!allCollections.length) {
    el.innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px">No collections loaded. Click "↺ Refresh Collections".</p>';
    return;
  }

  el.innerHTML = allCollections.map(c => {
    const productsInColl = allProducts.filter(p => (mapData[p.handle]?.assigned || []).includes(c.id));
    return `<div class="coll-section" id="csect-${c.id}">
      <div class="coll-header" onclick="toggleCollSection('${c.id}')">
        <span class="coll-title">${esc(c.title)}</span>
        <span class="coll-count">${productsInColl.length} assigned</span>
        <span class="coll-chevron" id="chev-${c.id}">▶</span>
      </div>
      <div class="coll-body" id="cbody-${c.id}">
        ${buildCollBody(c)}
      </div>
    </div>`;
  }).join('');
}

function buildCollBody(c) {
  const productsInColl = allProducts.filter(p => (mapData[p.handle]?.assigned || []).includes(c.id));

  return `<div class="coll-assign-all">
      <span>Assign this collection as display for all products in it:</span>
      <button class="btn btn-sm btn-ghost" onclick="assignAllInCollection('${c.id}')">Set as primary for all</button>
    </div>
    <div id="cplist-${c.id}">
    ${allProducts.map(p => {
      const isAssigned = (mapData[p.handle]?.assigned || []).includes(c.id);
      const isPrimary  = mapData[p.handle]?.primary === c.id;
      return `<div class="coll-product-row" id="crow-${c.id}-${p.handle}">
        <div style="flex:1;min-width:160px">
          <div class="coll-product-name">${esc(p.title)}</div>
          <div class="coll-product-handle">${p.handle}</div>
        </div>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <button class="btn btn-sm ${isAssigned ? 'btn-accent' : 'btn-ghost'}" onclick="toggleCollectionFromCollView('${p.handle}','${c.id}','${esc(c.title)}')">${isAssigned ? '✓ Assigned' : '+ Assign'}</button>
          ${isAssigned ? `<button class="btn btn-sm ${isPrimary ? 'btn-green' : 'btn-ghost'}" onclick="setPrimaryFromCollView('${p.handle}','${c.id}')">${isPrimary ? '★ Primary' : '☆ Set Primary'}</button>` : ''}
        </div>
      </div>`;
    }).join('')}
    </div>`;
}

function toggleCollSection(id) {
  const body = document.getElementById('cbody-' + id);
  const chev = document.getElementById('chev-' + id);
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  chev.classList.toggle('open', !isOpen);
}

function refreshCollectionRow(handle) {
  // Refresh all collection sections that show this product
  allCollections.forEach(c => {
    const row = document.getElementById(`crow-${c.id}-${handle}`);
    if (!row) return;
    const isAssigned = (mapData[handle]?.assigned || []).includes(c.id);
    const isPrimary  = mapData[handle]?.primary === c.id;
    const collTitle  = esc(c.title);
    row.innerHTML = `
      <div style="flex:1;min-width:160px">
        <div class="coll-product-name">${esc(allProducts.find(p=>p.handle===handle)?.title || handle)}</div>
        <div class="coll-product-handle">${handle}</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <button class="btn btn-sm ${isAssigned ? 'btn-accent' : 'btn-ghost'}" onclick="toggleCollectionFromCollView('${handle}','${c.id}','${collTitle}')">${isAssigned ? '✓ Assigned' : '+ Assign'}</button>
        ${isAssigned ? `<button class="btn btn-sm ${isPrimary ? 'btn-green' : 'btn-ghost'}" onclick="setPrimaryFromCollView('${handle}','${c.id}')">${isPrimary ? '★ Primary' : '☆ Set Primary'}</button>` : ''}
      </div>`;
    // update count
    const countEl = document.querySelector(`#csect-${c.id} .coll-count`);
    if (countEl) {
      const cnt = allProducts.filter(p => (mapData[p.handle]?.assigned || []).includes(c.id)).length;
      countEl.textContent = `${cnt} assigned`;
    }
  });
}

function toggleCollectionFromCollView(handle, collId, collTitle) {
  toggleCollection(handle, collId, collTitle);
}

function setPrimaryFromCollView(handle, collId) {
  setPrimary(handle, collId);
  refreshCollectionRow(handle);
}

function assignAllInCollection(collId) {
  const c = allCollections.find(x => x.id === collId);
  if (!c) return;
  // Find all Shopify-collection-member products — we don't have membership data,
  // so we set this collection as primary for all products that have it assigned
  const assigned = allProducts.filter(p => (mapData[p.handle]?.assigned || []).includes(collId));
  assigned.forEach(p => {
    if (!mapData[p.handle]) mapData[p.handle] = { assigned: [collId], primary: collId };
    else mapData[p.handle].primary = collId;
    p.primary = collId;
  });
  toast(`Set ${c.title} as primary for ${assigned.length} products`);
  renderCollections();
  renderProducts();
  saveMap();
}

// ── REFRESH COLLECTIONS ────────────────────────────────────────────────────────
async function refreshCollections() {
  setStatus('Fetching collections from Shopify…');
  try {
    const res = await api({ action: 'refresh_collections' });
    if (res.ok) {
      allCollections = res.collections || [];
      document.getElementById('hdr-counts').textContent = `${allProducts.length} products · ${allCollections.length} collections`;
      renderCollections();
      renderProducts();
      setStatus('');
      toast(`Loaded ${allCollections.length} collections`);
    } else {
      setStatus('Error: ' + (res.error || 'refresh failed'));
    }
  } catch(e) { setStatus('Error: ' + e.message); }
}

// ── PUSH TO SHOPIFY ────────────────────────────────────────────────────────────
async function pushToShopify() {
  const btn = document.getElementById('push-btn');
  const statusEl = document.getElementById('push-status');
  btn.disabled = true; btn.textContent = '↑ Pushing…';
  statusEl.style.color = 'var(--muted)';
  statusEl.textContent = 'Pushing metafields to Shopify…';

  try {
    const res = await api({ action: 'push_to_shopify', map: mapData, collections: allCollections });
    if (res.ok) {
      const failedMsg = res.failed?.length ? ` · ${res.failed.length} failed` : '';
      statusEl.style.color = 'var(--green)';
      statusEl.textContent = `✓ Pushed ${res.pushed} products${failedMsg}. Metafield: nukkad / display_collection`;
      toast(`Pushed ${res.pushed} products to Shopify`);
    } else {
      statusEl.style.color = '#b91c1c';
      statusEl.textContent = 'Error: ' + (res.error || 'push failed');
    }
  } catch(e) {
    statusEl.style.color = '#b91c1c';
    statusEl.textContent = 'Error: ' + e.message;
  } finally {
    btn.disabled = false; btn.textContent = '↑ Push to Shopify';
  }
}

// ── HELPERS ────────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

let _toastTimer;
function toast(msg, err) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = err ? 'err' : '';
  el.style.display = 'block';
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.style.display = 'none', 2800);
}
</script>
