<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Collection Map — NukkadTales Admin</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --accent: #d4541f;
  --ink: #3a2b1d;
  --ink2: #6f5b46;
  --muted: #9c8a76;
  --line: #e9ddca;
  --ff: Fraunces, Georgia, serif;
  --fb: Nunito, Helvetica Neue, sans-serif;
  --bg: #fdf5ec;
  --card: #fff;
  --green: #15803d;
}
body { font-family: var(--fb); background: var(--bg); color: var(--ink); min-height: 100vh; }

header {
  background: var(--ink); color: #fff;
  padding: 12px 20px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
header h1 { font-family: var(--ff); font-size: 18px; font-weight: 700; flex: 1; min-width: 160px; }
.btn { display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; border-radius: 6px; border: none; cursor: pointer; font-family: var(--fb); font-size: 13px; font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
.btn-accent { background: var(--accent); color: #fff; }
.btn-outline { background: transparent; border: 1px solid rgba(255,255,255,.4); color: #fff; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--ink2); }
.btn-green { background: #15803d; color: #fff; }
.btn-danger { background: #b91c1c; color: #fff; }

/* TABS */
.tabs {
  background: var(--card);
  border-bottom: 2px solid var(--line);
  display: flex;
  align-items: center;
  gap: 0;
  position: sticky; top: 0; z-index: 100;
}
.tab {
  padding: 14px 22px; font-size: 14px; font-weight: 700; cursor: pointer;
  border-bottom: 3px solid transparent; margin-bottom: -2px;
  color: var(--muted); background: none; border-top: none; border-left: none; border-right: none;
  font-family: var(--fb);
}
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-spacer { flex: 1; }
.tab-search {
  padding: 8px 14px;
  display: flex; gap: 8px; align-items: center;
}
.tab-search input {
  padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px;
  font-size: 14px; font-family: var(--fb); width: 220px; max-width: 50vw;
}

/* MAIN */
#main { max-width: 1000px; margin: 0 auto; padding: 16px; }

/* PRODUCT ROW */
.prow {
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px; margin-bottom: 8px;
  display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap;
}
.ptitle { font-weight: 700; font-size: 14px; color: var(--ink); }
.phandle { font-size: 11px; color: var(--muted); margin-top: 1px; }
.chips-wrap { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; flex: 1; min-width: 0; }
.chip {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
  background: #fff7ed; color: var(--accent); border: 1px solid #fed7aa;
}
.chip.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.chip-x { cursor: pointer; opacity: .6; font-size: 11px; }
.chip-x:hover { opacity: 1; }
.chip-star { cursor: pointer; font-size: 11px; opacity: .5; margin-right: 1px; }
.chip-star.on { opacity: 1; }
.add-chip-btn {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
  border: 1px dashed var(--line); color: var(--muted); background: none; cursor: pointer;
}
.add-chip-btn:hover { border-color: var(--accent); color: var(--accent); }

/* COLLECTION SECTION */
.csect { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
.csect-hdr {
  padding: 14px 16px; display: flex; align-items: center; gap: 10px;
  cursor: pointer; user-select: none;
}
.csect-hdr:hover { background: var(--bg); }
.csect-title { font-weight: 700; font-size: 14px; flex: 1; }
.csect-meta { font-size: 12px; color: var(--muted); }
.csect-chevron { font-size: 11px; color: var(--muted); transition: transform .2s; }
.csect-chevron.open { transform: rotate(90deg); }
.csect-body { display: none; border-top: 1px solid var(--line); }
.csect-body.open { display: block; }
.csect-actions { padding: 10px 14px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.coll-prow {
  padding: 10px 14px; display: flex; align-items: flex-start; gap: 10px;
  border-bottom: 1px solid var(--line);
}
.coll-prow:last-child { border-bottom: none; }
.coll-pname { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.coll-phandle { font-size: 11px; color: var(--muted); }

/* PICKER DROPDOWN */
.picker-wrap { position: relative; display: inline-block; }
.picker-drop {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 300;
  background: #fff; border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,.12); min-width: 220px; max-height: 240px;
  overflow-y: auto; display: none;
}
.picker-drop.open { display: block; }
.picker-search { padding: 8px 10px; border-bottom: 1px solid var(--line); }
.picker-search input { width: 100%; border: none; outline: none; font-size: 13px; font-family: var(--fb); }
.picker-item { padding: 8px 12px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.picker-item:hover { background: var(--bg); }
.picker-item.sel { color: var(--accent); font-weight: 700; }

/* PUSH STATUS */
#push-status { font-size: 12px; padding: 4px 0 12px; }

/* TOAST */
#toast {
  position: fixed; bottom: 20px; right: 20px; z-index: 9999;
  background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 8px;
  font-size: 13px; font-weight: 600; display: none;
  box-shadow: 0 4px 16px rgba(0,0,0,.25);
}
#toast.err { background: #b91c1c; }

.hint { color: var(--muted); font-size: 13px; text-align: center; padding: 40px 20px; }
</style>
</head>
<body>

<header>
  <h1>✦ Collection Map</h1>
  <span id="hdr-counts" style="font-size:12px;color:rgba(255,255,255,.5)"></span>
  <button class="btn btn-outline btn-sm" onclick="refreshCollections()">↺ Collections</button>
  <button class="btn btn-green btn-sm" id="push-btn" onclick="pushToShopify()">↑ Push to Shopify</button>
</header>

<div class="tabs">
  <button class="tab active" id="tab-products" onclick="switchTab('products')">Products</button>
  <button class="tab" id="tab-collections" onclick="switchTab('collections')">Collections</button>
  <div class="tab-spacer"></div>
  <div class="tab-search" id="product-search-wrap">
    <input type="text" id="search-input" placeholder="Search products…" oninput="onSearchInput(this.value)">
  </div>
  <div class="tab-search" id="coll-search-wrap" style="display:none">
    <input type="text" id="coll-search-input" placeholder="Filter collections…" oninput="filterCollections(this.value)">
  </div>
</div>

<div id="main">
  <div id="push-status"></div>
  <div id="products-view">
    <p class="hint">Type a product name above to search</p>
  </div>
  <div id="collections-view" style="display:none"></div>
</div>

<div id="toast"></div>

<script>
const PROXY_BASE = 'https://cozy-dieffenbachia-95eb4b.netlify.app/.netlify/functions';
const MAP_URL    = PROXY_BASE + '/nt-collection-map';

let allCollections = [];
let mapData = {};
let currentTab = 'products';
let searchTimer = null;
let collExpandedData = {};   // collId → products[]
let productMemberships = {}; // handle → Set of collIds (built as collections are expanded)

async function api(body) {
  const r = await fetch(MAP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  return r.json();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
  document.getElementById('hdr-counts').textContent = 'Loading…';
  document.getElementById('products-view').innerHTML = '<p class="hint">Loading products…</p>';
  try {
    const res = await api({ action: 'load' });
    if (!res.ok) {
      document.getElementById('products-view').innerHTML = `<p class="hint" style="color:#b91c1c">Error: ${res.error}</p>`;
      return;
    }
    allCollections = res.collections || [];
    mapData        = res.map || {};
    document.getElementById('hdr-counts').textContent = `${allCollections.length} collections`;
    renderCollections();
    // Auto-load first 50 products
    await searchProducts('');
  } catch(e) {
    document.getElementById('products-view').innerHTML = `<p class="hint" style="color:#b91c1c">Error: ${e.message}</p>`;
  }
}
init();

// ── TABS ──────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('products-view').style.display    = tab === 'products'    ? '' : 'none';
  document.getElementById('collections-view').style.display = tab === 'collections' ? '' : 'none';
  document.getElementById('tab-products').classList.toggle('active',    tab === 'products');
  document.getElementById('tab-collections').classList.toggle('active', tab === 'collections');
  document.getElementById('product-search-wrap').style.display = tab === 'products'    ? '' : 'none';
  document.getElementById('coll-search-wrap').style.display    = tab === 'collections' ? '' : 'none';
}

// ── PRODUCT SEARCH ─────────────────────────────────────────────────────────────
function onSearchInput(val) {
  clearTimeout(searchTimer);
  if (!val.trim()) {
    document.getElementById('products-view').innerHTML = '<p class="hint">Type a product name above to search</p>';
    return;
  }
  document.getElementById('products-view').innerHTML = '<p class="hint">Searching…</p>';
  searchTimer = setTimeout(() => searchProducts(val.trim()), 400);
}

async function searchProducts(q) {
  try {
    const res = await api({ action: 'search_products', query: q });
    if (!res.ok) { document.getElementById('products-view').innerHTML = `<p class="hint" style="color:#b91c1c">Error: ${res.error}</p>`; return; }
    const products = res.products || [];
    if (!products.length) { document.getElementById('products-view').innerHTML = '<p class="hint">No products found</p>'; return; }
    document.getElementById('products-view').innerHTML = products.map(p => buildProductRow(p)).join('');
  } catch(e) {
    document.getElementById('products-view').innerHTML = `<p class="hint" style="color:#b91c1c">Error: ${e.message}</p>`;
  }
}

// ── PRODUCT ROW ────────────────────────────────────────────────────────────────
function buildProductRow(p) {
  const entry = mapData[p.handle] || { assigned: [], primary: null };
  const chipsHTML = (entry.assigned || []).map(cid => {
    const c = allCollections.find(x => x.id === cid);
    if (!c) return '';
    const isPrimary = entry.primary === cid;
    return `<span class="chip ${isPrimary ? 'primary' : ''}">
      <span class="chip-star ${isPrimary ? 'on' : ''}" onclick="setPrimary('${p.handle}','${cid}')" title="Set as primary">★</span>
      ${esc(c.title)}
      <span class="chip-x" onclick="removeAssigned('${p.handle}','${cid}')">×</span>
    </span>`;
  }).join('');

  const memTags = membershipTags(p.handle, null);
  return `<div class="prow" id="prow-${p.handle}">
    <div style="min-width:0;flex:1">
      <div class="ptitle">${esc(p.title)}</div>
      <div class="phandle">${p.handle}</div>
      ${memTags}
    </div>
    <div style="flex-shrink:0;display:flex;flex-direction:column;gap:5px;align-items:flex-end;padding-left:10px">
      <div class="chips-wrap" style="justify-content:flex-end">
        ${chipsHTML || '<span style="font-size:11px;color:var(--muted);font-style:italic">No display set</span>'}
      </div>
      <div class="picker-wrap" id="pwrap-${p.handle}">
        <button class="add-chip-btn" onclick="togglePicker('${p.handle}')">+ Set display collection</button>
        <div class="picker-drop" id="pdrop-${p.handle}" style="right:0;left:auto">
          <div class="picker-search"><input type="text" placeholder="Search collections…" oninput="filterPicker('${p.handle}',this.value)" onclick="event.stopPropagation()"></div>
          <div id="pitems-${p.handle}">${buildPickerItems(p.handle)}</div>
        </div>
      </div>
    </div>
  </div>`;
}

function buildPickerItems(handle, filter) {
  const entry = mapData[handle] || { assigned: [] };
  const lf = (filter || '').toLowerCase();
  return allCollections
    .filter(c => !lf || c.title.toLowerCase().includes(lf))
    .map(c => {
      const sel = (entry.assigned || []).includes(c.id);
      return `<div class="picker-item ${sel ? 'sel' : ''}" onclick="toggleAssigned('${handle}','${c.id}')">${sel ? '✓ ' : ''}${esc(c.title)}</div>`;
    }).join('');
}

function filterPicker(handle, val) {
  document.getElementById('pitems-' + handle).innerHTML = buildPickerItems(handle, val);
}

function togglePicker(handle) {
  const drop = document.getElementById('pdrop-' + handle);
  const open = drop.classList.contains('open');
  closeAllPickers();
  if (!open) { drop.classList.add('open'); drop.querySelector('input')?.focus(); }
}
function closeAllPickers() {
  document.querySelectorAll('.picker-drop.open').forEach(d => d.classList.remove('open'));
}
document.addEventListener('click', e => { if (!e.target.closest('.picker-wrap')) closeAllPickers(); });

function membershipTags(handle, excludeCollId) {
  const ids = productMemberships[handle];
  if (!ids || !ids.size) return '';
  const tags = [...ids]
    .filter(id => id !== excludeCollId)
    .map(id => allCollections.find(c => c.id === id)?.title)
    .filter(Boolean);
  if (!tags.length) return '';
  return `<div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:3px;align-items:center">
    <span style="font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px">In:</span>
    ${tags.map(t => `<span style="font-size:10px;background:#f1f5f9;color:var(--ink2);border-radius:4px;padding:1px 6px;border:1px solid var(--line)">${esc(t)}</span>`).join('')}
  </div>`;
}

// ── ASSIGN LOGIC ───────────────────────────────────────────────────────────────
function toggleAssigned(handle, collId) {
  if (!mapData[handle]) mapData[handle] = { assigned: [], primary: null };
  const arr = mapData[handle].assigned;
  const idx = arr.indexOf(collId);
  if (idx === -1) {
    arr.push(collId);
    if (!mapData[handle].primary) mapData[handle].primary = collId;
    toast('Added: ' + (allCollections.find(c=>c.id===collId)?.title || collId));
  } else {
    arr.splice(idx, 1);
    if (mapData[handle].primary === collId) mapData[handle].primary = arr[0] || null;
    toast('Removed collection');
  }
  refreshProductRow(handle);
  refreshCollectionProductRow(handle);
  saveMap();
}

function removeAssigned(handle, collId) {
  if (!mapData[handle]) return;
  mapData[handle].assigned = (mapData[handle].assigned || []).filter(id => id !== collId);
  if (mapData[handle].primary === collId) mapData[handle].primary = mapData[handle].assigned[0] || null;
  refreshProductRow(handle);
  refreshCollectionProductRow(handle);
  saveMap();
}

function setPrimary(handle, collId) {
  if (!mapData[handle]) return;
  mapData[handle].primary = collId;
  toast('Primary: ' + (allCollections.find(c=>c.id===collId)?.title || collId));
  refreshProductRow(handle);
  refreshCollectionProductRow(handle);
  saveMap();
}

function refreshProductRow(handle) {
  const el = document.getElementById('prow-' + handle);
  if (!el) return;
  // Re-fetch current product data from the DOM title/handle
  const titleEl = el.querySelector('.ptitle');
  const handleEl = el.querySelector('.phandle');
  const p = { handle, title: titleEl?.textContent || handle, assigned: mapData[handle]?.assigned || [], primary: mapData[handle]?.primary };
  el.outerHTML = buildProductRow(p);
}

// ── COLLECTION VIEW ────────────────────────────────────────────────────────────
function renderCollections() {
  const el = document.getElementById('collections-view');
  if (!allCollections.length) { el.innerHTML = '<p class="hint">No collections. Click ↺ Collections to reload.</p>'; return; }
  el.innerHTML = allCollections.map(c => buildCollSection(c)).join('');
}

function filterCollections(q) {
  const lq = q.toLowerCase();
  document.querySelectorAll('.csect').forEach(el => {
    const title = el.querySelector('.csect-title')?.textContent.toLowerCase() || '';
    el.style.display = !lq || title.includes(lq) ? '' : 'none';
  });
}

function buildCollSection(c) {
  const assignedCount = Object.values(mapData).filter(m => (m.assigned||[]).includes(c.id)).length;
  return `<div class="csect" id="csect-${c.id}">
    <div class="csect-hdr" onclick="toggleColl('${c.id}')">
      <span class="csect-title">${esc(c.title)}</span>
      <span class="csect-meta" id="cmeta-${c.id}">${assignedCount} display-assigned</span>
      <span class="csect-chevron" id="cchev-${c.id}">▶</span>
    </div>
    <div class="csect-body" id="cbody-${c.id}">
      <div class="csect-actions">
        <button class="btn btn-sm btn-green" onclick="setAllPrimaryInColl('${c.id}')">★ Set as primary for all in this collection</button>
      </div>
      <div id="cprods-${c.id}"><p class="hint">Loading products…</p></div>
    </div>
  </div>`;
}

async function toggleColl(collId) {
  const body  = document.getElementById('cbody-' + collId);
  const chev  = document.getElementById('cchev-' + collId);
  const isOpen = body.classList.contains('open');

  // Close all others
  document.querySelectorAll('.csect-body.open').forEach(b => b.classList.remove('open'));
  document.querySelectorAll('.csect-chevron.open').forEach(c => c.classList.remove('open'));

  if (!isOpen) {
    body.classList.add('open');
    chev.classList.add('open');
    await loadCollectionProducts(collId);
  }
}

async function loadCollectionProducts(collId) {
  const el = document.getElementById('cprods-' + collId);
  if (collExpandedData[collId]) { renderCollProducts(collId, collExpandedData[collId]); return; }
  el.innerHTML = '<p class="hint">Loading…</p>';
  try {
    const res = await api({ action: 'collection_products', collection_id: collId });
    if (!res.ok) { el.innerHTML = `<p class="hint" style="color:#b91c1c">Error: ${res.error}</p>`; return; }
    collExpandedData[collId] = res.products || [];
    renderCollProducts(collId, collExpandedData[collId]);
  } catch(e) {
    el.innerHTML = `<p class="hint" style="color:#b91c1c">Error: ${e.message}</p>`;
  }
}

function renderCollProducts(collId, products) {
  const el = document.getElementById('cprods-' + collId);
  const metaEl = document.getElementById('cmeta-' + collId);
  const assignedCount = Object.values(mapData).filter(m => (m.assigned||[]).includes(collId)).length;
  if (metaEl) metaEl.textContent = `${products.length} products · ${assignedCount} display-assigned`;

  // Build reverse membership map
  products.forEach(p => {
    if (!productMemberships[p.handle]) productMemberships[p.handle] = new Set();
    productMemberships[p.handle].add(collId);
  });

  if (!products.length) { el.innerHTML = '<p class="hint">No products in this collection</p>'; return; }
  el.innerHTML = products.map(p => buildCollProductRow(p, collId)).join('');
}

function buildCollProductRow(p, collId) {
  const entry    = mapData[p.handle] || { assigned: [], primary: null };
  const assigned = entry.assigned || [];
  const primary  = entry.primary || null;
  const isThisColl = assigned.includes(collId);
  const isPrimary  = primary === collId;
  const uid = `${collId}__${p.handle}`;

  // Existing assigned chips (all, not just this collection)
  const chipsHTML = assigned.map(cid => {
    const c = allCollections.find(x => x.id === cid);
    if (!c) return '';
    const isp = primary === cid;
    return `<span class="chip ${isp ? 'primary' : ''}" style="font-size:11px;padding:2px 8px;gap:3px">
      <span class="chip-star ${isp ? 'on' : ''}" onclick="setPrimaryFromColl('${esc(p.handle)}','${cid}')" title="Set as primary">★</span>
      ${esc(c.title)}
      <span class="chip-x" onclick="removeAssignedFromColl('${esc(p.handle)}','${cid}','${collId}')">×</span>
    </span>`;
  }).join('');

  return `<div class="coll-prow" id="crow-${uid}">
    <div style="flex:1;min-width:0;overflow:hidden">
      <div class="coll-pname">${esc(p.title)}</div>
      <div class="coll-phandle">${esc(p.handle)}</div>
      <div style="margin-top:5px;display:flex;flex-wrap:wrap;gap:4px;align-items:center">
        ${chipsHTML || '<span style="font-size:11px;color:var(--muted);font-style:italic">No display collection set</span>'}
      </div>
      ${membershipTags(p.handle, collId)}
    </div>
    <div style="flex-shrink:0;display:flex;flex-direction:column;gap:5px;align-items:flex-end;padding-left:10px">
      <button class="btn btn-sm ${isThisColl ? (isPrimary ? 'btn-green' : 'btn-accent') : 'btn-ghost'}"
        onclick="quickAssignThisColl('${esc(p.handle)}','${collId}')">
        ${isThisColl ? (isPrimary ? '★ Primary' : '✓ Assigned') : '+ This collection'}
      </button>
      <div class="picker-wrap" id="cpwrap-${uid}">
        <button class="add-chip-btn" style="font-size:11px;padding:3px 8px" onclick="toggleCollPicker('${uid}')">Other collection…</button>
        <div class="picker-drop" id="cpdrop-${uid}" style="right:0;left:auto">
          <div class="picker-search"><input type="text" placeholder="Search…" oninput="filterCollPicker('${uid}','${esc(p.handle)}',this.value)" onclick="event.stopPropagation()"></div>
          <div id="cpitems-${uid}">${buildCollPickerItems(p.handle, uid)}</div>
        </div>
      </div>
    </div>
  </div>`;
}

function quickAssignThisColl(handle, collId) {
  const assigned = mapData[handle]?.assigned || [];
  const isAssigned = assigned.includes(collId);
  if (!isAssigned) {
    // Assign + set as primary
    if (!mapData[handle]) mapData[handle] = { assigned: [], primary: null };
    mapData[handle].assigned.push(collId);
    mapData[handle].primary = collId;
    toast('Assigned + set as primary');
  } else if (mapData[handle].primary !== collId) {
    // Already assigned but not primary → set primary
    mapData[handle].primary = collId;
    toast('Set as primary');
  } else {
    // Already primary → remove
    mapData[handle].assigned = mapData[handle].assigned.filter(id => id !== collId);
    mapData[handle].primary = mapData[handle].assigned[0] || null;
    toast('Removed');
  }
  refreshCollectionProductRow(handle);
  refreshProductRow(handle);
  saveMap();
}

function buildCollPickerItems(handle, uid, filter) {
  const entry = mapData[handle] || { assigned: [] };
  const lf = (filter || '').toLowerCase();
  return allCollections
    .filter(c => !lf || c.title.toLowerCase().includes(lf))
    .map(c => {
      const sel = (entry.assigned || []).includes(c.id);
      return `<div class="picker-item ${sel ? 'sel' : ''}" onclick="toggleAssignedFromCollPicker('${handle}','${c.id}','${uid}')">${sel ? '✓ ' : ''}${esc(c.title)}</div>`;
    }).join('');
}

function filterCollPicker(uid, handle, val) {
  document.getElementById('cpitems-' + uid).innerHTML = buildCollPickerItems(handle, uid, val);
}

function toggleCollPicker(uid) {
  const drop = document.getElementById('cpdrop-' + uid);
  const open = drop.classList.contains('open');
  closeAllPickers();
  if (!open) { drop.classList.add('open'); drop.querySelector('input')?.focus(); }
}

function toggleAssignedFromCollPicker(handle, cid, uid) {
  toggleAssigned(handle, cid);
  const itemsEl = document.getElementById('cpitems-' + uid);
  if (itemsEl) itemsEl.innerHTML = buildCollPickerItems(handle, uid);
  const collId = uid.split('__')[0];
  refreshCollRow(uid, handle, collId);
}

function removeAssignedFromColl(handle, cid, collId) {
  removeAssigned(handle, cid);
  const uid = `${collId}__${handle}`;
  refreshCollRow(uid, handle, collId);
}

function setPrimaryFromColl(handle, cid) {
  setPrimary(handle, cid);
  refreshCollectionProductRow(handle);
  refreshProductRow(handle);
}

function refreshCollRow(uid, handle, collId) {
  const el = document.getElementById('crow-' + uid);
  if (!el) return;
  const prods = collExpandedData[collId] || [];
  const p = prods.find(x => x.handle === handle);
  if (p) el.outerHTML = buildCollProductRow(p, collId);
}


function setAllPrimaryInColl(collId) {
  const products = collExpandedData[collId] || [];
  if (!products.length) { toast('Expand collection first to load its products', true); return; }
  products.forEach(p => {
    if (!mapData[p.handle]) mapData[p.handle] = { assigned: [], primary: null };
    if (!(mapData[p.handle].assigned || []).includes(collId)) mapData[p.handle].assigned.push(collId);
    mapData[p.handle].primary = collId;
  });
  renderCollProducts(collId, products);
  const c = allCollections.find(x => x.id === collId);
  toast(`★ Set ${c?.title} as primary for ${products.length} products`);
  saveMap();
}

function refreshCollectionProductRow(handle) {
  Object.keys(collExpandedData).forEach(collId => {
    const uid = `${collId}__${handle}`;
    if (document.getElementById('crow-' + uid)) refreshCollRow(uid, handle, collId);
  });
}

// ── SAVE / PUSH ────────────────────────────────────────────────────────────────
async function saveMap() {
  try { await api({ action: 'save_map', map: mapData }); } catch {}
}

async function refreshCollections() {
  document.getElementById('hdr-counts').textContent = 'Refreshing…';
  try {
    const res = await api({ action: 'refresh_collections' });
    if (res.ok) {
      allCollections = res.collections || [];
      collExpandedData = {};
      document.getElementById('hdr-counts').textContent = `${allCollections.length} collections`;
      renderCollections();
      toast(`${allCollections.length} collections loaded`);
    }
  } catch(e) { toast('Error: ' + e.message, true); }
}

async function pushToShopify() {
  const btn = document.getElementById('push-btn');
  const statusEl = document.getElementById('push-status');
  btn.disabled = true; btn.textContent = '↑ Pushing…';
  statusEl.style.color = 'var(--muted)';
  statusEl.textContent = 'Pushing metafields to Shopify…';
  try {
    const res = await api({ action: 'push_to_shopify', map: mapData, collections: allCollections });
    if (res.ok) {
      const failMsg = res.failed?.length ? ` · ${res.failed.length} failed` : '';
      statusEl.style.color = 'var(--green)';
      statusEl.textContent = `✓ Pushed ${res.pushed} products${failMsg} — metafield: nukkad.display_collection`;
      toast(`Pushed ${res.pushed} products`);
    } else {
      statusEl.style.color = '#b91c1c';
      statusEl.textContent = 'Error: ' + (res.error || 'push failed');
    }
  } catch(e) {
    statusEl.style.color = '#b91c1c';
    statusEl.textContent = 'Error: ' + e.message;
  } finally {
    btn.disabled = false; btn.textContent = '↑ Push to Shopify';
  }
}

// ── UTILS ──────────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
let _tt;
function toast(msg, err) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = err ? 'err' : '';
  el.style.display = 'block';
  clearTimeout(_tt); _tt = setTimeout(() => el.style.display = 'none', 2800);
}
</script>
