<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NT Production Prints</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Nunito,Helvetica Neue,sans-serif;background:#f6f0e8;color:#3a2b1d;min-height:100vh}
:root{--accent:#d4541f;--ink:#3a2b1d;--ink2:#6f5b46;--muted:#9c8a76;--line:#e9ddca}

.header{background:#fff;border-bottom:3px solid var(--accent);padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;flex-wrap:wrap}
.header h1{font-family:Fraunces,Georgia,serif;font-size:1.2rem;color:var(--ink)}
.header-sub{font-size:.75rem;color:var(--muted)}
.hbtn{padding:6px 14px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:.8rem;cursor:pointer;white-space:nowrap}
.hbtn:hover{border-color:var(--accent);color:var(--accent)}
.hbtn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}

.controls{padding:10px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fdf5ec;border-bottom:1px solid var(--line)}
.search-wrap{flex:1;min-width:200px;position:relative}
.search-wrap input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:8px;font-size:.88rem;background:#fff;color:var(--ink)}
.search-wrap .sico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:.85rem}
.badge{background:var(--accent);color:#fff;border-radius:10px;font-size:.7rem;padding:1px 7px;font-weight:700}

/* ── BULK BAR ── */
#selBar{display:none;padding:8px 20px;background:#3a2b1d;color:#fff;align-items:center;gap:10px;font-size:.85rem;flex-wrap:wrap}
#selBar.show{display:flex}
#selBar button{padding:5px 13px;border-radius:6px;border:none;cursor:pointer;font-size:.8rem;font-weight:700}
.sel-multi{background:var(--accent);color:#fff}
.sel-dl{background:#fff;color:var(--ink)}
.sel-cancel{background:transparent;color:#bbb;text-decoration:underline;font-weight:400}

/* ── LIST ── */
.list-wrap{padding:12px 20px;display:flex;flex-direction:column;gap:6px}
.section-label{font-size:.68rem;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding:8px 0 4px}

.row{background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;gap:12px;padding:8px 12px;transition:box-shadow .15s;position:relative}
.row:hover{box-shadow:0 2px 12px rgba(0,0,0,.08)}
.row.missing{border-color:#e74c3c}
.row.selected{outline:2px solid var(--accent);outline-offset:-1px}
.row.is-new{border-color:#2ecc71;border-width:2px}

.row-chk{width:18px;height:18px;border-radius:4px;border:2px solid var(--line);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:#fff}
.row-chk.checked{background:var(--accent);border-color:var(--accent)}

.row-thumb{width:90px;height:90px;flex-shrink:0;border-radius:6px;overflow:hidden;background:#f5ece0;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.row-thumb img{width:100%;height:100%;object-fit:cover}
.row-thumb .no-img{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:.65rem;text-align:center;padding:6px}
.row-thumb .no-img span:first-child{font-size:1.2rem}

.row-info{flex:1;min-width:0}
.row-title{font-size:.88rem;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-handle{font-size:.72rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-size{font-size:.72rem;color:var(--ink2);margin-top:4px}
.row-link{font-size:.72rem;margin-top:6px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.row-link.has-link{color:#2ecc71}
.row-link.no-link{color:var(--accent);text-decoration:underline}

.new-badge{position:absolute;top:8px;left:8px;background:#2ecc71;color:#fff;font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:10px;letter-spacing:.05em}
.miss-badge{position:absolute;top:8px;left:8px;background:#e74c3c;color:#fff;font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:10px;letter-spacing:.05em}

.row-actions{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.act-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:.75rem;cursor:pointer;white-space:nowrap;text-align:center}
.act-btn:hover{border-color:var(--accent);color:var(--accent)}
.act-btn.orange{background:var(--accent);color:#fff;border-color:var(--accent)}
.act-btn.orange:hover{background:#b8401a}
.dl-wrap{position:relative}
.dl-menu{display:none;position:absolute;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:7px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:50;min-width:140px;overflow:hidden}
.dl-wrap:hover .dl-menu,.dl-wrap:focus-within .dl-menu{display:block}
.dl-menu button{display:block;width:100%;padding:8px 14px;text-align:left;background:none;border:none;font-size:.78rem;color:var(--ink2);cursor:pointer;white-space:nowrap}
.dl-menu button:hover{background:#fdf5ec;color:var(--accent)}

/* ── INLINE EDIT ── */
.editable{cursor:pointer;border-bottom:1px dashed var(--muted)}
.editable:hover{border-color:var(--accent);color:var(--accent)}
.inline-input{border:1px solid var(--accent);border-radius:4px;padding:2px 6px;font-size:.82rem;color:var(--ink);width:80px}
.size-wrap{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:.72rem;color:var(--ink2)}
.del-btn{background:none;border:none;color:#ccc;cursor:pointer;font-size:.8rem;padding:2px 4px;flex-shrink:0}
.del-btn:hover{color:#e74c3c}

/* ── MODAL ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:12px;padding:24px;max-width:440px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.modal h2{font-family:Fraunces,Georgia,serif;font-size:1.05rem;margin-bottom:14px;color:var(--ink)}
.modal label{font-size:.78rem;color:var(--ink2);display:block;margin-bottom:4px;margin-top:8px}
.modal input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:.86rem;color:var(--ink);margin-bottom:6px}
.modal .mrow{display:flex;gap:8px}
.modal .mrow input{margin-bottom:0}
.modal-btns{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.modal-btns button{padding:7px 18px;border-radius:7px;border:none;cursor:pointer;font-size:.84rem;font-weight:700}
.btn-cancel{background:#f0e8dc;color:var(--ink2)}
.btn-save{background:var(--accent);color:#fff}

/* ── DRIVE PICKER MODAL ── */
#driveModal .modal{max-width:640px}
.drive-search{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:.88rem;margin-bottom:12px;color:var(--ink)}
.drive-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;max-height:380px;overflow-y:auto}
.drive-file{border:2px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.drive-file:hover{border-color:var(--accent)}
.drive-file img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#f5ece0}
.drive-file-name{font-size:.65rem;color:var(--ink2);padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.csv-area{font-size:.77rem;color:var(--ink2);background:#fdf5ec;border-radius:6px;padding:10px;margin-bottom:10px;line-height:1.7}
.csv-area code{background:#e9ddca;border-radius:3px;padding:0 4px;font-size:.73rem}
#csvPreview{font-size:.73rem;color:var(--ink2);max-height:100px;overflow-y:auto;background:#f6f0e8;border-radius:5px;padding:8px;display:none;margin-top:6px}

.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:24px;right:24px;background:#3a2b1d;color:#fff;padding:10px 20px;border-radius:8px;font-size:.83rem;opacity:0;pointer-events:none;transition:opacity .3s;z-index:999;max-width:320px}
#toast.show{opacity:1}
#offCanvas{display:none}
.empty-msg,.loading-msg{text-align:center;padding:50px 20px;color:var(--muted);font-size:.88rem}
</style>
</head>
<body>

<div class="header">
  <h1>🖨 Production Prints</h1>
  <span class="header-sub" id="headerSub">Loading…</span>
  <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
    <button class="hbtn accent" onclick="scanDrive(this)">🔍 Scan Drive Folder</button>
    <label class="hbtn accent" style="cursor:pointer">
      📤 Bulk Upload Images
      <input type="file" accept="image/*" multiple style="display:none" onchange="bulkUploadImages(this)">
    </label>
    <button class="hbtn" onclick="openAddModal()">+ Add Product</button>
    <button class="hbtn" onclick="openCsvModal()">↑ CSV Upload</button>
    <button class="hbtn" onclick="refreshProducts()">↺ Refresh</button>
  </div>
</div>

<div class="controls">
  <div class="search-wrap">
    <span class="sico">🔍</span>
    <input id="searchInput" type="text" placeholder="Search products…" oninput="filterList()">
  </div>
  <span id="countBadge" class="badge">–</span>
  <label style="display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--ink2);cursor:pointer">
    <input type="checkbox" id="selAllChk" onchange="toggleSelectAll(this.checked)"> Select all
  </label>
</div>

<div id="selBar">
  <span id="selCount">0 selected</span>
  <button class="sel-multi" onclick="genMultiA4()">📄 One A4 (all together)</button>
  <button class="sel-dl" onclick="bulkDownload()">⬇ Download each (separate A4s)</button>
  <button class="sel-cancel" onclick="cancelSelect()">Cancel</button>
</div>

<div class="list-wrap" id="listWrap">
  <div class="loading-msg"><span class="spinner"></span> Loading products…</div>
</div>

<canvas id="offCanvas"></canvas>
<div id="toast"></div>

<!-- DRIVE PICKER MODAL -->
<div id="driveModal" class="modal-backdrop" style="display:none" onclick="if(event.target===this)closeDrivePicker()">
  <div class="modal" style="max-width:640px">
    <h2>Browse Drive</h2>
    <input class="drive-search" id="driveSearch" type="text" placeholder="Search all Drive… (empty = show folder)" oninput="filterDriveFiles()">
    <div class="drive-grid" id="driveGrid"><div style="color:var(--muted);font-size:.85rem">Loading…</div></div>
    <div class="modal-btns" style="margin-top:14px">
      <button class="btn-cancel" onclick="closeDrivePicker()">Cancel</button>
    </div>
  </div>
</div>

<!-- MANUAL ADD MODAL -->
<div id="addModal" class="modal-backdrop" style="display:none" onclick="if(event.target===this)closeAddModal()">
  <div class="modal">
    <h2>Add Product Manually</h2>
    <label>Title *</label>
    <input id="addTitle" type="text" placeholder="e.g. All Will Be Okay">
    <label>Handle * (URL slug)</label>
    <input id="addHandle" type="text" placeholder="e.g. all-will-be-okay">
    <label>Size in mm (optional)</label>
    <div class="mrow">
      <input id="addSizeW" type="number" placeholder="Width mm" step="0.1">
      <input id="addSizeH" type="number" placeholder="Height mm" step="0.1">
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeAddModal()">Cancel</button>
      <button class="btn-save" onclick="saveAddModal()">Add</button>
    </div>
  </div>
</div>

<!-- DRIVE LINK MODAL -->
<div id="linkModal" class="modal-backdrop" style="display:none" onclick="if(event.target===this)closeLinkModal()">
  <div class="modal">
    <h2 id="linkModalTitle">Set Drive Link</h2>
    <label>Google Drive link (must be shared → Anyone with link → Viewer)</label>
    <input id="linkInput" type="text" placeholder="https://drive.google.com/file/d/…/view">
    <label>Physical size in mm (optional — used for print scaling)</label>
    <div class="mrow">
      <input id="sizeW" type="number" placeholder="Width mm" step="0.1">
      <input id="sizeH" type="number" placeholder="Height mm" step="0.1">
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeLinkModal()">Cancel</button>
      <button class="btn-save" onclick="saveLinkModal()">Save</button>
    </div>
  </div>
</div>

<!-- CSV MODAL -->
<div id="csvModal" class="modal-backdrop" style="display:none" onclick="if(event.target===this)closeCsvModal()">
  <div class="modal">
    <h2>Upload Drive Links via CSV</h2>
    <div class="csv-area">
      Two columns, header row required:<br>
      <code>handle,drive_link</code> &nbsp;or&nbsp; <code>title,drive_link</code><br>
      Optional extra columns: <code>size_w_mm</code> &nbsp;<code>size_h_mm</code>
    </div>
    <input id="csvFile" type="file" accept=".csv,text/csv">
    <div id="csvPreview"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeCsvModal()">Cancel</button>
      <button class="btn-save" onclick="importCsv()">Import</button>
    </div>
  </div>
</div>

<script>
const API = 'https://cozy-dieffenbachia-95eb4b.netlify.app/.netlify/functions/nt-production-prints';
const A4_W = 2480, A4_H = 3508, MARGIN = 118, GAP = 59;

let allProducts = [];
let links = {};
let filtered = [];
let selectedHandles = new Set();
let editingHandle = null;

// ── INIT ──────────────────────────────────────────────────────────────────────

async function init() {
  try {
    const res = await apiFetch({ action: 'load' });
    if (!res.ok) throw new Error(res.error || 'Load failed');
    allProducts = res.products || [];
    links = res.links || {};
    filtered = allProducts;
    renderList(filtered);
    updateHeader();
  } catch(e) {
    document.getElementById('listWrap').innerHTML = `<div class="loading-msg">Error: ${e.message}</div>`;
  }
}

function updateHeader() {
  const total = allProducts.length;
  const missing = allProducts.filter(p => !links[p.handle]?.drive_link).length;
  document.getElementById('headerSub').textContent = `${total} products · ${missing} without Drive link`;
  document.getElementById('countBadge').textContent = filtered.length || total;
}

// ── RENDER ────────────────────────────────────────────────────────────────────

function filterList() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  filtered = q ? allProducts.filter(p => p.title.toLowerCase().includes(q) || p.handle.includes(q)) : allProducts;
  renderList(filtered);
  document.getElementById('countBadge').textContent = filtered.length;
}

function renderList(products) {
  const wrap = document.getElementById('listWrap');
  if (!products.length) { wrap.innerHTML = '<div class="empty-msg">No products found.</div>'; return; }

  // new products first, then missing Drive link, then linked
  const isNew   = products.filter(p => p.is_new);
  const missing = products.filter(p => !p.is_new && !links[p.handle]?.drive_link);
  const hasLink = products.filter(p => !p.is_new &&  links[p.handle]?.drive_link);

  let html = '';
  if (isNew.length) {
    html += `<div class="section-label">🆕 New products (${isNew.length}) — add Drive link</div>`;
    html += isNew.map(p => rowHTML(p)).join('');
    if (missing.length || hasLink.length) html += '<div style="margin-top:8px"></div>';
  }
  if (missing.length) {
    html += `<div class="section-label">Missing Drive link (${missing.length})</div>`;
    html += missing.map(p => rowHTML(p)).join('');
    if (hasLink.length) html += '<div style="margin-top:8px"></div>';
  }
  if (hasLink.length) {
    if (missing.length || isNew.length) html += `<div class="section-label">With Drive link (${hasLink.length})</div>`;
    html += hasLink.map(p => rowHTML(p)).join('');
  }

  wrap.innerHTML = html;
}

function rowHTML(p) {
  const lk = links[p.handle] || {};
  const hasDrive = !!lk.drive_link;
  const isSelected = selectedHandles.has(p.handle);

  const thumbHtml = lk.drive_id
    ? `<img src="https://drive.google.com/thumbnail?id=${lk.drive_id}&sz=w300" alt="" loading="lazy"
         onerror="this.parentNode.innerHTML='<div class=no-img><span>🔒</span><span>Not public</span></div>'">`
    : `<div class="no-img"><span>📂</span><span>No image yet</span></div>`;

  const lkW = lk.size_w_mm || '';
  const lkH = lk.size_h_mm || '';
  const badge = p.is_new
    ? '<span class="new-badge">NEW</span>'
    : (!hasDrive ? '<span class="miss-badge">NO LINK</span>' : '');
  const isManual = !!p.is_new;

  return `<div class="row${p.is_new ? ' is-new' : (!hasDrive ? ' missing' : '')}${isSelected ? ' selected' : ''}" id="row-${p.handle}">
    <div class="row-chk${isSelected ? ' checked' : ''}" onclick="toggleSelect('${p.handle}')">${isSelected ? '✓' : ''}</div>
    <div class="row-thumb" onclick="openDrivePicker('${p.handle}')">
      ${thumbHtml}
      ${badge}
    </div>
    <div class="row-info">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
        <div>
          <div class="row-title" title="${escHtml(p.title)}">${escHtml(p.title)}</div>
          <div class="row-handle">${p.handle}</div>
        </div>
        <button class="del-btn" title="Delete" onclick="deleteRow('${p.handle}',${isManual})" style="margin-top:2px">✕</button>
      </div>
      <div class="size-wrap">
        📐 W
        <input class="inline-input" type="number" placeholder="mm" step="0.1" value="${lkW}"
          onchange="saveSize('${p.handle}','w',this.value)" style="width:58px">
        L
        <input class="inline-input" type="number" placeholder="mm" step="0.1" value="${lkH}"
          onchange="saveSize('${p.handle}','h',this.value)" style="width:58px">
        <span style="color:var(--muted)">mm</span>
      </div>
      <div class="row-link ${hasDrive ? 'has-link' : 'no-link'}" onclick="openLinkModal('${p.handle}')">
        ${hasDrive ? '✓ Drive linked — click to change' : '+ Paste Drive link'}
      </div>
    </div>
    <div class="row-actions">
      <button class="act-btn" onclick="openDrivePicker('${p.handle}')">🗂 Browse Drive</button>
      <label class="act-btn" style="cursor:pointer;text-align:center">
        📤 Upload Image
        <input type="file" accept="image/*" style="display:none" onchange="uploadImage('${p.handle}', this)">
      </label>
      <div class="dl-wrap">
        <button class="act-btn orange" style="width:100%">⬇ Download ▾</button>
        <div class="dl-menu">
          <button onclick="genA4('${p.handle}','single')">Single A4</button>
          <button onclick="genA4('${p.handle}','tile2')">Tile ×2</button>
          <button onclick="genA4('${p.handle}','tilemax')">Tile Max</button>
        </div>
      </div>
      <button class="act-btn" onclick="toggleSelect('${p.handle}')">☐ Select</button>
    </div>
  </div>`;
}

// ── SELECT ────────────────────────────────────────────────────────────────────

function toggleSelect(handle) {
  if (selectedHandles.has(handle)) {
    selectedHandles.delete(handle);
  } else {
    selectedHandles.add(handle);
  }
  updateRowUI(handle);
  updateSelBar();
}

function toggleSelectAll(checked) {
  selectedHandles.clear();
  if (checked) filtered.forEach(p => selectedHandles.add(p.handle));
  filtered.forEach(p => updateRowUI(p.handle));
  updateSelBar();
}

function cancelSelect() {
  selectedHandles.clear();
  document.getElementById('selAllChk').checked = false;
  filtered.forEach(p => updateRowUI(p.handle));
  updateSelBar();
}

function updateRowUI(handle) {
  const row = document.getElementById(`row-${handle}`);
  const chk = row?.querySelector('.row-chk');
  const sel = selectedHandles.has(handle);
  if (row) row.classList.toggle('selected', sel);
  if (chk) { chk.classList.toggle('checked', sel); chk.textContent = sel ? '✓' : ''; }
}

function updateSelBar() {
  const bar = document.getElementById('selBar');
  const n = selectedHandles.size;
  if (n > 0) {
    bar.classList.add('show');
    document.getElementById('selCount').textContent = `${n} selected`;
  } else {
    bar.classList.remove('show');
  }
}

// ── LINK MODAL ────────────────────────────────────────────────────────────────

function openLinkModal(handle) {
  editingHandle = handle;
  const p = allProducts.find(x => x.handle === handle);
  const lk = links[handle] || {};
  document.getElementById('linkModalTitle').textContent = p ? p.title : handle;
  document.getElementById('linkInput').value = lk.drive_link || '';
  document.getElementById('sizeW').value = lk.size_w_mm || '';
  document.getElementById('sizeH').value = lk.size_h_mm || '';
  document.getElementById('linkModal').style.display = 'flex';
}

function closeLinkModal() { document.getElementById('linkModal').style.display = 'none'; editingHandle = null; }

async function saveLinkModal() {
  const handle = editingHandle;
  const url = document.getElementById('linkInput').value.trim();
  const w = parseFloat(document.getElementById('sizeW').value) || null;
  const h = parseFloat(document.getElementById('sizeH').value) || null;
  const drive_id = extractDriveId(url);
  closeLinkModal();
  try {
    await apiFetch({ action: 'save_link', handle, drive_link: url, drive_id, size_w_mm: w, size_h_mm: h });
    links[handle] = { drive_link: url, drive_id, size_w_mm: w, size_h_mm: h };
    // mark as no longer new once link is added
    const p = allProducts.find(x => x.handle === handle);
    if (p) p.is_new = false;
    filterList();
    updateHeader();
    toast('Link saved');
  } catch(e) { toast('Error: ' + e.message); }
}

// ── CSV ───────────────────────────────────────────────────────────────────────

function openCsvModal() { document.getElementById('csvModal').style.display = 'flex'; }
function closeCsvModal() {
  document.getElementById('csvModal').style.display = 'none';
  document.getElementById('csvPreview').style.display = 'none';
}

document.getElementById('csvFile').addEventListener('change', function() {
  const file = this.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const rows = parseCsv(e.target.result);
    const prev = document.getElementById('csvPreview');
    prev.style.display = 'block';
    prev.textContent = rows.slice(0,5).map(r => JSON.stringify(r)).join('\n') + (rows.length > 5 ? `\n…and ${rows.length-5} more` : '');
  };
  reader.readAsText(file);
});

async function importCsv() {
  const file = document.getElementById('csvFile').files[0];
  if (!file) { toast('No file selected'); return; }
  const text = await file.text();
  const rows = parseCsv(text);
  if (!rows.length) { toast('No data rows found'); return; }

  const titleToHandle = {};
  allProducts.forEach(p => { titleToHandle[p.title.toLowerCase()] = p.handle; });

  // fuzzy title match: normalize then find best product
  function normT(s) { return (s||'').toLowerCase().replace(/[^a-z0-9]/g,' ').replace(/\s+/g,' ').trim(); }
  function fuzzyFindHandle(csvTitle) {
    const exact = titleToHandle[csvTitle.toLowerCase()];
    if (exact) return exact;
    const norm = normT(csvTitle);
    let best = null, bestScore = 0;
    for (const p of allProducts) {
      const pn = normT(p.title);
      if (pn === norm) return p.handle;
      if (pn.includes(norm) || norm.includes(pn)) { if (60 > bestScore) { bestScore = 60; best = p.handle; } continue; }
      const aw = new Set(norm.split(' ')), bw = pn.split(' ');
      const sh = bw.filter(w=>aw.has(w)).length;
      const sc = Math.round(sh / Math.max(aw.size, bw.length) * 50);
      if (sc > bestScore) { bestScore = sc; best = p.handle; }
    }
    return bestScore >= 30 ? best : null;
  }

  const newLinks = {};
  const unmatched = [];
  let matched = 0;
  rows.forEach(row => {
    const handle = row.handle || (row.title ? fuzzyFindHandle(row.title) : null);
    if (!handle || !row.drive_link) { if (row.title) unmatched.push(row.title); return; }
    const drive_id = extractDriveId(row.drive_link);
    newLinks[handle] = { drive_link: row.drive_link, drive_id, size_w_mm: parseFloat(row.size_w_mm)||null, size_h_mm: parseFloat(row.size_h_mm)||null };
    matched++;
  });

  if (!matched) { toast('No matching products found in CSV'); return; }

  try {
    await apiFetch({ action: 'save_links_bulk', links: newLinks });
    Object.assign(links, newLinks);
    closeCsvModal();
    filterList();
    updateHeader();
    toast(`Imported ${matched} links${unmatched.length ? `. ${unmatched.length} not matched: ${unmatched.slice(0,5).join(', ')}${unmatched.length>5?'…':''}` : ''}`);
    if (unmatched.length) console.log('CSV unmatched titles:', unmatched);
  } catch(e) { toast('Error: ' + e.message); }
}

function parseCsv(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g,'').toLowerCase());
  return lines.slice(1).map(line => {
    const vals = line.split(',').map(v => v.trim().replace(/^"|"$/g,''));
    const obj = {};
    headers.forEach((h, i) => { obj[h] = vals[i] || ''; });
    return obj;
  });
}

// ── REFRESH ───────────────────────────────────────────────────────────────────

async function refreshProducts() {

// ── A4 GENERATION ─────────────────────────────────────────────────────────────

async function genA4(handle, mode) {
  const p = allProducts.find(x => x.handle === handle);
  const lk = links[handle];
  if (!lk?.drive_id) { toast('No Drive link for this product — add one first'); return; }

  toast('Fetching image…');
  const imgData = await fetchProxiedImage(lk.drive_id);
  if (!imgData) { toast('Could not load image — check Drive sharing (Anyone with link → Viewer)'); return; }

  const img = await loadImage(imgData);
  const { pw, ph } = getPrintSize(p, lk);
  const canvas = document.getElementById('offCanvas');
  const ctx = canvas.getContext('2d');

  if (mode === 'single') {
    canvas.width = A4_W; canvas.height = A4_H;
    fillA4(ctx);
    const { x, y, w, h } = centerFit(pw, ph, A4_W, A4_H, MARGIN);
    ctx.drawImage(img, x, y, w, h);
    drawLabel(ctx, p.title, x, y + h + 20, w);
    downloadCanvas(canvas, `${handle}-single.png`);
  } else if (mode === 'tile2') {
    canvas.width = A4_W; canvas.height = A4_H;
    fillA4(ctx);
    tilePlacements(pw, ph, 2).forEach(pl => ctx.drawImage(img, pl.x, pl.y, pl.w, pl.h));
    downloadCanvas(canvas, `${handle}-tile2.png`);
  } else if (mode === 'tilemax') {
    canvas.width = A4_W; canvas.height = A4_H;
    fillA4(ctx);
    const max = maxTiles(pw, ph);
    tilePlacements(pw, ph, max).forEach(pl => ctx.drawImage(img, pl.x, pl.y, pl.w, pl.h));
    toast(`Tiling ${max} copies…`);
    downloadCanvas(canvas, `${handle}-tilemax.png`);
  }
}

// Bulk download — separate A4 per selected product (single layout)
async function bulkDownload() {
  const handles = [...selectedHandles];
  if (!handles.length) { toast('Nothing selected'); return; }
  toast(`Downloading ${handles.length} A4 sheets…`);
  for (const handle of handles) {
    const lk = links[handle];
    if (!lk?.drive_id) { toast(`Skipped ${handle} — no Drive link`); continue; }
    await genA4(handle, 'single');
    await sleep(400);
  }
  toast('All done!');
  cancelSelect();
}

// Multi-product: all selected items on a single A4
async function genMultiA4() {
  if (!selectedHandles.size) { toast('Select products first'); return; }
  toast(`Building A4 with ${selectedHandles.size} items…`);

  const items = [];
  for (const handle of selectedHandles) {
    const p = allProducts.find(x => x.handle === handle);
    const lk = links[handle];
    if (!lk?.drive_id) { toast(`No Drive link: ${handle}`); continue; }
    const imgData = await fetchProxiedImage(lk.drive_id);
    if (!imgData) { toast(`Image failed: ${handle}`); continue; }
    const img = await loadImage(imgData);
    const { pw, ph } = getPrintSize(p, lk);
    items.push({ img, pw, ph, title: p.title });
  }

  if (!items.length) { toast('No images loaded'); return; }

  const canvas = document.getElementById('offCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = A4_W; canvas.height = A4_H;
  fillA4(ctx);

  const usableW = A4_W - 2 * MARGIN;
  const usableH = A4_H - 2 * MARGIN;
  const perItemH = Math.floor((usableH - GAP * (items.length - 1)) / items.length);

  let curY = MARGIN;
  items.forEach(item => {
    const scale = Math.min(usableW / item.pw, perItemH / item.ph);
    const dw = Math.round(item.pw * scale);
    const dh = Math.round(item.ph * scale);
    const dx = MARGIN + Math.round((usableW - dw) / 2);
    ctx.drawImage(item.img, dx, curY, dw, dh);
    drawLabel(ctx, item.title, dx, curY + dh + 14, dw);
    curY += perItemH + GAP;
  });

  downloadCanvas(canvas, `multi-${Date.now()}.png`);
  cancelSelect();
}

// ── CANVAS HELPERS ────────────────────────────────────────────────────────────

function fillA4(ctx) { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, A4_W, A4_H); }

function centerFit(pw, ph, cW, cH, margin) {
  const uW = cW - 2*margin, uH = cH - 2*margin;
  const scale = Math.min(uW/pw, uH/ph);
  const w = Math.round(pw*scale), h = Math.round(ph*scale);
  return { x: margin + Math.round((uW-w)/2), y: margin + Math.round((uH-h)/2), w, h };
}

function maxTiles(pw, ph) {
  const uW = A4_W-2*MARGIN, uH = A4_H-2*MARGIN;
  const scale = Math.min(1, uW/pw, uH/ph);
  const iw = Math.round(pw*scale), ih = Math.round(ph*scale);
  return Math.max(1, Math.floor((uW+GAP)/(iw+GAP)) * Math.floor((uH+GAP)/(ih+GAP)));
}

function tilePlacements(pw, ph, count) {
  const uW = A4_W-2*MARGIN, uH = A4_H-2*MARGIN;
  const scale = Math.min(1, uW/pw, uH/ph);
  const iw = Math.round(pw*scale), ih = Math.round(ph*scale);
  const cols = Math.max(1, Math.floor((uW+GAP)/(iw+GAP)));
  const places = [];
  for (let i = 0; i < count; i++) {
    const col = i % cols, row = Math.floor(i/cols);
    places.push({ x: MARGIN+col*(iw+GAP), y: MARGIN+row*(ih+GAP), w: iw, h: ih });
  }
  return places;
}

function drawLabel(ctx, text, x, y, maxW) {
  ctx.save();
  ctx.font = '28px sans-serif';
  ctx.fillStyle = '#888';
  ctx.textAlign = 'center';
  ctx.fillText(text.length > 50 ? text.slice(0,48)+'…' : text, x+maxW/2, y, maxW);
  ctx.restore();
}

function getPrintSize(p, lk) {
  if (lk?.size_w_mm && lk?.size_h_mm) return { pw: Math.round(lk.size_w_mm/25.4*300), ph: Math.round(lk.size_h_mm/25.4*300) };
  if (p?.size_w_in && p?.size_h_in) return { pw: Math.round(p.size_w_in*300), ph: Math.round(p.size_h_in*300) };
  return { pw: 1200, ph: 1200 };
}

// ── IMAGE LOADING ─────────────────────────────────────────────────────────────

async function fetchProxiedImage(driveId) {
  try {
    const res = await apiFetch({ action: 'proxy_image', url: `https://drive.google.com/uc?export=download&id=${driveId}` });
    if (res.ok && res.data) return res.data;
    if (res.too_large) return `https://drive.google.com/thumbnail?id=${driveId}&sz=w1200`;
    return null;
  } catch { return null; }
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function downloadCanvas(canvas, filename) {
  toast('Generating PNG…');
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
    toast('Downloaded: ' + filename);
  }, 'image/png');
}

// ── HELPERS ───────────────────────────────────────────────────────────────────

function extractDriveId(url) {
  if (!url) return null;
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}

async function apiFetch(body) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return r.json();
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

// ── INLINE SIZE EDIT ──────────────────────────────────────────────────────────

async function saveSize(handle, dim, val) {
  const lk = links[handle] || {};
  if (dim === 'w') lk.size_w_mm = parseFloat(val) || null;
  else             lk.size_h_mm = parseFloat(val) || null;
  links[handle] = lk;
  try {
    await apiFetch({ action: 'save_link', handle, drive_link: lk.drive_link || null, drive_id: lk.drive_id || null, size_w_mm: lk.size_w_mm, size_h_mm: lk.size_h_mm });
  } catch(e) { toast('Size save error: ' + e.message); }
}

// ── DELETE ROW ────────────────────────────────────────────────────────────────

async function deleteRow(handle, isManual) {
  if (!confirm(`Remove "${handle}"?`)) return;
  try {
    await apiFetch({ action: isManual ? 'delete_manual' : 'delete_link', handle });
    if (isManual) {
      allProducts = allProducts.filter(p => p.handle !== handle);
    }
    delete links[handle];
    filtered = filtered.filter(p => p.handle !== handle);
    document.getElementById(`row-${handle}`)?.remove();
    updateHeader();
    toast('Removed');
  } catch(e) { toast('Delete error: ' + e.message); }
}

// ── MANUAL ADD ────────────────────────────────────────────────────────────────

function openAddModal() {
  document.getElementById('addTitle').value = '';
  document.getElementById('addHandle').value = '';
  document.getElementById('addSizeW').value = '';
  document.getElementById('addSizeH').value = '';
  document.getElementById('addModal').style.display = 'flex';
}
function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }

document.getElementById('addTitle').addEventListener('input', function() {
  const h = document.getElementById('addHandle');
  if (!h.dataset.edited) h.value = this.value.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
});
document.getElementById('addHandle').addEventListener('input', function() { this.dataset.edited = '1'; });

async function saveAddModal() {
  const title  = document.getElementById('addTitle').value.trim();
  const handle = document.getElementById('addHandle').value.trim();
  const w = parseFloat(document.getElementById('addSizeW').value) || null;
  const h = parseFloat(document.getElementById('addSizeH').value) || null;
  if (!title || !handle) { toast('Title and handle required'); return; }
  try {
    await apiFetch({ action: 'add_manual', handle, title, size_w_mm: w, size_h_mm: h });
    allProducts.unshift({ handle, title, shopify_image: null, size_w_in: null, size_h_in: null, size_label: null, is_new: true });
    if (w || h) links[handle] = { size_w_mm: w, size_h_mm: h };
    closeAddModal();
    filterList();
    updateHeader();
    toast(`Added: ${title}`);
  } catch(e) { toast('Add error: ' + e.message); }
}

// ── DRIVE PICKER ──────────────────────────────────────────────────────────────

let driveFiles = null;
let drivePickerHandle = null;

let driveSearchTimer = null;

async function openDrivePicker(handle) {
  drivePickerHandle = handle;
  document.getElementById('driveSearch').value = '';
  document.getElementById('driveModal').style.display = 'flex';
  await loadDriveFiles('');
}

async function loadDriveFiles(search) {
  document.getElementById('driveGrid').innerHTML = '<div style="color:var(--muted);font-size:.85rem;padding:20px">Loading…</div>';
  try {
    const res = await apiFetch({ action: 'list_drive_files', search: search || '' });
    if (!res.ok) throw new Error(res.error);
    if (!search) driveFiles = res.files; // cache folder listing
    renderDriveGrid(res.files);
  } catch(e) {
    document.getElementById('driveGrid').innerHTML = `<div style="color:#e74c3c;font-size:.85rem;padding:20px">Error: ${e.message}</div>`;
  }
}

function closeDrivePicker() {
  document.getElementById('driveModal').style.display = 'none';
  drivePickerHandle = null;
}

function filterDriveFiles() {
  clearTimeout(driveSearchTimer);
  const q = document.getElementById('driveSearch').value.trim();
  if (!q) { renderDriveGrid(driveFiles || []); return; }
  // debounce 400ms then search all Drive via API
  driveSearchTimer = setTimeout(() => loadDriveFiles(q), 400);
}

function renderDriveGrid(files) {
  const grid = document.getElementById('driveGrid');
  if (!files.length) { grid.innerHTML = '<div style="color:var(--muted);font-size:.85rem;padding:20px">No files found</div>'; return; }
  grid.innerHTML = files.map(f => `
    <div class="drive-file" onclick="selectDriveFile('${f.id}','${escHtml(f.webViewLink)}','${escHtml(f.name)}')">
      <img src="https://drive.google.com/thumbnail?id=${f.id}&sz=w200" alt="" loading="lazy"
           onerror="this.style.background='#f5ece0';this.style.height='80px'">
      <div class="drive-file-name" title="${escHtml(f.name)}">${escHtml(f.name)}</div>
    </div>
  `).join('');
}

async function selectDriveFile(driveId, driveLink, filename) {
  const handle = drivePickerHandle;
  if (!handle) return;
  closeDrivePicker();
  toast(`Linking ${filename}…`);
  try {
    const lk = links[handle] || {};
    await apiFetch({ action: 'link_drive_file', handle, drive_id: driveId, drive_link: driveLink, size_w_mm: lk.size_w_mm || null, size_h_mm: lk.size_h_mm || null });
    links[handle] = { ...lk, drive_id: driveId, drive_link: driveLink };
    const p = allProducts.find(x => x.handle === handle);
    if (p) p.is_new = false;
    filterList();
    updateHeader();
    toast('✓ Linked');
  } catch(e) { toast('Link error: ' + e.message); }
}

// ── BULK IMAGE UPLOAD ─────────────────────────────────────────────────────────

function normStr(s) {
  return s.toLowerCase().replace(/\.[^.]+$/, '').replace(/[^a-z0-9]/g, ' ').replace(/\s+/g, ' ').trim();
}

function fuzzyScore(a, b) {
  if (a === b) return 100;
  if (a.includes(b) || b.includes(a)) return 80;
  const aw = new Set(a.split(' ').filter(Boolean));
  const bw = b.split(' ').filter(Boolean);
  const shared = bw.filter(w => aw.has(w)).length;
  const total = Math.max(aw.size, bw.length);
  return total > 0 ? Math.round((shared / total) * 60) : 0;
}

function matchFileToProduct(filename) {
  const normFile = normStr(filename);
  let bestScore = 0, bestProduct = null;
  for (const p of allProducts) {
    const score = Math.max(fuzzyScore(normFile, normStr(p.handle)), fuzzyScore(normFile, normStr(p.title)));
    if (score > bestScore) { bestScore = score; bestProduct = p; }
  }
  return bestScore >= 40 ? { product: bestProduct, score: bestScore } : null;
}

async function bulkUploadImages(input) {
  const files = [...input.files];
  input.value = '';
  if (!files.length) return;
  if (!allProducts.length) { toast('Load products first'); return; }

  let done = 0, matched = 0, skipped = 0;
  const unmatched = [];

  toast(`Uploading ${files.length} images…`);

  for (const file of files) {
    const match = matchFileToProduct(file.name);
    if (!match) {
      unmatched.push(file.name);
      skipped++;
      done++;
      toast(`(${done}/${files.length}) No match: ${file.name}`);
      continue;
    }

    const { product } = match;
    toast(`(${done + 1}/${files.length}) Uploading: ${file.name} → ${product.title}`);

    try {
      const data = await fileToBase64(file);
      const mime_type = file.type || 'image/jpeg';
      const res = await apiFetch({
        action: 'upload_image',
        handle: product.handle,
        filename: file.name,
        mime_type,
        data,
      });
      if (!res.ok) throw new Error(res.error);
      links[product.handle] = { drive_link: res.drive_link, drive_id: res.drive_id };
      const p = allProducts.find(x => x.handle === product.handle);
      if (p) p.is_new = false;
      matched++;
    } catch(e) {
      unmatched.push(`${file.name} (error: ${e.message})`);
      skipped++;
    }

    done++;
    await sleep(300);
  }

  filterList();
  updateHeader();

  if (unmatched.length) {
    console.log('Unmatched/failed files:', unmatched);
    toast(`✓ ${matched} uploaded. ${skipped} not matched — check console for list`);
  } else {
    toast(`✓ All ${matched} images uploaded and linked!`);
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const [, data] = e.target.result.split(',');
      resolve(data);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ── SCAN DRIVE FOLDER ────────────────────────────────────────────────────────

async function scanDrive(btn) {
  if (!allProducts.length) { toast('Load products first'); return; }
  btn.disabled = true;
  btn.textContent = '⏳ Scanning…';
  toast('Scanning Drive folder…');

  try {
    const res = await apiFetch({
      action: 'scan_drive',
      products: allProducts.map(p => ({ handle: p.handle, title: p.title })),
    });

    if (!res.ok) throw new Error(res.error || 'Scan failed');

    // apply matched links locally
    for (const m of res.results || []) {
      links[m.handle] = { drive_link: m.drive_link, drive_id: m.drive_id };
    }

    filterList();
    updateHeader();

    const unmatchedNames = (res.unmatched_files || []).map(u => u.file).join(', ');
    toast(`✓ Matched ${res.matched} images. ${res.unmatched} not matched${res.unmatched ? ': ' + unmatchedNames : ''}`);

    if (res.unmatched > 0) {
      console.log('Unmatched files:', res.unmatched_files);
    }
  } catch(e) {
    toast('Scan error: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '🔍 Scan Drive Folder';
  }
}

// ── DRIVE UPLOAD ──────────────────────────────────────────────────────────────

async function uploadImage(handle, input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';

  toast(`Uploading ${file.name} to Drive…`);

  const reader = new FileReader();
  reader.onload = async e => {
    const dataUrl = e.target.result;
    const [header, data] = dataUrl.split(',');
    const mime_type = header.match(/:(.*?);/)[1];

    try {
      const res = await apiFetch({
        action: 'upload_image',
        handle,
        filename: `${handle}.${file.name.split('.').pop()}`,
        mime_type,
        data,
      });

      if (!res.ok) throw new Error(res.error || 'Upload failed');

      links[handle] = { drive_link: res.drive_link, drive_id: res.drive_id };
      const p = allProducts.find(x => x.handle === handle);
      if (p) p.is_new = false;
      filterList();
      updateHeader();
      toast('✓ Uploaded & linked to Drive');
    } catch(e) {
      toast('Upload error: ' + e.message);
    }
  };
  reader.readAsDataURL(file);
}
