<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NT Rack Scanner</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#d4541f;--ink:#3a2b1d;--ink2:#6f5b46;--muted:#9c8a76;
  --line:#e9ddca;--bg:#f6f0e8;--bg2:#fdf5ec;
  --green:#27ae60;--red:#e74c3c;--amber:#e67e22;--blue:#2980b9;
  --ff:Fraunces,Georgia,serif;--fb:Nunito,Helvetica Neue,sans-serif;
}
body{font-family:var(--fb);background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:70px}

/* ── HEADER ── */
.header{background:#fff;border-bottom:3px solid var(--accent);padding:10px 14px;position:sticky;top:0;z-index:100}
.htop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.header h1{font-family:var(--ff);font-size:1rem}
.hrow{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.hbtn{padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:.78rem;cursor:pointer;white-space:nowrap}
.hbtn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.hbtn:disabled{opacity:.4;cursor:default}
.hlink{font-size:.72rem;color:var(--accent);text-decoration:none;white-space:nowrap}
.status-line{font-size:.73rem;color:var(--muted);margin-top:5px;min-height:15px}

/* ── TABS ── */
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--line)}
.tab{flex:1;padding:11px 8px;text-align:center;font-size:.82rem;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ── SCAN TAB ── */
.scan-wrap{padding:12px;display:flex;flex-direction:column;gap:10px}

.cam-card{background:var(--ink);border-radius:14px;overflow:hidden;cursor:pointer}
.cam-face{padding:22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.cam-face.analyzing{background:#162c45}
.cam-icon{font-size:2.8rem;line-height:1}
.cam-label{color:#fff;font-size:1rem;font-weight:700}
.cam-sub{color:rgba(255,255,255,.55);font-size:.78rem}
.cam-preview{width:100%;max-height:200px;object-fit:contain;display:block;background:#000}
.manual-row{display:flex;gap:6px;padding:10px;background:#fff;border-top:1px solid var(--line);flex-wrap:wrap}
.m-input{flex:1;min-width:100px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:.82rem;color:var(--ink)}
.m-input:focus{outline:none;border-color:var(--accent)}
.act-btn{padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:.76rem;cursor:pointer;white-space:nowrap}
.act-btn.go{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ── RESULT ── */
.result-card{background:#fff;border-radius:12px;border:1px solid var(--line);overflow:hidden}
.rc-top{padding:10px 13px;border-bottom:1px solid var(--line);font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rc-vision{padding:10px 13px;border-bottom:1px solid var(--line);font-size:.8rem;color:var(--ink2)}
.rc-vision strong{color:var(--ink)}
.match-block{padding:11px 13px;border-bottom:1px solid var(--line)}
.match-block.best{background:#f0faf4}
.m-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.m-order{font-weight:700;font-size:.9rem}
.m-meta{font-size:.72rem;color:var(--muted);margin-top:2px}
.m-badge{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--green);color:#fff;white-space:nowrap}
.m-items{margin-top:8px;display:flex;flex-direction:column;gap:3px}
.m-item{font-size:.76rem;padding:5px 9px;border-radius:6px;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:6px}
.m-item.target{border:1.5px solid var(--accent);background:rgba(212,84,31,.07)}
.m-item-q{flex:1;color:var(--ink)}
.m-item-c{font-size:.7rem;color:var(--muted);white-space:nowrap}
.m-item-p{font-size:.7rem;font-weight:700;white-space:nowrap}
.p-done{color:var(--green)}.p-partial{color:var(--amber)}.p-wait{color:var(--muted)}
.m-actions{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.m-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:.74rem;cursor:pointer}
.m-btn.confirm{background:var(--green);color:#fff;border-color:var(--green)}
.m-btn.extra-btn{border-color:var(--amber);color:var(--amber)}
.m-no-match{font-size:.84rem;color:var(--muted);text-align:center;padding:18px}
.m-big{font-size:1.6rem;display:block;margin-bottom:6px}

/* ── HISTORY ── */
.sec-hdr{padding:8px 12px 4px;font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between}
.hist-list{padding:0 12px;display:flex;flex-direction:column;gap:5px}
.hist-row{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;display:flex;gap:9px;align-items:flex-start}
.h-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:4px}
.h-dot.matched{background:var(--green)}.h-dot.extra{background:var(--amber)}.h-dot.none{background:var(--red)}
.h-info{flex:1;min-width:0}
.h-quote{font-size:.78rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-sub{font-size:.7rem;color:var(--muted);margin-top:1px}
.h-time{font-size:.67rem;color:var(--muted);white-space:nowrap;flex-shrink:0}

/* ── LIST TAB ── */
.list-wrap{padding:12px;display:flex;flex-direction:column;gap:10px}

/* date picker row */
.date-nav{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.date-nav::-webkit-scrollbar{height:0}
.d-chip{flex-shrink:0;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:.75rem;cursor:pointer;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:1px}
.d-chip .d-day{font-weight:700;font-size:.82rem}
.d-chip .d-count{font-size:.63rem;color:var(--muted)}
.d-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.d-chip.active .d-count{color:rgba(255,255,255,.7)}
.d-chip.all-chip{padding:6px 14px}

.filter-row{display:flex;gap:5px;flex-wrap:wrap}
.ftab{padding:6px 13px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:.75rem;cursor:pointer;white-space:nowrap}
.ftab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.list-date-hdr{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:6px 0 4px;border-bottom:1px solid var(--line);margin-bottom:5px;display:flex;justify-content:space-between}
.ord-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:5px}
.ord-card.complete{border-left:3px solid var(--green)}
.ord-card.partial{border-left:3px solid var(--amber)}
.ord-card.missing{border-left:3px solid var(--muted)}
.ord-card.dispatched{opacity:.5}
.ord-card.emergency{border-left:3px solid var(--red)}
.ord-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.ord-name{font-weight:700;font-size:.88rem}
.ord-cust{font-size:.74rem;color:var(--ink2)}
.ord-prog{font-size:.72rem;font-weight:700;white-space:nowrap}
.prog-done{color:var(--green)}.prog-partial{color:var(--amber)}.prog-none{color:var(--muted)}
.ord-items{margin-top:6px;display:flex;flex-direction:column;gap:2px}
.oi-line{font-size:.74rem;display:flex;align-items:center;gap:5px;padding:2px 0}
.oi-chk{width:13px;height:13px;border-radius:3px;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:.6rem;flex-shrink:0}
.oi-chk.done{background:var(--green);border-color:var(--green);color:#fff}
.oi-chk.part{background:var(--amber);border-color:var(--amber);color:#fff}
.oi-q{flex:1;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oi-c{font-size:.68rem;color:var(--muted);white-space:nowrap}
.oi-n{font-size:.68rem;font-weight:700;color:var(--muted);white-space:nowrap}
.tag-disp{font-size:.67rem;background:#e8f4fc;color:var(--blue);border-radius:6px;padding:1px 6px;margin-left:4px}
.tag-emg{font-size:.67rem;background:#fdecea;color:var(--red);border-radius:6px;padding:1px 6px;margin-left:4px}
.tag-overdue{font-size:.67rem;background:#fff3e0;color:#e65100;border-radius:6px;padding:1px 6px;margin-left:4px;font-weight:700}
.d-chip.overdue .d-count{color:#e65100!important;font-weight:700}

.print-btn-row{display:flex;gap:8px;justify-content:flex-end}

/* ── SUMMARY ── */
.sum-bar{position:fixed;bottom:0;left:0;right:0;background:var(--ink);color:#fff;padding:9px 14px;display:flex;gap:14px;align-items:center;z-index:200;font-size:.78rem}
.s-stat{display:flex;flex-direction:column;align-items:center}
.s-num{font-size:1.05rem;font-weight:700;line-height:1}
.s-lbl{font-size:.62rem;opacity:.55;text-transform:uppercase;letter-spacing:.04em}
.s-div{width:1px;background:rgba(255,255,255,.18);height:28px}
.s-spc{flex:1}

/* ── PRINT ── */
@media print {
  .header,.tabs,.scan-wrap,.sum-bar,.no-print{display:none!important}
  body{background:#fff;padding:0}
  .list-wrap{padding:8px}
  .ord-card{border:1px solid #ccc;border-radius:0;margin-bottom:3px;padding:6px 8px;break-inside:avoid}
  .ord-card.dispatched{display:none}
  .print-title{display:block!important;font-size:14pt;font-weight:700;margin-bottom:8px;font-family:serif}
  .print-date{display:block!important;font-size:10pt;color:#666;margin-bottom:12px}
  .date-nav,.filter-row,.print-btn-row{display:none!important}
}
.print-title,.print-date{display:none}

/* ── MISC ── */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-msg{padding:24px;text-align:center;color:var(--muted);font-size:.85rem}
input[type=file]{display:none}
</style>
</head>
<body>

<div class="header">
  <div class="htop">
    <h1>📦 Rack Scanner</h1>
    <a class="hlink" href="nt-inventory.html">↗ Inventory</a>
  </div>
  <div class="hrow">
    <button class="hbtn accent" onclick="syncAll()" id="syncBtn">⟳ Sync New Orders</button>
    <button class="hbtn" onclick="loadRackStatus()" id="refreshBtn">↺ Refresh</button>
  </div>
  <div class="status-line" id="statusLine">Tap Sync to fetch all orders from 29 Jul.</div>
</div>

<div class="tabs">
  <div class="tab active" id="tabScan" onclick="switchTab('scan')">📷 Scan</div>
  <div class="tab" id="tabList" onclick="switchTab('list')">📋 List / Print</div>
</div>

<input type="file" id="fileInput" accept="image/*" capture="environment">

<!-- ── SCAN TAB ── -->
<div id="scanTab" class="scan-wrap">
  <div class="cam-card" onclick="triggerCamera()">
    <div class="cam-face" id="camFace">
      <div class="cam-icon" id="camIcon">📷</div>
      <div class="cam-label" id="camLabel">Tap to Scan a Piece</div>
      <div class="cam-sub" id="camSub">Point camera at the wooden piece</div>
    </div>
    <img id="previewImg" class="cam-preview" style="display:none">
  </div>
  <div class="manual-row">
    <input class="m-input" type="text" id="manualQ" placeholder="Or type quote manually…" onkeydown="if(event.key==='Enter')manualMatch()">
    <select class="m-input" id="manualC" style="max-width:130px">
      <option value="">Any color</option>
      <option>Black</option><option>White</option><option>Natural</option>
      <option>Walnut Brown</option><option>Mango Wood</option>
    </select>
    <button class="act-btn go" onclick="manualMatch()">Match</button>
  </div>

  <div id="resultArea"></div>

  <div class="sec-hdr no-print">
    <span>Recent Scans</span>
    <button class="act-btn" onclick="renderHistory()" style="padding:2px 9px;font-size:.68rem">↺</button>
  </div>
  <div class="hist-list no-print" id="histList">
    <div class="empty-msg">No scans yet.</div>
  </div>
</div>

<!-- ── LIST TAB ── -->
<div id="listTab" class="list-wrap" style="display:none">
  <div class="print-title" id="printTitle"></div>
  <div class="print-date" id="printDate"></div>

  <!-- date chips — built from available dates in rackItems -->
  <div class="date-nav no-print" id="dateNav"></div>

  <div class="filter-row no-print">
    <div class="ftab active" onclick="setFilter('all')" data-f="all">All</div>
    <div class="ftab" onclick="setFilter('missing')" data-f="missing">Missing</div>
    <div class="ftab" onclick="setFilter('partial')" data-f="partial">Partial</div>
    <div class="ftab" onclick="setFilter('complete')" data-f="complete">Complete</div>
    <div class="ftab" onclick="setFilter('emergency')" data-f="emergency">Emergency</div>
  </div>

  <div class="print-btn-row no-print">
    <button class="hbtn" onclick="window.print()">🖨 Print</button>
  </div>

  <div id="listContent">
    <div class="empty-msg">Sync orders first, then switch to this tab.</div>
  </div>
</div>

<!-- ── SUMMARY BAR ── -->
<div class="sum-bar">
  <div class="s-stat"><span class="s-num" id="sOrders">0</span><span class="s-lbl">Orders</span></div>
  <div class="s-div"></div>
  <div class="s-stat"><span class="s-num" id="sPieces">0</span><span class="s-lbl">Pieces</span></div>
  <div class="s-div"></div>
  <div class="s-stat"><span class="s-num" id="sFound" style="color:#6fcf97">0</span><span class="s-lbl">Found</span></div>
  <div class="s-div"></div>
  <div class="s-stat"><span class="s-num" id="sMissing" style="color:#f2994a">0</span><span class="s-lbl">Missing</span></div>
  <div class="s-spc"></div>
  <span id="sPct" style="font-size:.7rem;opacity:.55"></span>
</div>

<script>
const API  = 'https://cozy-dieffenbachia-95eb4b.netlify.app/.netlify/functions/nt-bluedart';

// ── STATE ──────────────────────────────────────────────────────────────────────
let rackItems    = [];
let scanLog      = [];
let activeFilter = 'all';
let activeTab    = 'scan';
let selectedDate = 'all';   // 'all' or 'YYYY-MM-DD'

// ── INIT ───────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('fileInput').addEventListener('change', handleFile);
  init();
});

async function init() {
  try {
    const meta = await apiFetch({ action: 'get_rack_meta' });
    if (meta.last_sync) {
      setStatus(`Last synced: ${fmtDate(meta.last_sync)} · Loading from Supabase…`);
    } else {
      setStatus('First time — tap Sync to fetch all orders from 29 Jul.');
    }
  } catch(e) { /* ignore */ }
  await loadRackStatus();
}

function setStatus(msg) { document.getElementById('statusLine').textContent = msg; }

// ── TAB SWITCHING ──────────────────────────────────────────────────────────────
function switchTab(t) {
  activeTab = t;
  document.getElementById('scanTab').style.display = t === 'scan' ? '' : 'none';
  document.getElementById('listTab').style.display = t === 'list' ? '' : 'none';
  document.getElementById('tabScan').classList.toggle('active', t === 'scan');
  document.getElementById('tabList').classList.toggle('active', t === 'list');
  if (t === 'list') { buildDateNav(); renderList(); }
}

// ── API ────────────────────────────────────────────────────────────────────────
async function apiFetch(payload) {
  const r = await fetch(API, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  return d;
}

// ── SYNC (incremental — backend handles from/to via Redis cursor) ──────────────
async function syncAll() {
  const btn = document.getElementById('syncBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Syncing…';
  setStatus('Fetching new orders from Shopify…');
  try {
    const r = await apiFetch({ action: 'sync_rack' });
    setStatus(`✓ Synced ${r.orders} orders · ${r.synced} items (${fmtDate(r.from)} → ${fmtDate(r.to)})`);
    await loadRackStatus();
  } catch(e) {
    setStatus('Sync error: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '⟳ Sync New Orders';
  }
}

// ── LOAD RACK STATUS ───────────────────────────────────────────────────────────
async function loadRackStatus() {
  try {
    rackItems = await apiFetch({ action: 'get_rack_status' });
    updateSummary();
    if (activeTab === 'list') { buildDateNav(); renderList(); }
    const t = new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    if (rackItems.length) setStatus(`${rackItems.length} items loaded · refreshed ${t}`);
    else setStatus('No data yet — tap Sync New Orders.');
  } catch(e) {
    setStatus('Load error: ' + e.message);
  }
}

// ── DATE NAV ───────────────────────────────────────────────────────────────────
function isOverdue(dateStr) {
  const cutoff = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
  cutoff.setDate(cutoff.getDate() - 15);
  return new Date(dateStr + 'T00:00:00+05:30') < cutoff;
}

function buildDateNav() {
  const nav = document.getElementById('dateNav');
  const dates = [...new Set(rackItems.map(it => it.order_date))].sort();

  let html = `<div class="d-chip all-chip${selectedDate==='all'?' active':''}" onclick="selectDate('all')">All dates</div>`;

  for (const d of dates) {
    const dayItems = rackItems.filter(it => it.order_date === d && !it.dispatched);
    const needed   = dayItems.reduce((s,it)=>s+it.needed,0);
    const found    = dayItems.reduce((s,it)=>s+it.found,0);
    const missing  = needed - found;
    const overdue  = missing > 0 && isOverdue(d);
    const dt = new Date(d + 'T00:00:00+05:30');
    const label = dt.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
    html += `<div class="d-chip${selectedDate===d?' active':''}${overdue?' overdue':''}" onclick="selectDate('${d}')">
      <span class="d-day">${label}${overdue?' ⚠️':''}</span>
      <span class="d-count">${missing > 0 ? missing + ' missing' : 'done ✓'}</span>
    </div>`;
  }

  nav.innerHTML = html;
}

function selectDate(d) {
  selectedDate = d;
  buildDateNav();
  renderList();
}

// ── CAMERA ────────────────────────────────────────────────────────────────────
function triggerCamera() {
  if (!rackItems.length) { alert('Sync orders first.'); return; }
  document.getElementById('fileInput').click();
}

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  setCamState('analyzing');
  const reader = new FileReader();
  reader.onload = ev => processImage(ev.target.result, file.type || 'image/jpeg');
  reader.readAsDataURL(file);
  e.target.value = '';
}

async function processImage(dataUrl, mimeType) {
  const preview = document.getElementById('previewImg');
  preview.src = dataUrl;
  preview.style.display = 'block';

  try {
    const b64 = (await resizeImage(dataUrl, 700)).split(',')[1];
    const vision = await apiFetch({ action: 'analyze_piece', image_base64: b64, media_type: mimeType.split(';')[0] });
    setCamState('idle');
    setTimeout(() => { preview.style.display = 'none'; preview.src = ''; }, 400);
    handleVisionResult(vision);
  } catch(e) {
    setCamState('idle');
    preview.style.display = 'none';
    showResult({ type: 'error', message: e.message });
  }
}

function resizeImage(dataUrl, maxPx) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', 0.72));
    };
    img.src = dataUrl;
  });
}

function setCamState(state) {
  const face = document.getElementById('camFace');
  const icon = document.getElementById('camIcon');
  const lbl  = document.getElementById('camLabel');
  const sub  = document.getElementById('camSub');
  if (state === 'analyzing') {
    face.className = 'cam-face analyzing';
    icon.textContent = '⏳'; lbl.textContent = 'Reading piece…'; sub.textContent = 'AI is recognizing quote & color';
  } else {
    face.className = 'cam-face';
    icon.textContent = '📷';
    lbl.textContent = rackItems.length ? 'Tap to Scan a Piece' : 'Sync orders first';
    sub.textContent  = rackItems.length ? 'Point camera at the wooden piece' : '';
  }
}

// ── MANUAL MATCH ───────────────────────────────────────────────────────────────
function manualMatch() {
  const q = document.getElementById('manualQ').value.trim();
  const c = document.getElementById('manualC').value;
  if (!q) return;
  document.getElementById('manualQ').value = '';
  handleVisionResult({ quote: q, color: c || '', confidence: 'manual' });
}

// ── MATCHING ───────────────────────────────────────────────────────────────────
function norm(s) {
  return (s||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
}
function wordSim(a, b) {
  const wa = new Set(norm(a).split(' ').filter(Boolean));
  const wb = new Set(norm(b).split(' ').filter(Boolean));
  if (!wa.size && !wb.size) return 1;
  if (!wa.size || !wb.size) return 0;
  const inter = [...wa].filter(w => wb.has(w)).length;
  const union = new Set([...wa, ...wb]).size;
  const shorter = wa.size <= wb.size ? wa : wb;
  const longer  = wa.size <= wb.size ? wb : wa;
  const contain = [...shorter].filter(w => longer.has(w)).length / shorter.size;
  return Math.max(inter / union, contain * 0.85);
}

function findMatches(quote, color) {
  const results = [];
  for (const it of rackItems) {
    if (it.dispatched) continue;
    if (it.found >= it.needed) continue;
    const qScore = wordSim(quote, it.quote);
    const cScore = color ? wordSim(color, it.color) : 0.5;
    const score  = qScore * 0.75 + cScore * 0.25;
    if (qScore >= 0.35) results.push({ it, qScore, cScore, score });
  }
  results.sort((a, b) => b.score - a.score);
  return results.slice(0, 4);
}

function handleVisionResult(vision) {
  const { quote, color, confidence } = vision;
  const matches = findMatches(quote, color);
  showResult({ type: matches.length ? 'matches' : 'no_match', quote, color, confidence, matches });
}

// ── RESULT DISPLAY ─────────────────────────────────────────────────────────────
function showResult({ type, quote, color, confidence, matches, message }) {
  const area = document.getElementById('resultArea');

  if (type === 'error') {
    area.innerHTML = `<div class="result-card"><div class="rc-top">Error</div><div class="m-no-match">${esc(message)}</div></div>`;
    return;
  }

  const visionHtml = `<div class="rc-vision">AI read: <strong>"${esc(quote)}"</strong>${color ? ` · <strong>${esc(color)}</strong>` : ''}${confidence ? `<span style="color:var(--muted)"> (${confidence})</span>` : ''}</div>`;

  if (type === 'no_match') {
    logScan({ quote, color, match_type: 'no_match', confidence });
    area.innerHTML = `<div class="result-card">
      <div class="rc-top">Scan Result</div>
      ${visionHtml}
      <div class="m-no-match"><span class="m-big">❓</span>No matching order found.<br><small>This is an extra piece — set it aside.</small></div>
      <div style="padding:9px 13px;border-top:1px solid var(--line)">
        <button class="act-btn" onclick="markExtra('${esc(quote)}','${esc(color||'')}')">🗂 Mark as Extra</button>
      </div>
    </div>`;
    return;
  }

  let html = `<div class="result-card"><div class="rc-top">Best match${matches.length>1?' — scroll for more':''}</div>${visionHtml}`;

  matches.forEach((m, idx) => {
    const { it } = m;
    const orderItems = rackItems.filter(r => r.order_name === it.order_name && !r.dispatched);
    const totalN = orderItems.reduce((s,r)=>s+r.needed,0);
    const totalF = orderItems.reduce((s,r)=>s+r.found,0);
    const pct = Math.round(m.score * 100);

    html += `<div class="match-block${idx===0?' best':''}">
      <div class="m-head">
        <div>
          <div class="m-order">${esc(it.order_name)} · ${esc(it.customer||'')}</div>
          <div class="m-meta">${fmtDate(it.order_date)} · ${totalF}/${totalN} pieces · match ${pct}%</div>
        </div>
        ${idx===0?'<span class="m-badge">BEST</span>':`<span style="color:var(--muted);font-size:.72rem">#${idx+1}</span>`}
      </div>
      <div class="m-items">${orderItems.map(r => {
        const isTarget = r.quote===it.quote && r.color===it.color;
        const p = r.found>=r.needed?'done':r.found>0?'partial':'wait';
        return `<div class="m-item${isTarget?' target':''}">
          <span class="m-item-q">${esc(r.quote)}</span>
          <span class="m-item-c">${esc(r.color)}</span>
          <span class="m-item-p p-${p}">${r.found}/${r.needed}</span>
        </div>`;
      }).join('')}</div>
      <div class="m-actions">
        <button class="m-btn confirm" onclick="confirmMatch('${esc(it.order_name)}','${esc(it.quote)}','${esc(it.color)}','${esc(it.order_date||'')}','${esc(quote)}','${esc(color||'')}','${esc(confidence||'')}')">✓ This is it</button>
        <button class="m-btn extra-btn" onclick="markExtra('${esc(quote)}','${esc(color||'')}')">Not in list</button>
      </div>
    </div>`;
  });

  html += '</div>';
  area.innerHTML = html;
}

// ── CONFIRM / MARK ─────────────────────────────────────────────────────────────
async function confirmMatch(orderName, quote, color, orderDate, visQuote, visColor, confidence) {
  try {
    const r = await apiFetch({ action: 'update_rack_found', order_name: orderName, quote, color, delta: 1 });
    const row = rackItems.find(it => it.order_name===orderName && it.quote===quote && it.color===color);
    if (row) row.found = r.found;

    logScan({ order_name: orderName, order_date: orderDate, quote: visQuote, color: visColor, match_type: 'matched', confidence });
    updateSummary();

    document.getElementById('resultArea').innerHTML = `<div class="result-card">
      <div style="padding:18px;text-align:center">
        <div style="font-size:2.2rem">✅</div>
        <div style="font-weight:700;margin:8px 0;font-size:.95rem">${esc(orderName)}</div>
        <div style="font-size:.78rem;color:var(--muted)">"${esc(quote)}" · ${esc(color)}<br>${r.found}/${r.needed} found${r.found>=r.needed?' · <span style="color:var(--green)">Complete!</span>':''}</div>
        <div style="margin-top:14px"><button class="act-btn go" onclick="triggerCamera()">📷 Scan Next</button></div>
      </div>
    </div>`;
    renderHistory();
  } catch(e) { alert('Error: ' + e.message); }
}

function markExtra(quote, color) {
  logScan({ quote, color, match_type: 'extra', confidence: '' });
  document.getElementById('resultArea').innerHTML = `<div class="result-card">
    <div style="padding:18px;text-align:center">
      <div style="font-size:2rem">🗂️</div>
      <div style="font-weight:700;margin:8px 0">Extra Piece</div>
      <div style="font-size:.78rem;color:var(--muted)">Set it aside in the extras pile.</div>
      <div style="margin-top:14px"><button class="act-btn go" onclick="triggerCamera()">📷 Scan Next</button></div>
    </div>
  </div>`;
  renderHistory();
}

// ── SCAN LOG ───────────────────────────────────────────────────────────────────
function logScan(entry) {
  const time = new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  scanLog.unshift({ ...entry, time });
  if (scanLog.length > 60) scanLog.pop();
  renderHistory();
  apiFetch({ action: 'log_rack_scan', ...entry }).catch(()=>{});
}

function renderHistory() {
  const list = document.getElementById('histList');
  if (!scanLog.length) { list.innerHTML = '<div class="empty-msg">No scans yet.</div>'; return; }
  list.innerHTML = scanLog.slice(0,12).map(s => {
    const dc = s.match_type==='matched'?'matched':s.match_type==='extra'?'extra':'none';
    const sub = s.match_type==='matched' ? `→ ${s.order_name} (${fmtDate(s.order_date)})` :
                s.match_type==='extra'   ? 'Extra piece — set aside' : 'No match found';
    return `<div class="hist-row">
      <div class="h-dot ${dc}"></div>
      <div class="h-info">
        <div class="h-quote">"${esc(s.quote)}"${s.color?` · ${esc(s.color)}`:''}</div>
        <div class="h-sub">${sub}</div>
      </div>
      <div class="h-time">${s.time}</div>
    </div>`;
  }).join('');
}

// ── LIST VIEW ──────────────────────────────────────────────────────────────────
function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.ftab').forEach(b => b.classList.toggle('active', b.dataset.f === f));
  renderList();
}

function renderList() {
  // Determine items to show based on selectedDate
  const items = selectedDate === 'all'
    ? rackItems
    : rackItems.filter(it => it.order_date === selectedDate);

  const dateLabel = selectedDate === 'all' ? 'All Dates' : fmtDate(selectedDate);
  document.getElementById('printTitle').textContent = `NukkadTales Rack Status — ${dateLabel}`;
  document.getElementById('printDate').textContent  = `Printed ${new Date().toLocaleString('en-IN')}`;

  if (!items.length) {
    document.getElementById('listContent').innerHTML = '<div class="empty-msg">No data. Sync orders first.</div>';
    return;
  }

  // Group by order
  const byOrder = {};
  for (const it of items) {
    if (!byOrder[it.order_name]) byOrder[it.order_name] = {
      order_name: it.order_name, order_date: it.order_date,
      customer: it.customer, dispatched: it.dispatched,
      is_emergency: it.is_emergency, items: []
    };
    byOrder[it.order_name].items.push(it);
    if (it.dispatched)   byOrder[it.order_name].dispatched    = true;
    if (it.is_emergency) byOrder[it.order_name].is_emergency  = true;
  }

  const orders = Object.values(byOrder).filter(o => {
    const totalN = o.items.reduce((s,it)=>s+it.needed,0);
    const totalF = o.items.reduce((s,it)=>s+it.found,0);
    const complete = totalF >= totalN;
    const partial  = totalF > 0 && !complete;
    if (activeFilter === 'all')       return true;
    if (activeFilter === 'missing')   return totalF === 0 && !o.dispatched;
    if (activeFilter === 'partial')   return partial && !o.dispatched;
    if (activeFilter === 'complete')  return complete || o.dispatched;
    if (activeFilter === 'emergency') return o.is_emergency;
    return true;
  });

  if (!orders.length) {
    document.getElementById('listContent').innerHTML = '<div class="empty-msg">No orders match this filter.</div>';
    return;
  }

  // Group by date (for 'all' view show date headers; for single date just list)
  const byDate = {};
  for (const o of orders) {
    const d = o.order_date;
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(o);
  }

  const dates = Object.keys(byDate).sort();
  let html = '';
  for (const date of dates) {
    const dayOrders = byDate[date];
    const dayN = dayOrders.reduce((s,o)=>s+o.items.reduce((s2,it)=>s2+it.needed,0),0);
    const dayF = dayOrders.reduce((s,o)=>s+o.items.reduce((s2,it)=>s2+it.found,0),0);
    if (selectedDate === 'all') {
      html += `<div class="list-date-hdr"><span>${fmtDate(date)} — ${dayOrders.length} orders</span><span>${dayF}/${dayN} pieces</span></div>`;
    }
    for (const o of dayOrders) {
      const totalN = o.items.reduce((s,it)=>s+it.needed,0);
      const totalF = o.items.reduce((s,it)=>s+it.found,0);
      const complete = totalF >= totalN;
      const partial  = totalF > 0 && !complete;
      const cardCls  = o.is_emergency ? 'emergency' : o.dispatched ? 'dispatched' : complete ? 'complete' : partial ? 'partial' : 'missing';
      const progCls  = complete||o.dispatched ? 'prog-done' : partial ? 'prog-partial' : 'prog-none';

      html += `<div class="ord-card ${cardCls}">
        <div class="ord-top">
          <div>
            <span class="ord-name">${esc(o.order_name)}</span>
            ${o.dispatched?'<span class="tag-disp">Dispatched</span>':''}
            ${o.is_emergency?'<span class="tag-emg">Emergency</span>':''}
            ${(!o.dispatched && isOverdue(o.order_date))?'<span class="tag-overdue">⚠️ Overdue</span>':''}
            <div class="ord-cust">${esc(o.customer||'')}</div>
          </div>
          <div class="ord-prog ${progCls}">${o.dispatched?'🚚':`${totalF}/${totalN}`}</div>
        </div>
        <div class="ord-items">
          ${o.items.map(it => {
            const chkCls = it.found>=it.needed?'done':it.found>0?'part':'';
            const chkTxt = it.found>=it.needed?'✓':it.found>0?it.found:'';
            return `<div class="oi-line">
              <div class="oi-chk ${chkCls}">${chkTxt}</div>
              <div class="oi-q" title="${esc(it.quote)}">${esc(it.quote)}</div>
              <div class="oi-c">${esc(it.color)}</div>
              <div class="oi-n">${it.found}/${it.needed}</div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    }
  }

  document.getElementById('listContent').innerHTML = html;
}

// ── SUMMARY BAR ────────────────────────────────────────────────────────────────
function updateSummary() {
  const active = rackItems.filter(it=>!it.dispatched);
  const orderNames = [...new Set(active.map(it=>it.order_name))];
  const totalN  = active.reduce((s,it)=>s+it.needed,0);
  const totalF  = active.reduce((s,it)=>s+it.found,0);
  const missing = totalN - totalF;
  const pct     = totalN ? Math.round(totalF/totalN*100) : 0;

  document.getElementById('sOrders').textContent  = orderNames.length;
  document.getElementById('sPieces').textContent  = totalN;
  document.getElementById('sFound').textContent   = totalF;
  document.getElementById('sMissing').textContent = missing;
  document.getElementById('sPct').textContent     = totalN ? `${pct}% sorted` : '';
}

// ── UTILS ──────────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(String(d).length === 10 ? d + 'T00:00:00+05:30' : d);
  return dt.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
}
