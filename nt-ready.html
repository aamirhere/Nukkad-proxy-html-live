<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Ready Stock</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--accent:#d4541f;--ink:#3a2b1d;--ink2:#6f5b46;--muted:#9c8a76;--line:#e9ddca;--paper:#fbf6ee;--ok:#2e8b57;--okbg:#e6f4ea;--bad:#c62828;--badbg:#fdecea;--warn:#b7791f;--warnbg:#fff4d6}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--paper);color:var(--ink);font-family:Nunito,"Helvetica Neue",Arial,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:700}
button.p{background:var(--ink);color:#fff;border-color:var(--ink)}button.a{background:var(--accent);color:#fff;border-color:var(--accent)}button.g{background:var(--ok);color:#fff;border-color:var(--ok)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;min-width:0}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
header h1{font-family:Georgia,serif;font-size:18px;margin:0 auto 0 0;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.seg button{border:0;border-radius:0;padding:9px 14px}.seg button.on{background:var(--ink);color:#fff}
main{max-width:1180px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.m{color:var(--muted);font-size:13px}.b{font-weight:800}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:800;background:#f1e7d9;color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.dk{background:var(--ink);color:#fff}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tw{overflow-x:auto}
.hide{display:none!important}
/* packing station */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.modes button{padding:14px 6px;font-size:16px;border-radius:14px}.modes button.on{background:var(--ink);color:#fff}
.scanbox{display:flex;gap:8px}.scanbox input{flex:1;font-size:18px;padding:12px 14px;border-width:2px;border-color:var(--ink)}
.prompt{font-size:22px;font-weight:800;text-align:center;padding:26px 10px;color:var(--ink2)}
.ln{display:flex;align-items:center;gap:10px;padding:12px;border:2px solid var(--line);border-radius:12px;margin:8px 0;background:#fff}
.ln.done{border-color:var(--ok);background:var(--okbg)}.ln .nm{flex:1;min-width:0}.ln .nm b{display:block;font-size:16px}
.ct{font-size:24px;font-weight:900;min-width:64px;text-align:center}
.stp{display:flex;gap:4px}.stp button{width:44px;height:44px;padding:0;font-size:22px;border-radius:10px}
.tick{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;margin:8px 0;font-weight:800;border:2px solid var(--line);background:#fff}
.tick input{width:26px;height:26px}.tick.gift{background:var(--warnbg);border-color:#f0c96b}
.flash{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:28px;font-weight:900;color:#fff;pointer-events:none}
.flash.bad{background:rgba(198,40,40,.94)}.flash.ok{background:rgba(46,139,87,.94)}.flash small{font-size:16px;font-weight:600;margin-top:8px}
.big{font-size:18px;padding:14px 18px;border-radius:12px}
.ph img{max-width:160px;border-radius:10px;display:block}
/* modal: always a centred popup */
.mb{position:fixed;inset:0;z-index:80;background:rgba(40,25,12,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.md{background:#fff;border-radius:16px;width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.md h3{margin:0 0 10px;font-family:Georgia,serif;font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.grid2 label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}.tabs button{white-space:nowrap}.tabs button.on{background:var(--ink);color:#fff}
.stat{display:inline-flex;flex-direction:column;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:110px}.stat b{font-size:22px}
#cam{position:fixed;inset:0;z-index:85;background:#000;display:flex;flex-direction:column}#cam video{flex:1;width:100%;object-fit:cover}#cam button{margin:12px}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}@page{margin:0}}
#printArea{display:none}
</style>
</head><body>
<header>
  <h1>📦 Ready stock</h1>
  <div class="seg"><button id="doorPack" class="on">Packing station</button><button id="doorAdmin">Admin 🔒</button></div>
</header>

<main id="packDoor">
  <div class="card row">
    <span class="m">Packer</span>
    <select id="packer"></select>
    <span class="sp"></span>
    <span class="m" id="todayCount"></span>
  </div>
  <div class="modes"><button data-mode="pack" class="on">📦 Pack order</button><button data-mode="rto">↩️ RTO</button><button data-mode="hand">🚚 Hand-over</button></div>
  <div class="card">
    <div class="scanbox"><input id="scan" placeholder="Scan here…" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text"><button id="camBtn" title="Scan with camera">📷</button></div>
    <div class="m" id="scanHint" style="margin-top:6px">Scan the AWB on the packing slip to open the order.</div>
  </div>
  <div id="packView"></div>
  <div class="card"><div class="row"><b>Packed today</b><span class="sp"></span><button id="refreshToday">↻</button></div><div class="tw"><table id="todayTbl"></table></div></div>
</main>

<main id="adminDoor" class="hide">
  <div class="tabs" id="aTabs">
    <button data-t="orders" class="on">Orders</button><button data-t="items">Items &amp; labels</button><button data-t="stock">Stock</button><button data-t="pos">Vendor POs</button><button data-t="plan">Planning</button><button data-t="close">Day close</button><button data-t="settings">Settings</button>
  </div>
  <div id="aView"></div>
</main>

<div id="printArea"></div>

<script src="assets/nt-slip.js"></script>
<script>
const API = 'https://cozy-dieffenbachia-95eb4b.netlify.app/.netlify/functions/nt-inventory';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const ss = { get: k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} } };
async function apiFetch(payload, url = API, timeoutMs = 30000) {
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), signal: ctrl.signal });
    const d = await r.json().catch(() => ({}));
    if (d.error) { const e = new Error(d.error); e.status = r.status; throw e; }
    if (d.errorMessage) throw new Error('Server hiccup — try again');
    return d;
  } catch (e) { if (e.name === 'AbortError') throw new Error('Timed out — try again'); throw e; } finally { clearTimeout(t); }
}
const api = (action, body = {}) => apiFetch({ action, ...body });
const adm = (action, body = {}) => apiFetch({ action, pin: ss.get('rs_pin') || '', ...body }).catch(e => { if (e.status === 401) { ss.set('rs_pin', ''); askPin(); } throw e; });
const fmtD = t => t ? new Date(t).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '—';
const dayOnly = t => t ? new Date(t).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) : '—';
const rs = n => '₹' + Math.round(+n || 0).toLocaleString('en-IN');

// ── sound and flash: green ding for right, red buzz for wrong ──
let AC = null;
function tone(freq, ms, type = 'sine', vol = .2) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = freq; g.gain.value = vol; o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + ms / 1000); } catch (e) {} }
const ding = () => { tone(880, 90); setTimeout(() => tone(1320, 120), 90); };
const buzz = () => { tone(140, 380, 'square', .25); if (navigator.vibrate) navigator.vibrate([200, 80, 200]); };
function flash(kind, msg, sub, ms = 1400) { const d = document.createElement('div'); d.className = 'flash ' + kind; d.innerHTML = esc(msg) + (sub ? `<small>${esc(sub)}</small>` : ''); document.body.appendChild(d); setTimeout(() => d.remove(), ms); }

// ── doors ──
let door = 'pack';
function openDoor(d) {
  door = d; $('doorPack').classList.toggle('on', d === 'pack'); $('doorAdmin').classList.toggle('on', d === 'admin');
  $('packDoor').classList.toggle('hide', d !== 'pack'); $('adminDoor').classList.toggle('hide', d !== 'admin');
  if (d === 'admin') { if (!ss.get('rs_pin')) askPin(); else aTab(curTab); } else focusScan();
}
$('doorPack').onclick = () => openDoor('pack');
$('doorAdmin').onclick = () => openDoor('admin');
function modal(html, onReady) {
  const mb = document.createElement('div'); mb.className = 'mb'; mb.innerHTML = `<div class="md">${html}</div>`;
  mb.addEventListener('click', e => { if (e.target === mb) mb.remove(); });
  document.body.appendChild(mb); if (onReady) onReady(mb.firstChild, () => mb.remove()); return mb;
}
function askPin() {
  modal(`<h3>Admin PIN</h3><p class="m">The admin area changes stock and orders. Ask the owner for the PIN.</p><div class="row"><input id="pinIn" type="password" inputmode="numeric" placeholder="PIN" style="flex:1;font-size:20px"><button class="p" id="pinGo">Open</button></div><p class="m" id="pinErr"></p>`, (m, close) => {
    const go = async () => { const p = m.querySelector('#pinIn').value.trim(); try { await apiFetch({ action: 'rs_login', pin: p }); ss.set('rs_pin', p); close(); aTab(curTab); } catch (e) { m.querySelector('#pinErr').textContent = e.message; } };
    m.querySelector('#pinGo').onclick = go; m.querySelector('#pinIn').onkeydown = e => { if (e.key === 'Enter') go(); }; setTimeout(() => m.querySelector('#pinIn').focus(), 50);
  });
}

// ═════════════════════════ PACKING STATION ═════════════════════════
let mode = 'pack', P = null, RTO = null, HAND = { courier: '', list: [] }, ITEMS = [], packers = [], couriers = [];
function focusScan() { if (door === 'pack' && !document.querySelector('.mb') && document.activeElement && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) $('scan').focus(); }
document.addEventListener('click', () => setTimeout(focusScan, 0));
$('packer').onchange = () => ls.set('rs_packer', $('packer').value);
document.querySelectorAll('.modes button').forEach(b => b.onclick = () => { mode = b.dataset.mode; document.querySelectorAll('.modes button').forEach(x => x.classList.toggle('on', x === b)); P = null; RTO = null; renderPack(); });
const packerName = () => $('packer').value || '';
let lastCode = '', lastAt = 0;
$('scan').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const code = $('scan').value.trim(); $('scan').value = ''; if (!code) return;
  // a gun can read one sticker twice in a blink: the same code within 0.6 s counts once
  if (code === lastCode && Date.now() - lastAt < 600) return; lastCode = code; lastAt = Date.now();
  onScan(code);
});
async function onScan(code) {
  if (!packerName()) { buzz(); flash('bad', 'Pick your name first', 'Packer, at the top'); return; }
  try {
    if (mode === 'pack') await packScan(code);
    else if (mode === 'rto') await rtoScan(code);
    else await handScan(code);
  } catch (e) { buzz(); flash('bad', e.message, '', 2200); }
}

const itemBy = code => { const c = String(code).trim().toUpperCase(); return ITEMS.find(i => i.ean === c || String(i.sku).toUpperCase() === c) || null; };
// what the order needs from the shelf, by SKU (a gift set counts as its pieces)
function needOf(o) { const n = {}; for (const l of o.lines || []) if (l.kind === 'ready') for (const p of (l.parts && l.parts.length ? l.parts.map(x => ({ sku: x.sku, qty: x.qty * l.qty, name: x.name })) : [{ sku: l.sku, qty: l.qty, name: l.name }])) { n[p.sku] = n[p.sku] || { qty: 0, name: p.name }; n[p.sku].qty += p.qty; } return n; }

async function packScan(code) {
  if (P && P.order) {
    const it = itemBy(code);
    if (it) {
      const need = P.need[it.sku];
      if (!need) { buzz(); flash('bad', 'Not in this order', [it.name, it.variant].filter(Boolean).join(' · ')); return; }
      if ((P.got[it.sku] || 0) >= need.qty) { buzz(); flash('bad', `Already ${need.qty} of ${need.qty}`, need.name); return; }
      P.got[it.sku] = (P.got[it.sku] || 0) + 1; ding(); renderPack(); return;
    }
    if (code.replace(/^#/, '') === String(P.order.order_name).replace(/^#/, '') || code === P.order.awb) { ding(); return; }
    // not a piece of this order: is it another order's slip? only then offer to switch
    let other; try { other = await api('rs_pack_open', { code }); } catch (e) { buzz(); flash('bad', 'Not in this order', code); return; }
    if (!confirm(`That is ${other.order.order_name}'s slip. Leave ${P.order.order_name} unfinished and open it?`)) return;
    return openPack(other);
  }
  return openPack(await api('rs_pack_open', { code }));
}
function openPack(d) {
  ITEMS = d.items || ITEMS;
  const o = d.order;
  if (o.status === 'cancelled') { buzz(); flash('bad', 'CANCELLED', `${o.order_name} — do not pack`, 3000); P = null; renderPack(); return; }
  if (o.packed_at) { buzz(); flash('bad', 'Already packed', `${o.order_name} by ${o.packed_by || '—'}`, 2600); P = null; renderPack(); return; }
  if (o.status === 'waiting') { buzz(); flash('bad', 'Waiting for quote', `${o.order_name}: ${o.quotes.found} of ${o.quotes.need} painted`, 2600); P = null; renderPack(); return; }
  P = { order: o, need: needOf(o), got: {}, multi: {}, quotes: false, gift: false, photo: null };
  ding(); renderPack();
}
function allDone() {
  if (!P) return false;
  const o = P.order;
  for (const s in P.need) { if ((P.got[s] || 0) !== P.need[s].qty) return false; if (P.need[s].qty > 1 && !P.multi[s]) return false; }
  if (o.lines.some(l => l.kind === 'quote') && !P.quotes) return false;
  if (o.gift_wrap && !P.gift) return false;
  return !!P.photo;
}
function renderPack() {
  const v = $('packView');
  if (mode === 'rto') return renderRto();
  if (mode === 'hand') return renderHand();
  $('scanHint').textContent = P ? 'Scan each piece. Wrong piece = red buzz.' : 'Scan the AWB on the packing slip to open the order.';
  if (!P) { v.innerHTML = `<div class="card prompt">Scan a packing slip 📄</div>`; return; }
  const o = P.order, item = s => ITEMS.find(i => i.sku === s) || {};
  const edited = (o.edits || []).filter(e => /^\+|→|removed/.test(e.what)).map(e => `${e.by}: ${e.what}`);
  let h = `<div class="card"><div class="row"><b style="font-size:20px">${esc(o.order_name)}</b><span class="chip">${esc(o.payment === 'cod' ? 'COD' : 'Prepaid')}</span>${o.awb ? `<span class="chip dk">${esc(o.carrier || '')} ${esc(o.awb)}</span>` : '<span class="chip warn">no AWB yet</span>'}<span class="sp"></span><button id="probBtn">⚠️ Problem</button></div>
    <div class="m">${esc(o.customer || '')} · ${esc(o.city || '')}</div>${edited.length ? `<div class="chip warn" style="margin-top:6px">Edited — ${esc(edited.join(' · '))}</div>` : ''}</div>`;
  for (const s in P.need) {
    const n = P.need[s], g = P.got[s] || 0, it = item(s), done = g === n.qty;
    h += `<div class="ln ${done ? 'done' : ''}"><div class="nm"><b>${esc(n.name)}</b><span class="m">${esc(it.shelf ? '📍 ' + it.shelf + ' · ' : '')}${esc(s)}</span></div>
      <div class="stp"><button data-dec="${esc(s)}">−</button></div><div class="ct">${g}/${n.qty}</div><div class="stp"><button data-inc="${esc(s)}">+</button></div></div>`;
    if (n.qty > 1 && done) h += `<label class="tick"><input type="checkbox" data-multi="${esc(s)}" ${P.multi[s] ? 'checked' : ''}> ×${n.qty} — all ${n.qty} pieces are in the box</label>`;
  }
  for (const l of o.lines.filter(l => l.kind === 'quote')) h += `<div class="ln"><div class="nm"><b>${esc(l.name)}${l.color ? ' · ' + esc(l.color) : ''}</b><span class="m">Quote from the rack · ${l.found || 0}/${l.need || l.qty} painted</span></div><div class="ct">×${l.qty}</div></div>`;
  if (o.lines.some(l => l.kind === 'quote')) h += `<label class="tick"><input type="checkbox" id="qTick" ${P.quotes ? 'checked' : ''}> The quote(s) from the rack are in the box</label>`;
  if (o.gift_wrap) h += `<label class="tick gift"><input type="checkbox" id="gTick" ${P.gift ? 'checked' : ''}> 🎁 Gift wrapped${o.gift_note ? ` + card: “${esc(o.gift_note)}”` : ''}</label>`;
  h += `<div class="card row"><label class="big" style="border:2px dashed var(--line);border-radius:12px;cursor:pointer">📷 ${P.photo ? 'Retake box photo' : 'Take box photo'}<input type="file" accept="image/*" capture="environment" id="photoIn" style="display:none"></label>${P.photo ? `<span class="ph"><img src="${P.photo}"></span>` : '<span class="m">Photo of the open box before sealing</span>'}</div>`;
  h += `<button class="g big" id="doneBtn" style="width:100%;font-size:20px" ${allDone() ? '' : 'disabled'}>✓ Complete — bag it</button>`;
  v.innerHTML = h;
  v.querySelectorAll('[data-inc]').forEach(b => b.onclick = () => { const s = b.dataset.inc; if ((P.got[s] || 0) < P.need[s].qty) { P.got[s] = (P.got[s] || 0) + 1; ding(); } else buzz(); renderPack(); });
  v.querySelectorAll('[data-dec]').forEach(b => b.onclick = () => { const s = b.dataset.dec; P.got[s] = Math.max(0, (P.got[s] || 0) - 1); P.multi[s] = false; renderPack(); });
  v.querySelectorAll('[data-multi]').forEach(c => c.onchange = () => { P.multi[c.dataset.multi] = c.checked; renderPack(); });
  if ($('qTick')) $('qTick').onchange = e => { P.quotes = e.target.checked; renderPack(); };
  if ($('gTick')) $('gTick').onchange = e => { P.gift = e.target.checked; renderPack(); };
  $('photoIn').onchange = e => { const f = e.target.files[0]; if (f) shrink(f).then(d => { P.photo = d; renderPack(); }); };
  $('doneBtn').onclick = packDone;
  $('probBtn').onclick = packProblem;
}
// a phone photo is several MB: 1100 px JPEG is plenty to see what went in the box
function shrink(file) { return new Promise(res => { const img = new Image(); img.onload = () => { const k = Math.min(1, 1100 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .72)); URL.revokeObjectURL(img.src); }; img.src = URL.createObjectURL(file); }); }
async function packDone() {
  const b = $('doneBtn'); b.disabled = true; b.textContent = 'Saving…';
  try {
    await api('rs_pack_done', { order_name: P.order.order_name, packer: packerName(), lines: Object.keys(P.got).map(s => ({ sku: s, qty: P.got[s] })), quotes_done: P.quotes, gift_done: P.gift, photo: P.photo });
    ding(); flash('ok', '✓ Bag it', P.order.order_name, 1800); P = null; renderPack(); loadToday();
  } catch (e) { buzz(); flash('bad', e.message, '', 2600); b.disabled = false; b.textContent = '✓ Complete — bag it'; }
}
function packProblem() {
  const reasons = ['Piece damaged', 'Not on the shelf', 'Wrong colour / finish', 'Quote not with the order', 'Other'];
  modal(`<h3>Problem with ${esc(P.order.order_name)}</h3><div class="row" style="flex-direction:column;align-items:stretch">${reasons.map(r => `<button data-r="${esc(r)}" class="big">${esc(r)}</button>`).join('')}</div><input id="probNote" placeholder="Note (optional)" style="width:100%;margin-top:10px">`, (m, close) => {
    m.querySelectorAll('[data-r]').forEach(b => b.onclick = async () => { try { await api('rs_problem', { order_name: P.order.order_name, problem: b.dataset.r + (m.querySelector('#probNote').value ? ' — ' + m.querySelector('#probNote').value : ''), packer: packerName() }); close(); flash('ok', 'Sent to the admin team', P.order.order_name); P = null; renderPack(); } catch (e) { alert(e.message); } });
  });
}

// RTO: the returned parcel's AWB, then each piece Good (back on the shelf) or Damaged
async function rtoScan(code) {
  if (RTO) { const it = itemBy(code); if (it) { const l = RTO.lines.find(x => x.sku === it.sku); if (!l) { buzz(); flash('bad', 'Not in this parcel', it.name); return; } if (l.good + l.damaged >= l.qty) { buzz(); return; } l.good++; ding(); renderRto(); return; } }
  const d = await api('rs_rto_open', { code }); ITEMS = d.items || ITEMS;
  if (d.already) { buzz(); flash('bad', 'Return already logged', `${d.order.order_name} on ${dayOnly(d.already.at)}`, 2600); return; }
  RTO = { order: d.order, lines: d.lines.map(l => ({ sku: l.sku, qty: l.qty, good: 0, damaged: 0, name: (ITEMS.find(i => i.sku === l.sku) || {}).name || l.sku })) };
  ding(); renderRto();
}
function renderRto() {
  $('scanHint').textContent = RTO ? 'Scan each returned piece (counts as Good), or use the buttons.' : 'Scan the AWB of the returned parcel.';
  const v = $('packView');
  if (!RTO) { v.innerHTML = `<div class="card prompt">Scan the returned parcel's AWB ↩️</div>`; return; }
  let h = `<div class="card"><b style="font-size:20px">${esc(RTO.order.order_name)}</b> <span class="m">${esc(RTO.order.customer || '')}</span></div>`;
  RTO.lines.forEach((l, i) => { h += `<div class="ln"><div class="nm"><b>${esc(l.name)}</b><span class="m">${l.qty} sent</span></div><div><div class="m">Good</div><div class="stp"><button data-g="${i}" data-d="-1">−</button><span class="ct">${l.good}</span><button data-g="${i}" data-d="1">+</button></div></div><div><div class="m">Damaged</div><div class="stp"><button data-x="${i}" data-d="-1">−</button><span class="ct">${l.damaged}</span><button data-x="${i}" data-d="1">+</button></div></div></div>`; });
  h += `<button class="g big" id="rtoSave" style="width:100%">Save return</button>`;
  v.innerHTML = h;
  const step = (l, k, d) => { const nv = l[k] + d; if (nv < 0 || (d > 0 && l.good + l.damaged >= l.qty)) return; l[k] = nv; renderRto(); };
  v.querySelectorAll('[data-g]').forEach(b => b.onclick = () => step(RTO.lines[+b.dataset.g], 'good', +b.dataset.d));
  v.querySelectorAll('[data-x]').forEach(b => b.onclick = () => step(RTO.lines[+b.dataset.x], 'damaged', +b.dataset.d));
  $('rtoSave').onclick = async () => { try { await api('rs_rto_save', { order_name: RTO.order.order_name, lines: RTO.lines, packer: packerName() }); ding(); flash('ok', 'Return saved', RTO.lines.filter(l => l.good).map(l => `${l.good} back on the shelf`).join(', ') || 'damaged only'); RTO = null; renderRto(); } catch (e) { buzz(); flash('bad', e.message); } };
}

// Hand-over: pick the courier, scan each parcel going into their bag, then finish
async function handScan(code) {
  if (!HAND.courier) { buzz(); flash('bad', 'Pick the courier first'); return; }
  const d = await api('rs_handover_check', { code });
  if (HAND.list.some(x => x.order_name === d.order_name)) { buzz(); flash('bad', 'Already scanned', d.order_name); return; }
  HAND.list.unshift(d); ding(); renderHand();
}
function renderHand() {
  $('scanHint').textContent = 'Scan each parcel as it goes into the courier bag.';
  const v = $('packView');

// Camera scanning: the browser's own barcode reader where it exists, else a small library loaded on demand
$('camBtn').onclick = async () => {
  const box = document.createElement('div'); box.id = 'cam'; box.innerHTML = '<video playsinline muted></video><button class="big">Close</button>'; document.body.appendChild(box);
  const video = box.querySelector('video'); let stream = null, stop = false, lib = null;
  const close = () => { stop = true; if (stream) stream.getTracks().forEach(t => t.stop()); if (lib) lib.stop().catch(() => {}); box.remove(); focusScan(); };
  box.querySelector('button').onclick = close;
  const got = code => { close(); onScan(code); };
  if ('BarcodeDetector' in window) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); video.srcObject = stream; await video.play();
      const det = new BarcodeDetector({ formats: ['qr_code', 'ean_13', 'code_128', 'code_39', 'ean_8'] });
      const loop = async () => { if (stop) return; try { const r = await det.detect(video); if (r[0]) return got(r[0].rawValue); } catch (e) {} requestAnimationFrame(loop); }; loop(); return;
    } catch (e) { if (stream) stream.getTracks().forEach(t => t.stop()); }
  }
  video.remove(); const div = document.createElement('div'); div.id = 'camLib'; div.style.cssText = 'flex:1;background:#000'; box.insertBefore(div, box.firstChild);
  if (!window.Html5Qrcode) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); }).catch(() => {});
  if (!window.Html5Qrcode) { alert('Camera scanning is not available on this browser'); return close(); }
  lib = new Html5Qrcode('camLib'); lib.start({ facingMode: 'environment' }, { fps: 10, qrbox: 250 }, t => got(t)).catch(e => { alert('Camera: ' + e); close(); });
};

// Courier booking through the same booking service the rack scanner uses; weight and box come from the pieces
function parcelFor(o) {
  let g = 0, l = 0, b = 0, h = 0, n = 0;
  for (const ln of o.lines) {
    if (ln.kind !== 'ready') { g += 380 * ln.qty; n += ln.qty; continue; }
    const parts = ln.parts && ln.parts.length ? ln.parts.map(p => ({ sku: p.sku, qty: p.qty * ln.qty })) : [{ sku: ln.sku, qty: ln.qty }];
    for (const p of parts) { const it = A.items.find(i => i.sku === p.sku) || {}; g += (it.weight_g || 500) * p.qty; n += p.qty; l = Math.max(l, +it.box_l || 0); b = Math.max(b, +it.box_b || 0); h += (+it.box_h || 0) * p.qty; }
  }
  return { kg: Math.max(.5, Math.ceil(g / 500) / 2), l: l || 24, b: b || 18, h: Math.max(5, Math.round(h) || 5 * n) };
}
async function bookOrders(names) {
  const os = names.map(n => A.orders.find(o => o.order_name === n)).filter(o => o && !o.awb && !['cancelled', 'handed', 'packed'].includes(o.status));
  if (!os.length) return alert('Nothing to book: the selected orders already have an AWB or are not bookable.');
  const pv = {};
  modal(`<h3>Book ${os.length} order(s)</h3><div id="bkBody" class="m">Checking couriers…</div>`, async (m, close) => {
    try {
      const overrides = {}; os.forEach(o => { overrides[o.order_name] = parcelFor(o); });
      const d = await apiFetch({ action: 'booking_preview', order_names: os.map(o => o.order_name), overrides }, API, 45000);
      for (const r of d.rows) pv[r.order_name] = r;
    } catch (e) { m.querySelector('#bkBody').textContent = e.message; return; }
    m.querySelector('#bkBody').outerHTML = `<table>${os.map(o => { const r = pv[o.order_name] || {}, p = parcelFor(o), opts = [{ carrier_id: r.carrier_id, name: r.carrier }, ...(r.alt || [])].filter(x => x.carrier_id); return `<tr><td><b>${esc(o.order_name)}</b><div class="m">${esc(o.city || '')} · ${p.kg} kg · ${p.l}×${p.b}×${p.h}</div>${r.why ? `<div class="m" style="color:${r.ok ? 'inherit' : 'var(--bad)'}">${esc(r.why)}</div>` : ''}</td><td><select data-car="${esc(o.order_name)}">${opts.map(c => `<option value="${c.carrier_id}">${esc(c.name || c.carrier_id)}</option>`).join('')}</select></td><td data-res="${esc(o.order_name)}"></td></tr>`; }).join('')}</table>
      <div class="row" style="margin-top:12px"><span class="sp"></span><button onclick="this.closest('.mb').remove()">Close</button><button class="a" id="bkGo">Book all</button></div>`;
    m.querySelector('#bkGo').onclick = async () => {
      if (!confirm(`Book ${os.length} parcel(s) now? This creates real AWBs.`)) return;
      m.querySelector('#bkGo').disabled = true;
      for (const o of os) {
        const cell = m.querySelector(`[data-res="${CSS.escape(o.order_name)}"]`), r = pv[o.order_name] || {}, p = parcelFor(o);
        cell.textContent = 'booking…';
        try { const x = await apiFetch({ action: 'booking_book', order_name: o.order_name, carrier_id: +m.querySelector(`[data-car="${CSS.escape(o.order_name)}"]`).value, payment: r.payment, zone: r.zone, kg: p.kg, l: p.l, b: p.b, h: p.h, force: !!r.soft }, API, 58000); cell.innerHTML = `<span class="chip ok">${esc(x.awb)}</span>`; }
        catch (e) { cell.innerHTML = `<span class="chip bad">${esc(e.message)}</span>`; }
      }
      tOrders(false);
    };
  });
}
function pickList(names) {
  const tot = {};
  for (const n of names) { const o = A.orders.find(x => x.order_name === n); if (!o || o.packed_at) continue; for (const l of o.lines) if (l.kind === 'ready') for (const p of (l.parts && l.parts.length ? l.parts.map(x => ({ sku: x.sku, qty: x.qty * l.qty })) : [{ sku: l.sku, qty: l.qty }])) tot[p.sku] = (tot[p.sku] || 0) + p.qty; }
  const rows = Object.entries(tot).map(([sku, qty]) => ({ sku, qty, it: A.items.find(i => i.sku === sku) || {} })).sort((a, b) => String(a.it.shelf || 'zz').localeCompare(String(b.it.shelf || 'zz')));
  printHtml(`<div style="padding:12mm;font-family:Arial"><h2 style="margin:0 0 4px">Pick list · ${new Date().toLocaleString('en-IN')}</h2><p style="margin:0 0 10px">${names.length} orders</p><table style="width:100%;border-collapse:collapse;font-size:14px">${rows.map(r => `<tr style="border-bottom:1px solid #ccc"><td style="padding:8px;font-size:18px">☐</td><td style="padding:8px"><b>${esc(r.it.shelf || '—')}</b></td><td style="padding:8px">${esc(itemName(r.sku))}<div style="color:#777;font-size:11px">${esc(r.sku)}</div></td><td style="padding:8px;font-size:20px;font-weight:900">×${r.qty}</td></tr>`).join('')}</table></div>`);
}
async function printSlips(names) {
  const withAwb = names.filter(n => (A.orders.find(o => o.order_name === n) || {}).awb);
  if (!withAwb.length) return alert('Book the courier first: none of these orders has an AWB yet.');
  const slips = [];

// One label per piece: EAN-13 bars, a QR of the same number, the name and the SKU
function printLabels(list, fmt) {
  if (!list.length) return alert('Set a number of labels on at least one item');
  const labs = []; list.forEach(x => { for (let k = 0; k < x.n; k++) labs.push(x.it); });
  const svgFor = ean => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); try { JsBarcode(s, ean, { format: 'EAN13', height: 34, width: 1.4, fontSize: 11, margin: 0, flat: true }); } catch (e) { JsBarcode(s, ean, { format: 'CODE128', height: 34, width: 1.2, fontSize: 11, margin: 0 }); } return s.outerHTML; };
  const qrFor = t => { const q = qrcode(0, 'M'); q.addData(t); q.make(); return q.createSvgTag({ cellSize: 2, margin: 0 }); };
  const one = it => `<div class="lb"><div class="qr">${qrFor(it.ean)}</div><div class="tx"><b>${esc(it.name)}</b>${it.variant ? `<span>${esc(it.variant)}</span>` : ''}<span class="sku">${esc(it.sku)}</span><div class="bc">${svgFor(it.ean)}</div></div></div>`;
  const css = fmt === 'a4'
    ? '@page{size:A4;margin:10mm 7mm}.sheet{display:grid;grid-template-columns:repeat(3,63.5mm);grid-auto-rows:33.9mm;gap:0 2.5mm}.lb{padding:2mm}'
    : '@page{size:50mm 25mm;margin:0}.lb{width:50mm;height:25mm;padding:1.2mm;break-after:page}';
  printHtml(`<style>${css}.lb{display:flex;gap:1.5mm;align-items:center;overflow:hidden;font-family:Arial;box-sizing:border-box}.qr svg{width:15mm;height:15mm;display:block}.tx{display:flex;flex-direction:column;min-width:0;font-size:7.5px;line-height:1.15}.tx b{font-size:8.5px}.tx .sku{color:#444}.bc svg{width:30mm;height:auto;display:block;margin-top:.5mm}</style><div class="sheet">${labs.map(one).join('')}</div>`);
}

    ${lst('Packed but not handed over', d.packed_not_handed, x => `<tr><td>${esc(x.order_name)}</td><td>${esc(x.awb || '')}</td><td class="m">${esc(x.carrier || '')}</td></tr>`)}
    ${lst('Ready but not packed', d.ready_not_packed, x => `<tr><td>${esc(x.order_name)}</td><td>${esc(x.awb || '')}</td><td class="m">${x.age_days} d old</td></tr>`)}
    ${lst('Still to book', d.to_book, x => `<tr><td>${esc(x.order_name)}</td><td class="m">${x.age_days} d old</td></tr>`)}
    ${lst('Problems', d.problems, x => `<tr><td>${esc(x.order_name)}</td><td>${esc(x.problem || '')}</td></tr>`)}
    ${lst('Waiting 5+ days for a quote', d.waiting_long, x => `<tr><td>${esc(x.order_name)}</td><td>${x.quotes.found}/${x.quotes.need} painted</td><td class="m">${x.age_days} d</td></tr>`)}`;
  $('cd').onchange = e => { ls.set('rs_close', e.target.value); tClose(); };
}

// ── Settings ──
async function tSettings() {
  loading(); let d; try { d = await adm('rs_settings'); } catch (e) { return fail(e); }
  view().innerHTML = `<div class="card"><b>Website stock</b><p class="m">When on, the website's quantity for each item = on shelf − promised, updated after every pack, delivery, return and count. Keep it off until the products are priced and launched.</p><label class="tick"><input type="checkbox" id="sOn" ${d.shopify.on ? 'checked' : ''}> Keep Shopify quantities in step</label><label class="m">Shopify location ID <input id="sLoc" value="${esc(d.shopify.location_id)}"></label></div>
    <div class="card grid2"><label>Packers (comma-separated)<input id="sPk" value="${esc(d.packers.join(', '))}"></label><label>Couriers for hand-over<input id="sCr" value="${esc(d.couriers.join(', '))}"></label><label>EAN prefix (20 = own codes; a GS1 prefix later)<input id="sEp" value="${esc(d.ean.prefix)}"></label><label>New admin PIN (leave empty to keep)<input id="sPin" type="password" inputmode="numeric"></label></div>
    <div class="row"><span class="sp"></span><button class="p" id="sSave">Save settings</button></div>`;
  $('sSave').onclick = async () => {
    const on = $('sOn').checked;
    if (on && !d.shopify.on && !confirm('Turn on website stock sync? Every ready item will show on the website with its free quantity. Make sure prices are set.')) return;
    const set = { shopify: { on, location_id: $('sLoc').value.trim() }, packers: $('sPk').value.split(',').map(s => s.trim()).filter(Boolean), couriers: $('sCr').value.split(',').map(s => s.trim()).filter(Boolean), ean_prefix: $('sEp').value.trim() };
    const pin = $('sPin').value.trim(); if (pin) set.new_pin = pin;
    try { await adm('rs_settings', { set }); if (pin) ss.set('rs_pin', pin); alert('Saved'); tSettings(); } catch (e) { alert(e.message); }
  };
}

renderPack(); loadToday(); focusScan();
</script>
