<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Ready Stock</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--accent:#d4541f;--ink:#3a2b1d;--ink2:#6f5b46;--muted:#9c8a76;--line:#e9ddca;--paper:#fbf6ee;--ok:#2e8b57;--okbg:#e6f4ea;--bad:#c62828;--badbg:#fdecea;--warn:#b7791f;--warnbg:#fff4d6}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--paper);color:var(--ink);font-family:Nunito,"Helvetica Neue",Arial,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:700}
button.p{background:var(--ink);color:#fff;border-color:var(--ink)}button.a{background:var(--accent);color:#fff;border-color:var(--accent)}button.g{background:var(--ok);color:#fff;border-color:var(--ok)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;min-width:0}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
header h1{font-family:Georgia,serif;font-size:18px;margin:0 auto 0 0;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.seg button{border:0;border-radius:0;padding:9px 14px}.seg button.on{background:var(--ink);color:#fff}
main{max-width:1180px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.m{color:var(--muted);font-size:13px}.b{font-weight:800}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:800;background:#f1e7d9;color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.dk{background:var(--ink);color:#fff}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tw{overflow-x:auto}
.hide{display:none!important}
/* packing station */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.modes button{padding:14px 6px;font-size:16px;border-radius:14px}.modes button.on{background:var(--ink);color:#fff}
.scanbox{display:flex;gap:8px}.scanbox input{flex:1;font-size:18px;padding:12px 14px;border-width:2px;border-color:var(--ink)}
.prompt{font-size:22px;font-weight:800;text-align:center;padding:26px 10px;color:var(--ink2)}
.ln{display:flex;align-items:center;gap:10px;padding:12px;border:2px solid var(--line);border-radius:12px;margin:8px 0;background:#fff}
.ln.done{border-color:var(--ok);background:var(--okbg)}.ln .nm{flex:1;min-width:0}.ln .nm b{display:block;font-size:16px}
.ct{font-size:24px;font-weight:900;min-width:64px;text-align:center}
.stp{display:flex;gap:4px}.stp button{width:44px;height:44px;padding:0;font-size:22px;border-radius:10px}
.tick{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;margin:8px 0;font-weight:800;border:2px solid var(--line);background:#fff}
.tick input{width:26px;height:26px}.tick.gift{background:var(--warnbg);border-color:#f0c96b}
.flash{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:28px;font-weight:900;color:#fff;pointer-events:none}
.flash.bad{background:rgba(198,40,40,.94)}.flash.ok{background:rgba(46,139,87,.94)}.flash small{font-size:16px;font-weight:600;margin-top:8px}
.big{font-size:18px;padding:14px 18px;border-radius:12px}
.ph img{max-width:160px;border-radius:10px;display:block}
/* modal: always a centred popup */
.mb{position:fixed;inset:0;z-index:80;background:rgba(40,25,12,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.md{background:#fff;border-radius:16px;width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.md h3{margin:0 0 10px;font-family:Georgia,serif;font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.grid2 label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}.tabs button{white-space:nowrap}.tabs button.on{background:var(--ink);color:#fff}
.stat{display:inline-flex;flex-direction:column;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:110px}.stat b{font-size:22px}
#cam{position:fixed;inset:0;z-index:85;background:#000;display:flex;flex-direction:column}#cam video{flex:1;width:100%;object-fit:cover}#cam button{margin:12px}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}@page{margin:0}}
#printArea{display:none}
/* motion and progress */
#topbar{position:fixed;top:0;left:0;height:3px;width:0;z-index:120;background:linear-gradient(90deg,var(--accent),#f0a060);box-shadow:0 0 8px rgba(212,84,31,.45);opacity:0;transition:width .3s ease,opacity .4s ease;pointer-events:none}#topbar.on{opacity:1}
#toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:110;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(440px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;width:100%;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:tin .25s ease-out both;display:flex;flex-direction:column;gap:7px}
.toast.ok{background:var(--ok)}.toast.bad{background:var(--bad)}.toast.warn{background:#8a5a12}.toast.out{animation:tout .25s ease-in forwards}
.toast .pb{background:rgba(255,255,255,.25)}.toast .pb i{background:#fff}
@keyframes tin{from{opacity:0;transform:translateY(12px) scale(.97)}}@keyframes tout{to{opacity:0;transform:translateY(8px) scale(.97)}}
.pb{height:6px;border-radius:6px;background:#f1e7d9;overflow:hidden;min-width:60px}.pb i{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .45s cubic-bezier(.2,.8,.2,1);animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.pb.ok i{background:var(--ok)}.pb.bad i{background:var(--bad)}.pb.warn i{background:#e0a030}.pb.dk i{background:var(--ink)}.pb.thin{height:4px;margin-top:5px}.pb.fat{height:10px}
.pb.ind i{width:35%!important;animation:ind 1.1s ease-in-out infinite}
@keyframes grow{from{width:0}}@keyframes ind{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.pbl{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-weight:800;margin:0 0 5px}
.sk{border-radius:8px;background:linear-gradient(90deg,#f3ebdf 25%,#fbf6ee 50%,#f3ebdf 75%);background-size:200% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
main,.card,.ln,.tick,.stat{animation:fup .32s ease-out both}
#aView>:nth-child(2){animation-delay:.04s}#aView>:nth-child(3){animation-delay:.08s}#aView>:nth-child(4){animation-delay:.12s}#aView>:nth-child(n+5){animation-delay:.16s}
.noanim .card,.noanim .ln,.noanim .tick,.noanim .stat,.noanim .pb i{animation:none}
@keyframes fup{from{opacity:0;transform:translateY(6px)}}
button{transition:transform .12s ease,background .2s,color .2s,box-shadow .2s,opacity .2s}button:active:not(:disabled){transform:scale(.96)}button:hover:not(:disabled){box-shadow:0 2px 8px rgba(58,43,29,.12)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(212,84,31,.12)}input,select,textarea{transition:border-color .2s,box-shadow .2s}
.mb{animation:fin .18s ease-out both}.md{animation:pop .24s cubic-bezier(.2,.9,.3,1.15) both}.mb.out{animation:fout .16s ease-in forwards}.mb.out .md{animation:pout .16s ease-in forwards}
@keyframes fin{from{opacity:0}}@keyframes fout{to{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}}@keyframes pout{to{opacity:0;transform:scale(.96)}}
.bump{animation:bump .38s ease-out}@keyframes bump{40%{transform:scale(1.35);color:var(--ok)}}
.ln{transition:border-color .3s,background .3s}.flash{animation:flin .18s ease-out both}@keyframes flin{from{opacity:0;transform:scale(1.04)}}
tr{transition:background .2s}tr:hover>td{background:#fdf9f3}
.chip{transition:background .2s,color .2s}
.th{width:42px;height:42px;border-radius:8px;object-fit:cover;background:#f3ebdf;flex:none}.nmc{display:flex;gap:10px;align-items:center}
.md.wide{width:min(1020px,100%)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;max-height:56vh;overflow:auto;padding:2px}
.wp{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column;animation:fup .3s ease-out both;transition:box-shadow .2s,border-color .2s}.wp:hover{box-shadow:0 6px 18px rgba(58,43,29,.1)}
.wp img,.wp .noimg{width:100%;aspect-ratio:4/3;object-fit:cover;background:#f3ebdf;display:block}.wb{padding:10px}.wb>b{display:block;line-height:1.25}
.wv{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;margin-top:5px;border:1px solid var(--line);cursor:pointer;font-size:13px;font-weight:700;transition:background .2s,border-color .2s}
.wv:has(input:checked){background:#fff4ec;border-color:var(--accent)}.wv.added{opacity:.6;cursor:default}.wv input{width:17px;height:17px;accent-color:var(--accent)}
.wfoot{position:sticky;bottom:-18px;background:#fff;padding:12px 0 2px;margin-top:10px;border-top:1px solid var(--line)}
.link{background:none;border:0;padding:2px 0;color:var(--accent);font-weight:800;font-size:12px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head><body>
<header>
  <h1>📦 Ready stock</h1>
  <div class="seg"><button id="doorPack" class="on">Packing station</button><button id="doorAdmin">Admin 🔒</button></div>
</header>

<main id="packDoor">
  <div class="card row">
    <span class="m">Packer</span>
    <select id="packer"></select>
    <span class="sp"></span>
    <span class="m" id="todayCount"></span>
  </div>
  <div class="modes"><button data-mode="pack" class="on">📦 Pack order</button><button data-mode="rto">↩️ RTO</button><button data-mode="hand">🚚 Hand-over</button></div>
  <div class="card">
    <div class="scanbox"><input id="scan" placeholder="Scan here…" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text"><button id="camBtn" title="Scan with camera">📷</button></div>
    <div class="m" id="scanHint" style="margin-top:6px">Scan the AWB on the packing slip to open the order.</div>
  </div>
  <div id="packView"></div>
  <div class="card"><div class="row"><b>Packed today</b><span class="sp"></span><button id="refreshToday">↻</button></div><div class="tw"><table id="todayTbl"></table></div></div>
</main>

<main id="adminDoor" class="hide">
  <div class="tabs" id="aTabs">
    <button data-t="orders" class="on">Orders</button><button data-t="items">Items &amp; labels</button><button data-t="stock">Stock</button><button data-t="pos">Vendor POs</button><button data-t="plan">Planning</button><button data-t="close">Day close</button><button data-t="settings">Settings</button>
  </div>
  <div id="aView"></div>
</main>

<div id="printArea"></div>
<div id="topbar"></div><div id="toasts"></div>

<script src="assets/nt-slip.js"></script>
<script>
const API = 'https://cozy-dieffenbachia-95eb4b.netlify.app/.netlify/functions/nt-inventory';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const ss = { get: k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} } };
async function apiFetch(payload, url = API, timeoutMs = 30000) {
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), timeoutMs);
  bar(true);
  try {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), signal: ctrl.signal });
    const d = await r.json().catch(() => ({}));
    if (d.error) { const e = new Error(d.error); e.status = r.status; throw e; }
    if (d.errorMessage) throw new Error('Server hiccup — try again');
    return d;
  } catch (e) { if (e.name === 'AbortError') throw new Error('Timed out — try again'); throw e; } finally { clearTimeout(t); bar(false); }
}
const api = (action, body = {}) => apiFetch({ action, ...body });
const adm = (action, body = {}) => apiFetch({ action, pin: ss.get('rs_pin') || '', ...body }).catch(e => { if (e.status === 401) { ss.set('rs_pin', ''); askPin(); } throw e; });
const fmtD = t => t ? new Date(t).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '—';
const dayOnly = t => t ? new Date(t).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) : '—';
const rs = n => '₹' + Math.round(+n || 0).toLocaleString('en-IN');

// ── feedback: top bar, toasts, progress ──
let busy = 0, barI = null, barT = null;
function bar(on) {
  const b = $('topbar'); if (!b) return;
  if (on) { if (busy++ === 0) { clearTimeout(barT); clearInterval(barI); b.classList.add('on'); let w = 10; b.style.width = w + '%'; barI = setInterval(() => { w += (92 - w) * .07; b.style.width = w + '%'; }, 200); } return; }
  if (--busy > 0) return; busy = 0; clearInterval(barI); b.style.width = '100%';
  barT = setTimeout(() => { b.classList.remove('on'); barT = setTimeout(() => { if (!busy) b.style.width = '0'; }, 400); }, 220);
}
function toast(msg, kind = '', ms = 2800) { const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg; $('toasts').appendChild(t); setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 260); }, ms); return t; }
const warn = m => toast(m, 'warn');
function ptoast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = '<span></span><div class="pb thin"><i style="width:4%"></i></div>'; t.firstChild.textContent = msg; $('toasts').appendChild(t);
  const i = t.querySelector('i');
  return { set(n, of, m) { i.style.width = Math.max(4, of ? Math.round(n / of * 100) : 0) + '%'; if (m) t.firstChild.textContent = m; },
    done(m, kind = 'ok') { i.style.width = '100%'; t.className = 'toast ' + kind; if (m) t.firstChild.textContent = m; setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 260); }, kind === 'bad' ? 4500 : 2600); } };
}
const pct = (n, of) => of > 0 ? Math.max(0, Math.min(100, Math.round(n / of * 100))) : 0;
const pb = (n, of, cls = '', label) => `${label != null ? `<div class="pbl"><span>${label}</span><span>${n}/${of}</span></div>` : ''}<div class="pb ${cls}"><i style="width:${pct(n, of)}%"></i></div>`;
function countUp(root) { root.querySelectorAll('[data-cu]').forEach(el => { const to = +el.dataset.cu, t0 = performance.now(); if (!to || matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = to; return; } const step = t => { const k = Math.min(1, (t - t0) / 600); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); }); }
function shopToast(shop) {
  if (!shop || shop.skipped) return;
  if (shop.error) return warn('Website quantity not updated: ' + shop.error);
  const s = shop.synced || []; if (!s.length) return;
  const bad = s.filter(x => !x.ok);
  toast(bad.length ? `Website: ${bad.length} item(s) not updated — ${bad[0].note}` : `Website quantity updated · ${s.length} item${s.length > 1 ? 's' : ''}`, bad.length ? 'warn' : 'ok', 2200);
}
function ask(msg, yes = 'Yes', danger) {
  return new Promise(res => modal(`<h3>Please confirm</h3><p style="line-height:1.5">${esc(msg)}</p><div class="row"><span class="sp"></span><button data-n>Cancel</button><button class="${danger ? 'a' : 'p'}" data-y>${esc(yes)}</button></div>`, (m, close) => {
    m.querySelector('[data-n]').onclick = () => { close(); res(false); }; m.querySelector('[data-y]').onclick = () => { close(); res(true); }; setTimeout(() => m.querySelector('[data-y]').focus(), 40);
  }, () => res(false)));
}
// re-renders of the same screen (every scan, every tick) should not replay the entrance animation
const still = (el, key) => { el.classList.toggle('noanim', el.dataset.k === key); el.dataset.k = key; };

// ── sound and flash: green ding for right, red buzz for wrong ──
let AC = null;
function tone(freq, ms, type = 'sine', vol = .2) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = freq; g.gain.value = vol; o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + ms / 1000); } catch (e) {} }
const ding = () => { tone(880, 90); setTimeout(() => tone(1320, 120), 90); };
const buzz = () => { tone(140, 380, 'square', .25); if (navigator.vibrate) navigator.vibrate([200, 80, 200]); };
function flash(kind, msg, sub, ms = 1400) { const d = document.createElement('div'); d.className = 'flash ' + kind; d.innerHTML = esc(msg) + (sub ? `<small>${esc(sub)}</small>` : ''); document.body.appendChild(d); setTimeout(() => d.remove(), ms); }

// ── doors ──
let door = 'pack';
function openDoor(d) {
  door = d; $('doorPack').classList.toggle('on', d === 'pack'); $('doorAdmin').classList.toggle('on', d === 'admin');
  $('packDoor').classList.toggle('hide', d !== 'pack'); $('adminDoor').classList.toggle('hide', d !== 'admin');
  if (d === 'admin') { if (!ss.get('rs_pin')) askPin(); else aTab(curTab); } else focusScan();
}
$('doorPack').onclick = () => openDoor('pack');
$('doorAdmin').onclick = () => openDoor('admin');
function modal(html, onReady, onDismiss, cls = '') {
  const mb = document.createElement('div'); mb.className = 'mb'; mb.innerHTML = `<div class="md ${cls}">${html}</div>`;
  let gone = false; const close = () => { if (gone) return; gone = true; mb.classList.add('out'); setTimeout(() => mb.remove(), 170); };
  mb.addEventListener('click', e => { if (e.target === mb || e.target.closest('[data-close]')) { close(); if (onDismiss) onDismiss(); } });
  document.body.appendChild(mb); if (onReady) onReady(mb.firstChild, close); return mb;
}
function askPin() {
  modal(`<h3>Admin PIN</h3><p class="m">The admin area changes stock and orders. Ask the owner for the PIN.</p><div class="row"><input id="pinIn" type="password" inputmode="numeric" placeholder="PIN" style="flex:1;font-size:20px"><button class="p" id="pinGo">Open</button></div><p class="m" id="pinErr"></p>`, (m, close) => {
    const go = async () => { const p = m.querySelector('#pinIn').value.trim(); try { await apiFetch({ action: 'rs_login', pin: p }); ss.set('rs_pin', p); close(); aTab(curTab); } catch (e) { m.querySelector('#pinErr').textContent = e.message; } };
    m.querySelector('#pinGo').onclick = go; m.querySelector('#pinIn').onkeydown = e => { if (e.key === 'Enter') go(); }; setTimeout(() => m.querySelector('#pinIn').focus(), 50);
  });
}

// ═════════════════════════ PACKING STATION ═════════════════════════
let mode = 'pack', P = null, RTO = null, HAND = { courier: '', list: [] }, ITEMS = [], packers = [], couriers = [], toHand = [];
const thumb = u => u ? u + (u.includes('?') ? '&' : '?') + 'width=160' : '';
function focusScan() { if (door === 'pack' && !document.querySelector('.mb') && document.activeElement && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) $('scan').focus(); }
document.addEventListener('click', () => setTimeout(focusScan, 0));
$('packer').onchange = () => ls.set('rs_packer', $('packer').value);
document.querySelectorAll('.modes button').forEach(b => b.onclick = () => { mode = b.dataset.mode; document.querySelectorAll('.modes button').forEach(x => x.classList.toggle('on', x === b)); P = null; RTO = null; renderPack(); });
const packerName = () => $('packer').value || '';
let lastCode = '', lastAt = 0;
$('scan').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const code = $('scan').value.trim(); $('scan').value = ''; if (!code) return;
  // a gun can read one sticker twice in a blink: the same code within 0.6 s counts once
  if (code === lastCode && Date.now() - lastAt < 600) return; lastCode = code; lastAt = Date.now();
  onScan(code);
});
async function onScan(code) {
  if (!packerName()) { buzz(); flash('bad', 'Pick your name first', 'Packer, at the top'); return; }
  try {
    if (mode === 'pack') await packScan(code);
    else if (mode === 'rto') await rtoScan(code);
    else await handScan(code);

// Courier booking through the same booking service the rack scanner uses; weight and box come from the pieces
function parcelFor(o) {
  let g = 0, l = 0, b = 0, h = 0, n = 0;
  for (const ln of o.lines) {
    if (ln.kind !== 'ready') { g += 380 * ln.qty; n += ln.qty; continue; }
    const parts = ln.parts && ln.parts.length ? ln.parts.map(p => ({ sku: p.sku, qty: p.qty * ln.qty })) : [{ sku: ln.sku, qty: ln.qty }];
    for (const p of parts) { const it = A.items.find(i => i.sku === p.sku) || {}; g += (it.weight_g || 500) * p.qty; n += p.qty; l = Math.max(l, +it.box_l || 0); b = Math.max(b, +it.box_b || 0); h += (+it.box_h || 0) * p.qty; }
  }
  return { kg: Math.max(.5, Math.ceil(g / 500) / 2), l: l || 24, b: b || 18, h: Math.max(5, Math.round(h) || 5 * n) };
}

function pickList(names) {

// One label per piece: EAN-13 bars, a QR of the same number, the name and the SKU

  const total = list.reduce((a, x) => a + x.n, 0), t = ptoast(`Preparing ${total} label(s)…`); t.set(40, 100);

function buildLabels(list, fmt) {
  const labs = []; list.forEach(x => { for (let k = 0; k < x.n; k++) labs.push(x.it); });
  const svgFor = ean => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); try { JsBarcode(s, ean, { format: 'EAN13', height: 34, width: 1.4, fontSize: 11, margin: 0, flat: true }); } catch (e) { JsBarcode(s, ean, { format: 'CODE128', height: 34, width: 1.2, fontSize: 11, margin: 0 }); } return s.outerHTML; };
  const qrFor = t => { const q = qrcode(0, 'M'); q.addData(t); q.make(); return q.createSvgTag({ cellSize: 2, margin: 0 }); };
  const one = it => `<div class="lb"><div class="qr">${qrFor(it.ean)}</div><div class="tx"><b>${esc(it.name)}</b>${it.variant ? `<span>${esc(it.variant)}</span>` : ''}<span class="sku">${esc(it.sku)}</span><div class="bc">${svgFor(it.ean)}</div></div></div>`;
  const css = fmt === 'a4'
    ? '@page{size:A4;margin:10mm 7mm}.sheet{display:grid;grid-template-columns:repeat(3,63.5mm);grid-auto-rows:33.9mm;gap:0 2.5mm}.lb{padding:2mm}'
    : '@page{size:50mm 25mm;margin:0}.lb{width:50mm;height:25mm;padding:1.2mm;break-after:page}';
  printHtml(`<style>${css}.lb{display:flex;gap:1.5mm;align-items:center;overflow:hidden;font-family:Arial;box-sizing:border-box}.qr svg{width:15mm;height:15mm;display:block}.tx{display:flex;flex-direction:column;min-width:0;font-size:7.5px;line-height:1.15}.tx b{font-size:8.5px}.tx .sku{color:#444}.bc svg{width:30mm;height:auto;display:block;margin-top:.5mm}</style><div class="sheet">${labs.map(one).join('')}</div>`);
}

  const rows = d.rows.sort((a, b) => ['out_before_vendor', 'low', 'ok'].indexOf(a.risk) - ['out_before_vendor', 'low', 'ok'].indexOf(b.risk) || (a.cover_days == null) - (b.cover_days == null) || (a.cover_days || 0) - (b.cover_days || 0));
  view().innerHTML = `<div class="card row"><b>Planning</b><span class="m">Sales speed over the last</span><select id="win">${[2, 3, 4, 5, 6, 14].map(n => `<option ${n === d.window ? 'selected' : ''}>${n}</option>`).join('')}</select><span class="m">days</span><span class="sp"></span><button class="p" id="mkPo" ${rows.some(r => r.suggest) ? '' : 'disabled'}>Draft PO from suggestions</button></div>
    <div class="card row">${[['Runs out before vendor', 'out_before_vendor', 'bad'], ['Low', 'low', 'warn'], ['OK', 'ok', 'ok']].map(([t, k, c]) => `<span class="stat"><span class="m">${t}</span><b data-cu="${nRisk(k)}" style="color:var(--${c === 'ok' ? 'ok' : c === 'bad' ? 'bad' : 'warn'})">${nRisk(k)}</b></span>`).join('')}<div style="flex:1;min-width:220px">${pb(nRisk('ok'), d.rows.length, 'ok', 'Items with enough cover')}</div></div>
    <div class="card tw"><table><tr><th>Item</th><th>Free</th><th>Incoming</th><th>Sold (${d.window} d)</th><th>Per day</th><th>vs 14 d</th><th>Lasts</th><th>Order</th><th>By</th><th></th></tr>
    ${rows.map(r => `<tr><td><b>${esc(r.name)}</b><div class="m">${r.stock} on shelf · ${r.reserved} promised · ${r.sold30} in 30 d</div></td><td class="b">${r.free}</td><td>${r.incoming || '—'}${r.next_po ? `<div class="m">${dayOnly(r.next_po)}</div>` : ''}</td><td>${r.sold_window}</td><td>${r.rate}</td><td style="color:${r.trend > 15 ? 'var(--ok)' : r.trend < -15 ? 'var(--bad)' : 'inherit'}">${r.trend > 0 ? '▲' : r.trend < 0 ? '▼' : ''} ${Math.abs(r.trend)}%</td><td style="min-width:120px">${r.cover_days == null ? '—' : r.cover_days + ' d'}<div class="m">needs ${(r.lead_days || 0) + (r.safety_days || 0)} d</div>${r.cover_days == null ? '' : `<div class="pb thin ${risk[r.risk][1]}"><i style="width:${pct(r.cover_days, ((r.lead_days || 0) + (r.safety_days || 0)) * 2 || 1)}%"></i></div>`}</td><td class="b">${r.suggest || '—'}</td><td>${r.suggest && r.order_by ? dayOnly(r.order_by) : '—'}</td><td><span class="chip ${risk[r.risk][1]}">${risk[r.risk][0]}</span></td></tr>`).join('') || '<tr><td colspan="10" class="m">Add items first.</td></tr>'}</table></div>`;
  countUp(view());
  $('win').onchange = e => { ls.set('rs_win', e.target.value); tPlan(); };
  $('mkPo').onclick = () => { aTab('pos'); setTimeout(() => tPos({ status: 'draft', lines: rows.filter(r => r.suggest).map(r => ({ sku: r.sku, qty: r.suggest })) }), 0); };
}

// ── Day close ──
async function tClose() {
  const date = ls.get('rs_close') || new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
  loading(); let d; try { d = await adm('rs_day_close', { date }); } catch (e) { return fail(e); }
  const lst = (title, xs, f) => `<div class="card"><b>${title}</b> <span class="chip ${xs.length ? 'warn' : 'ok'}">${xs.length}</span>${xs.length ? `<table>${xs.map(f).join('')}</table>` : ''}</div>`;
  view().innerHTML = `<div class="card row"><b>Day close</b><input type="date" id="cd" value="${esc(d.date)}"><span class="sp"></span><button onclick="window.print()">🖨️</button></div>
    <div class="card row">${[['Booked', d.booked], ['Packed', d.packed], ['Handed over', d.handed]].map(([k, n]) => `<span class="stat"><span class="m">${k}</span><b data-cu="${n}">${n}</b></span>`).join('')}${Object.entries(d.by_packer).map(([k, n]) => `<span class="stat"><span class="m">📦 ${esc(k)}</span><b data-cu="${n}">${n}</b></span>`).join('')}</div>
    <div class="card grid2"><div>${pb(d.packed, d.packed + d.ready_not_packed.length, d.ready_not_packed.length ? 'warn' : 'ok', 'Ready orders packed')}</div><div>${pb(Math.max(0, d.packed - d.packed_not_handed.length), d.packed, d.packed_not_handed.length ? 'warn' : 'ok', 'Packed today and handed over')}</div></div>
    ${lst('Packed but not handed over', d.packed_not_handed, x => `<tr><td>${esc(x.order_name)}</td><td>${esc(x.awb || '')}</td><td class="m">${esc(x.carrier || '')}</td></tr>`)}
    ${lst('Ready but not packed', d.ready_not_packed, x => `<tr><td>${esc(x.order_name)}</td><td>${esc(x.awb || '')}</td><td class="m">${x.age_days} d old</td></tr>`)}
    ${lst('Still to book', d.to_book, x => `<tr><td>${esc(x.order_name)}</td><td class="m">${x.age_days} d old</td></tr>`)}
    ${lst('Problems', d.problems, x => `<tr><td>${esc(x.order_name)}</td><td>${esc(x.problem || '')}</td></tr>`)}
    ${lst('Waiting 5+ days for a quote', d.waiting_long, x => `<tr><td>${esc(x.order_name)}</td><td>${x.quotes.found}/${x.quotes.need} painted</td><td class="m">${x.age_days} d</td></tr>`)}`;
  countUp(view());
  $('cd').onchange = e => { ls.set('rs_close', e.target.value); tClose(); };
}

// ── Settings ──
async function tSettings() {
  loading(); let d; try { d = await adm('rs_settings'); } catch (e) { return fail(e); }
  view().innerHTML = `<div class="card"><b>Website stock</b><p class="m">On by default. The website's quantity for each item = on shelf − promised, updated after every pack, delivery, return, count and edit. A finish priced ₹0 on the website is held at 0 so it can never be bought by accident.</p><label class="tick"><input type="checkbox" id="sOn" ${d.shopify.on ? 'checked' : ''}> Keep Shopify quantities in step</label><label class="m">Shopify location ID <input id="sLoc" value="${esc(d.shopify.location_id)}"></label></div>
    <div class="card grid2"><label>Packers (comma-separated)<input id="sPk" value="${esc(d.packers.join(', '))}"></label><label>Couriers for hand-over<input id="sCr" value="${esc(d.couriers.join(', '))}"></label><label>EAN prefix (20 = own codes; a GS1 prefix later)<input id="sEp" value="${esc(d.ean.prefix)}"></label><label>New admin PIN (leave empty to keep)<input id="sPin" type="password" inputmode="numeric"></label></div>
    <div class="row"><span class="sp"></span><button class="p" id="sSave">Save settings</button></div>`;
  $('sSave').onclick = async () => {
    const on = $('sOn').checked;
    if (on && !d.shopify.on && !await ask('Turn on website stock sync? Every ready item will show on the website with its free quantity (₹0 items stay at 0).', 'Turn on')) return;
    if (!on && d.shopify.on && !await ask('Turn off website stock sync? Website quantities will stop following the shelf until you turn it back on.', 'Turn off', true)) return;
    const set = { shopify: { on, location_id: $('sLoc').value.trim() }, packers: $('sPk').value.split(',').map(s => s.trim()).filter(Boolean), couriers: $('sCr').value.split(',').map(s => s.trim()).filter(Boolean), ean_prefix: $('sEp').value.trim() };
    const pin = $('sPin').value.trim(); if (pin) set.new_pin = pin;
    try { await adm('rs_settings', { set }); if (pin) ss.set('rs_pin', pin); toast('Settings saved', 'ok'); tSettings(); } catch (e) { toast(e.message, 'bad'); }
  };
}

renderPack(); loadToday(); focusScan();
</script>
</body></html>
