<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NT Tracking — BlueDart → Shopify</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#d4541f;--ink:#3a2b1d;--ink2:#6f5b46;--muted:#9c8a76;--line:#e9ddca;--bg:#f6f0e8;--bg2:#fdf5ec;--green:#27ae60;--red:#e74c3c}
body{font-family:Nunito,Helvetica Neue,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}

.header{background:#fff;border-bottom:3px solid var(--accent);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.header h1{font-family:Fraunces,Georgia,serif;font-size:1.05rem;white-space:nowrap}
.hbtn{padding:7px 13px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:.78rem;cursor:pointer;white-space:nowrap}
.hbtn:hover{border-color:var(--accent);color:var(--accent)}
.hbtn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.hbtn:disabled{opacity:.45;cursor:default}

.toolbar{padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.date-input{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:.84rem;color:var(--ink);background:#fff;cursor:pointer}
.date-input:focus{outline:none;border-color:var(--accent)}
.toolbar-sep{color:var(--muted);font-size:.8rem}
.badge{background:var(--accent);color:#fff;border-radius:10px;font-size:.7rem;padding:1px 7px;font-weight:700}
.filter-tabs{display:flex;gap:4px}
.ftab{padding:5px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:.75rem;cursor:pointer;white-space:nowrap}
.ftab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.wrap{padding:10px 14px;display:flex;flex-direction:column;gap:6px}

/* ── ROW ── */
.tr-row{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;display:flex;flex-direction:column;gap:7px}
.tr-row.no-tracking{border-left:3px solid var(--accent)}
.tr-row.pushed{border-color:var(--green);border-left-width:3px}
.tr-row.err-row{border-left:3px solid var(--red)}

.tr-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tr-order{font-weight:700;font-size:.9rem;flex-shrink:0}
.tr-customer{font-size:.78rem;color:var(--ink2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-date{font-size:.72rem;color:var(--muted);white-space:nowrap;flex-shrink:0}
.tr-fstatus{font-size:.7rem;border-radius:10px;padding:2px 8px;font-weight:700;flex-shrink:0}
.fs-unfulfilled{background:#fff3e0;color:#b7650a}
.fs-fulfilled{background:#e8f5e9;color:#2e7d32}
.fs-partial{background:#e3f2fd;color:#1565c0}

/* BlueDart status block */
.bd-status{font-size:.78rem;padding:7px 10px;border-radius:7px;background:var(--bg2);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bd-status.bd-loading{color:var(--muted)}
.bd-status.bd-ok{background:#e8f8ef}
.bd-status.bd-delivered{background:#d4edda}
.bd-status.bd-pending{background:#fff8e1}
.bd-status.bd-err{background:#fdecea}
.bd-label{font-weight:700;color:var(--ink2)}
.bd-desc{color:var(--ink)}
.bd-loc{color:var(--muted);font-size:.72rem}
.bd-time{color:var(--muted);font-size:.72rem;margin-left:auto}

/* Journey */
.journey-toggle{font-size:.72rem;color:var(--accent);cursor:pointer;text-decoration:underline;border:none;background:none;padding:0;margin-left:4px}
.journey-list{margin-top:5px;border-left:2px solid var(--line);padding-left:10px;display:flex;flex-direction:column;gap:4px}
.journey-step{font-size:.72rem;color:var(--ink2);display:flex;gap:6px}
.journey-step .js-time{color:var(--muted);white-space:nowrap;flex-shrink:0}
.journey-step .js-loc{font-weight:600}

/* Address line */
.tr-addr{font-size:.73rem;color:var(--ink2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tr-addr a{color:var(--accent);text-decoration:none}
.tr-addr a:hover{text-decoration:underline}

/* AWB input row */
.tr-awb-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.awb-input{padding:6px 10px;border:1.5px solid var(--line);border-radius:7px;font-size:.84rem;font-family:monospace;width:160px;color:var(--ink);background:#fff}
.awb-input:focus{outline:none;border-color:var(--accent)}
.awb-input.verified{border-color:var(--green)}
.awb-input.err{border-color:var(--red)}
.act-btn{padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:.73rem;cursor:pointer;white-space:nowrap}
.act-btn:hover{border-color:var(--accent);color:var(--accent)}
.act-btn.push{background:var(--accent);color:#fff;border-color:var(--accent)}
.act-btn.push:hover{background:#b8401a}
.act-btn:disabled{opacity:.4;cursor:default}
.pushed-label{font-size:.78rem;font-weight:700;color:var(--green)}

.tr-result{font-size:.73rem;padding:5px 8px;border-radius:6px}
.tr-result.ok-msg{background:#e8f8ef;color:var(--green)}
.tr-result.err-msg{background:#fdecea;color:var(--red)}

/* floating pill */
#bulkPill{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#3a2b1d;color:#fff;border-radius:100px;padding:8px 8px 8px 18px;align-items:center;gap:8px;font-size:.82rem;box-shadow:0 4px 24px rgba(0,0,0,.35);z-index:200;white-space:nowrap}
#bulkPill.show{display:flex}
.pill-btn{padding:6px 16px;border-radius:100px;border:none;cursor:pointer;font-size:.78rem;font-weight:700}
.pill-push{background:var(--accent);color:#fff}
.pill-cancel{background:transparent;color:#aaa;padding:6px 8px}

.spinner{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-msg,.empty-msg{text-align:center;padding:50px 20px;color:var(--muted);font-size:.88rem}
#toast{position:fixed;bottom:80px;right:20px;background:#3a2b1d;color:#fff;padding:10px 18px;border-radius:8px;font-size:.82rem;opacity:0;pointer-events:none;transition:opacity .3s;z-index:999;max-width:320px}
#toast.show{opacity:1}
</style>
</head>
<body>

<div class="header">
  <h1>📦 BlueDart → Shopify</h1>
  <span id="fetchStatus" style="font-size:.78rem;color:var(--muted);display:none"></span>
  <label class="hbtn accent" style="cursor:pointer">↑ Shipway CSV<input type="file" accept=".csv,text/csv,.xlsx" style="display:none" onchange="importCsv(this)"></label>
  <a href="nt-inventory.html" class="hbtn">← Inventory</a>
</div>

<div class="toolbar">
  <input class="date-input" type="date" id="dateFrom" onchange="loadOrders()">
  <span class="toolbar-sep">to</span>
  <input class="date-input" type="date" id="dateTo" onchange="loadOrders()">
  <span id="totalBadge" class="badge" style="display:none"></span>
  <div class="filter-tabs" id="filterTabs">
    <button class="ftab active" onclick="setFilter('all')">All</button>
    <button class="ftab" onclick="setFilter('no_tracking')">No tracking</button>
    <button class="ftab" onclick="setFilter('has_awb')">AWB found</button>
  </div>
</div>

<div class="wrap" id="wrap">
  <div class="empty-msg">Select a date above to load orders.</div>
</div>

<div id="bulkPill">
  <span><span id="bulkCount">0</span> ready</span>
  <button class="pill-btn pill-push" onclick="pushAll()">⬆ Push all to Shopify</button>
  <button class="pill-btn pill-cancel" onclick="clearPending()">✕</button>
</div>

<div id="toast"></div>

<script>
const API = 'https://cozy-dieffenbachia-95eb4b.netlify.app/.netlify/functions/nt-bluedart';

let rows = [];
let activeFilter = 'all';

function todayIST() {
  return new Date(Date.now() + 5.5 * 60 * 60 * 1000).toISOString().slice(0, 10);
}

window.addEventListener('DOMContentLoaded', () => {
  const today = todayIST();
  document.getElementById('dateFrom').value = today;
  document.getElementById('dateTo').value = today;
  loadOrders();
});

async function apiFetch(body) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return r.json();
}

function setFetchStatus(msg) {
  const el = document.getElementById('fetchStatus');
  el.textContent = msg;
  el.style.display = msg ? '' : 'none';
}

// ── LOAD ──────────────────────────────────────────────────────────────────────

async function loadOrders() {
  const dateFrom = document.getElementById('dateFrom').value;
  const dateTo   = document.getElementById('dateTo').value;
  if (!dateFrom) return;

  document.getElementById('wrap').innerHTML = '<div class="loading-msg"><span class="spinner"></span> Loading orders…</div>';
  document.getElementById('totalBadge').style.display = 'none';
  setFetchStatus('');

  try {
    const data = await apiFetch({ action: 'load_orders', date_from: dateFrom, date_to: dateTo || dateFrom });
    rows = (Array.isArray(data) ? data : []).map(o => ({
      ...o,
      awbInput: o.known_awb || '',
      bdStatus: null,
      result:   null,
    }));
    const n = rows.length;
    document.getElementById('totalBadge').textContent = n;
    document.getElementById('totalBadge').style.display = n ? '' : 'none';
    renderRows();
    setFetchStatus(n ? `↑ Upload Shipway CSV to match AWBs` : '');
  } catch(e) {
    document.getElementById('wrap').innerHTML = `<div class="empty-msg">Error: ${e.message}</div>`;
  }
}

// ── FETCH BLUEDART STATUS (by AWB) ────────────────────────────────────────────

async function fetchBluedartStatus(rowsToFetch) {
  if (!rowsToFetch.length) return;
  const total = rowsToFetch.length;
  setFetchStatus(`⏳ Fetching BlueDart status for ${total} shipments…`);

  // BlueDart custawbquery supports bulk comma-separated AWBs
  const CHUNK = 20;
  for (let i = 0; i < rowsToFetch.length; i += CHUNK) {
    const chunk = rowsToFetch.slice(i, i + CHUNK);
    const awbs = chunk.map(r => r.awbInput);
    try {
      const data = await apiFetch({ action: 'fetch_tracking', awbs });
      const byAwb = {};
      for (const res of (data.results || [])) if (res.awb) byAwb[res.awb] = res;
      for (const r of chunk) {
        r.bdStatus = byAwb[r.awbInput]
          ? { ...byAwb[r.awbInput], ok: true }
          : { error: 'Not found in BlueDart', ok: false };
        const el = document.getElementById(`bd-${r.order_name}`);
        if (el) el.innerHTML = bdStatusHtml(r);
      }
    } catch(e) {
      for (const r of chunk) {
        r.bdStatus = { error: e.message, ok: false };
        const el = document.getElementById(`bd-${r.order_name}`);
        if (el) el.innerHTML = bdStatusHtml(r);
      }
    }
    setFetchStatus(`⏳ ${Math.min(i + CHUNK, total)}/${total} done…`);
  }
  setFetchStatus(`✓ Status fetched for ${total} shipments`);
  setTimeout(() => setFetchStatus(''), 4000);
}

// ── RENDER ────────────────────────────────────────────────────────────────────

function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.ftab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.ftab').forEach((b, _, all) => {
    const map = { all: 'All', no_tracking: 'No tracking', has_awb: 'AWB found' };
    if (b.textContent === map[f]) b.classList.add('active');
  });
  renderRows();
}

function getVisible() {
  if (activeFilter === 'no_tracking') return rows.filter(r => !r.awbInput);
  if (activeFilter === 'has_awb')     return rows.filter(r => r.awbInput);
  return rows;
}

function renderRows() {
  const visible = getVisible();
  if (!visible.length) {
    document.getElementById('wrap').innerHTML = '<div class="empty-msg">No orders match this filter.</div>';
    updatePending();
    return;
  }
  document.getElementById('wrap').innerHTML = visible.map(r => rowHTML(r)).join('');
  for (const r of visible) attachInputListener(r);
  updatePending();
}

function rowHTML(r) {
  const dateStr = r.created_at ? new Date(r.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  const fsCls   = { unfulfilled: 'fs-unfulfilled', fulfilled: 'fs-fulfilled', partial: 'fs-partial' }[r.fulfillment_status] || 'fs-unfulfilled';
  const fsLabel = { unfulfilled: 'Unfulfilled', fulfilled: 'Fulfilled', partial: 'Partial' }[r.fulfillment_status] || r.fulfillment_status;
  const pushed  = r.result?.ok;
  const errored = r.result && !r.result.ok;

  const addrHtml = (r.address || r.phone) ? `<div class="tr-addr">
    ${r.address ? `<span>📍 ${escHtml(r.address)}</span>` : ''}
    ${r.phone ? `<a href="tel:${escHtml(r.phone)}">📞 ${escHtml(r.phone)}</a>` : ''}
  </div>` : '';

  const awbSection = pushed
    ? `<div class="tr-awb-row"><span class="pushed-label">✓ Tracking pushed to Shopify · AWB ${escHtml(r.awbInput)}</span></div>`
    : `<div class="tr-awb-row">
        <input class="awb-input" id="awb-${r.order_name}" type="text"
          placeholder="AWB — upload Shipway CSV" inputmode="numeric" maxlength="15" value="${escHtml(r.awbInput)}">
        <button class="act-btn push" onclick="pushRow('${r.order_name}')" ${!r.awbInput ? 'disabled' : ''}>⬆ Push to Shopify</button>
      </div>`;

  return `<div class="tr-row${!r.awbInput ? ' no-tracking' : ''}${pushed ? ' pushed' : ''}${errored ? ' err-row' : ''}" id="row-${r.order_name}">
    <div class="tr-top">
      <span class="tr-order">${r.order_name}</span>
      <span class="tr-customer">${escHtml(r.customer)}</span>
      <span class="tr-date">${dateStr}</span>
      <span class="tr-fstatus ${fsCls}">${fsLabel}</span>
      ${r.awbInput ? `<span style="font-size:.72rem;color:var(--muted);font-family:monospace">AWB: ${escHtml(r.awbInput)}</span>` : ''}
    </div>
    ${addrHtml}
    <div id="bd-${r.order_name}">${bdStatusHtml(r)}</div>
    ${awbSection}
    ${r.result ? `<div class="tr-result ${r.result.ok ? 'ok-msg' : 'err-msg'}">${r.result.ok ? `✓ ${(r.result.action||'').replace(/_/g,' ')} — WhatsApp triggered` : `✕ ${escHtml(r.result.error)}`}</div>` : ''}
  </div>`;
}

function bdStatusHtml(r) {
  if (!r.awbInput) return '';
  if (!r.bdStatus) return `<div class="bd-status bd-loading"><span class="spinner"></span> Fetching BlueDart status…</div>`;
  if (r.bdStatus.error) return `<div class="bd-status bd-err"><span class="bd-label">BlueDart:</span> <span style="color:var(--red)">${escHtml(r.bdStatus.error)}</span></div>`;

  const s = r.bdStatus;
  const scans = Array.isArray(s.scans) ? s.scans : [];
  const latest = scans[scans.length - 1] || null;
  const desc = s.statusDesc || s.statusCode || '';

  // Exact match delivery codes only
  const DELIVERED_CODES = ['DL', 'DEL', 'OD'];
  const isDelivered = DELIVERED_CODES.includes((s.statusCode || '').toUpperCase())
    || desc.toLowerCase() === 'delivered';
  const isBooked = !desc;

  const cls = isDelivered ? 'bd-delivered' : isBooked ? 'bd-pending' : 'bd-ok';
  const statusLine = isDelivered ? `✓ Delivered`
    : isBooked ? `📋 AWB booked — awaiting pickup`
    : `🚚 ${escHtml(desc)}`;

  const locTime = latest
    ? `${latest.location ? `<span class="bd-loc">📍 ${escHtml(latest.location)}</span>` : ''}${latest.time ? `<span class="bd-time">${escHtml(latest.time)}</span>` : ''}`
    : s.statusTime ? `<span class="bd-time">${escHtml(s.statusTime)}</span>` : '';

  const journeyId = `journey-${r.order_name}`;
  const journeyBody = scans.length ? `
    <div id="${journeyId}" class="journey-list" style="display:none">
      ${[...scans].reverse().map(sc => `<div class="journey-step">
        <span class="js-time">${escHtml(sc.time || '')}</span>
        <span><span class="js-loc">${escHtml(sc.location || '')}</span>${sc.remark ? ' — ' + escHtml(sc.remark) : ''}</span>
      </div>`).join('')}
    </div>` : '';

  const journeyBtn = scans.length
    ? `<button class="journey-toggle" onclick="toggleJourney('${journeyId}',this)">▶ Journey (${scans.length})</button>` : '';

  return `<div class="bd-status ${cls}" style="flex-direction:column;align-items:flex-start;gap:4px">
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <span class="bd-label">BlueDart:</span>
      <span class="bd-desc">${statusLine}</span>
      ${locTime}
      ${journeyBtn}
    </div>
    ${journeyBody}
  </div>`;
}

function toggleJourney(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  const open = el.style.display !== 'none';
  el.style.display = open ? 'none' : 'flex';
  btn.textContent = btn.textContent.replace(open ? '▼' : '▶', open ? '▶' : '▼');
}

function attachInputListener(r) {
  const inp = document.getElementById(`awb-${r.order_name}`);
  if (!inp) return;
  inp.addEventListener('input', () => {
    r.awbInput = inp.value.trim();
    r.bdStatus = null;
    updatePending();
    const el = document.getElementById(`bd-${r.order_name}`);
    if (el) el.innerHTML = '';
  });
}

function refreshBdStatus(r) {
  const el = document.getElementById(`bd-${r.order_name}`);
  if (el) el.innerHTML = bdStatusHtml(r);
}

// ── PUSH TO SHOPIFY ───────────────────────────────────────────────────────────

async function pushRow(orderName) {
  const r = rows.find(x => x.order_name === orderName);
  if (!r?.awbInput) return;
  const btn = document.querySelector(`#row-${orderName} .act-btn.push`);
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    const data = await apiFetch({ action: 'push_tracking', order_name: orderName, awb: r.awbInput, notify_customer: true });
    r.result = { ok: true, ...data };
    toast(`✓ ${orderName} — tracking pushed, WhatsApp triggered`);
  } catch(e) {
    r.result = { ok: false, error: e.message };
    toast(`✕ ${orderName}: ${e.message}`);
  }
  const rowEl = document.getElementById(`row-${orderName}`);
  if (rowEl) { rowEl.outerHTML = rowHTML(r); attachInputListener(r); }
  updatePending();
}

async function pushAll() {
  const ready = rows.filter(r => r.awbInput && !r.result?.ok);
  if (!ready.length) return;
  const btn = document.querySelector('#bulkPill .pill-push');
  btn.disabled = true; btn.textContent = '…pushing';
  try {
    const data = await apiFetch({ action: 'push_tracking_bulk', items: ready.map(r => ({ order_name: r.order_name, awb: r.awbInput })) });
    let ok = 0, fail = 0;
    for (const res of data.results || []) {
      const r = rows.find(x => x.order_name === res.order_name);
      if (!r) continue;
      r.result = res;
      if (res.ok) ok++; else fail++;
      const rowEl = document.getElementById(`row-${res.order_name}`);
      if (rowEl) { rowEl.outerHTML = rowHTML(r); attachInputListener(r); }
    }
    toast(`Pushed ${ok}${fail ? `, ${fail} failed` : ''} orders`);
  } catch(e) { toast('Bulk push failed: ' + e.message); }
  btn.disabled = false; btn.textContent = '⬆ Push all to Shopify';
  updatePending();
}

function clearPending() { updatePending(); }

function updatePending() {
  const ready = rows.filter(r => r.awbInput && !r.result?.ok).length;
  document.getElementById('bulkCount').textContent = ready;
  document.getElementById('bulkPill').classList.toggle('show', ready > 0);
}

// ── SHIPWAY CSV IMPORT ────────────────────────────────────────────────────────
// Shipway CSV columns: "Order Id", "Courier Name", "Tracking Number", Status, ...

function parseCsvLine(line) {
  // Handle quoted fields (CSV with commas inside quotes)
  const result = [];
  let cur = '', inQuote = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQuote = !inQuote; }
    else if (ch === ',' && !inQuote) { result.push(cur.trim()); cur = ''; }
    else { cur += ch; }
  }
  result.push(cur.trim());
  return result;
}

function importCsv(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const lines = e.target.result.trim().split('\n').filter(l => l.trim());
    const headerCols = parseCsvLine(lines[0].replace(/\r/g, ''));
    const header = headerCols.map(h => h.toLowerCase().replace(/[^a-z0-9]/g, ''));

    // Match Shipway column names: "Order Id" → orderid, "Tracking Number" → trackingnumber
    const oIdx = header.findIndex(h => h === 'orderid' || h === 'orderno' || h === 'order');
    const aIdx = header.findIndex(h => h === 'trackingnumber' || h === 'awb' || h === 'tracking' || h === 'waybill');

    if (oIdx < 0 || aIdx < 0) {
      toast(`Column not found. Headers: ${headerCols.slice(0,5).join(', ')}`);
      return;
    }

    let matched = 0, skipped = 0;
    for (let i = 1; i < lines.length; i++) {
      const cols = parseCsvLine(lines[i].replace(/\r/g, ''));
      const orderId = (cols[oIdx] || '').trim();
      const awb     = (cols[aIdx] || '').trim();
      if (!orderId || !awb) { skipped++; continue; }

      // Match by order number with or without # prefix
      const r = rows.find(x =>
        x.order_name === orderId ||
        x.order_name === '#' + orderId ||
        x.order_name.replace(/^#/, '') === orderId
      );
      if (r) { r.awbInput = awb; r.bdStatus = null; matched++; }
    }

    renderRows();
    toast(`✓ ${matched} orders matched${skipped ? ` (${skipped} skipped)` : ''}`);

    // Auto-fetch BlueDart tracking status for all matched AWBs
    const withAwb = rows.filter(r => r.awbInput && !r.bdStatus);
    if (withAwb.length) fetchBluedartStatus(withAwb);
  };
  reader.readAsText(file);
  input.value = '';
}

// ── UTILS ─────────────────────────────────────────────────────────────────────

function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 4000);
}
</script>
