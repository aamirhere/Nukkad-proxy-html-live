<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NT Tracking — BlueDart → Shopify</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#d4541f;--ink:#3a2b1d;--ink2:#6f5b46;--muted:#9c8a76;--line:#e9ddca;--bg:#f6f0e8;--bg2:#fdf5ec;--green:#27ae60;--red:#e74c3c}
body{font-family:Nunito,Helvetica Neue,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}

.header{background:#fff;border-bottom:3px solid var(--accent);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.header h1{font-family:Fraunces,Georgia,serif;font-size:1.05rem}
.header-sub{font-size:.72rem;color:var(--muted);margin-left:auto}
.hbtn{padding:7px 14px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:.78rem;cursor:pointer;white-space:nowrap}
.hbtn:hover{border-color:var(--accent);color:var(--accent)}
.hbtn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.hbtn:disabled{opacity:.45;cursor:default}

.toolbar{padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=text]{padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:.84rem;color:var(--ink);background:#fff;min-width:180px;flex:1}
.toolbar input:focus{outline:none;border-color:var(--accent)}
.badge{background:var(--accent);color:#fff;border-radius:10px;font-size:.7rem;padding:1px 7px;font-weight:700}

.wrap{padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.section-lbl{font-size:.68rem;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding:6px 0 2px}

/* ── ROW ── */
.tr-row{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tr-row.has-tracking{border-color:#b8e4c9;background:#f0faf4}
.tr-row.pushed{border-color:var(--green)}
.tr-row.error-row{border-color:#f5c6c0}

.tr-order{font-weight:700;font-size:.88rem;min-width:62px;flex-shrink:0}
.tr-customer{font-size:.78rem;color:var(--ink2);flex:1;min-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-date{font-size:.72rem;color:var(--muted);white-space:nowrap;flex-shrink:0}

.tr-awb{display:flex;align-items:center;gap:6px;flex-shrink:0}
.awb-input{padding:6px 10px;border:1.5px solid var(--line);border-radius:7px;font-size:.84rem;font-family:monospace;width:148px;color:var(--ink);background:#fff}
.awb-input:focus{outline:none;border-color:var(--accent)}
.awb-input.verified{border-color:var(--green);background:#f0faf4}
.awb-input.err{border-color:var(--red)}

.tr-status{font-size:.72rem;border-radius:10px;padding:3px 9px;white-space:nowrap;flex-shrink:0;font-weight:700}
.st-none{background:var(--bg2);color:var(--muted)}
.st-ok{background:#e8f8ef;color:var(--green)}
.st-dl{background:#d4edda;color:#155724}
.st-err{background:#fdecea;color:var(--red)}

.tr-actions{display:flex;gap:6px;flex-shrink:0;margin-left:auto}
.act-btn{padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:.73rem;cursor:pointer;white-space:nowrap}
.act-btn:hover{border-color:var(--accent);color:var(--accent)}
.act-btn.push{background:var(--accent);color:#fff;border-color:var(--accent)}
.act-btn.push:hover{background:#b8401a}
.act-btn:disabled{opacity:.4;cursor:default}

.tr-result{width:100%;font-size:.73rem;padding:4px 8px;border-radius:6px;margin-top:2px}
.tr-result.ok-msg{background:#e8f8ef;color:var(--green)}
.tr-result.err-msg{background:#fdecea;color:var(--red)}

/* ── BULK IMPORT ── */
.csv-hint{font-size:.75rem;color:var(--muted);margin-top:4px}
.csv-hint code{background:var(--line);border-radius:3px;padding:1px 4px;font-size:.72rem}

/* ── FLOATING PILL ── */
#bulkPill{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#3a2b1d;color:#fff;border-radius:100px;padding:8px 8px 8px 18px;align-items:center;gap:8px;font-size:.82rem;box-shadow:0 4px 24px rgba(0,0,0,.35);z-index:200;white-space:nowrap}
#bulkPill.show{display:flex}
.pill-btn{padding:6px 16px;border-radius:100px;border:none;cursor:pointer;font-size:.78rem;font-weight:700}
.pill-push{background:var(--accent);color:#fff}
.pill-cancel{background:transparent;color:#aaa;padding:6px 8px}

/* ── SPINNER ── */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

.loading-msg,.empty-msg{text-align:center;padding:50px 20px;color:var(--muted);font-size:.88rem}

#toast{position:fixed;bottom:80px;right:20px;background:#3a2b1d;color:#fff;padding:10px 18px;border-radius:8px;font-size:.82rem;opacity:0;pointer-events:none;transition:opacity .3s;z-index:999}
#toast.show{opacity:1}
</style>
</head>
<body>

<div class="header">
  <h1>📦 BlueDart → Shopify Tracking</h1>
  <span class="header-sub" id="headerSub">Load orders to begin</span>
  <button class="hbtn accent" onclick="loadOrders()">↺ Load orders needing tracking</button>
  <label class="hbtn" style="cursor:pointer">↑ CSV import<input type="file" accept=".csv,text/csv" style="display:none" onchange="importCsv(this)"></label>
  <a href="nt-inventory.html" class="hbtn">← Inventory</a>
</div>

<div class="toolbar">
  <input type="text" id="searchInput" placeholder="Search order # or customer…" oninput="renderRows()">
  <span id="totalBadge" class="badge" style="display:none"></span>
  <span style="font-size:.78rem;color:var(--muted)" id="pendingLbl"></span>
</div>

<div class="wrap" id="wrap">
  <div class="empty-msg">Click "Load orders needing tracking" to begin.</div>
</div>

<div id="bulkPill">
  <span><span id="bulkCount">0</span> ready to push</span>
  <button class="pill-btn pill-push" onclick="pushAll()">⬆ Push all to Shopify</button>
  <button class="pill-btn pill-cancel" onclick="clearPending()">✕</button>
</div>

<div id="toast"></div>

<script>
const API = 'https://cozy-dieffenbachia-95eb4b.netlify.app/.netlify/functions/nt-bluedart';

let rows = [];         // { order_id, order_name, customer, created_at, tracking, note_awb, awbInput, status, result }
let pendingPush = {};  // order_name → awb — ready to push

async function apiFetch(body) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return r.json();
}

// ── LOAD ORDERS ───────────────────────────────────────────────────────────────

async function loadOrders() {
  document.getElementById('wrap').innerHTML = '<div class="loading-msg"><span class="spinner"></span> Loading orders…</div>';
  document.getElementById('headerSub').textContent = 'Loading…';
  try {
    const data = await apiFetch({ action: 'load_orders' });
    rows = (Array.isArray(data) ? data : []).map(o => ({
      ...o,
      awbInput: o.note_awb || '',
      bdStatus: null,   // fetched from BlueDart
      result:   null,   // push result
    }));
    renderRows();
    const n = rows.length;
    document.getElementById('headerSub').textContent = `${n} order${n !== 1 ? 's' : ''} without tracking`;
    document.getElementById('totalBadge').textContent = n;
    document.getElementById('totalBadge').style.display = n ? '' : 'none';
    if (!n) toast('All fulfilled orders have tracking ✅');
  } catch(e) {
    document.getElementById('wrap').innerHTML = `<div class="empty-msg">Error: ${e.message}</div>`;
  }
}

// ── RENDER ────────────────────────────────────────────────────────────────────

function renderRows() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const visible = q ? rows.filter(r => r.order_name.toLowerCase().includes(q) || r.customer.toLowerCase().includes(q)) : rows;

  if (!visible.length) {
    document.getElementById('wrap').innerHTML = '<div class="empty-msg">No orders found.</div>';
    updateBulkPill();
    return;
  }

  document.getElementById('wrap').innerHTML = visible.map(r => rowHTML(r)).join('');

  // Restore AWB input values and attach listeners
  for (const r of visible) {
    const inp = document.getElementById(`awb-${r.order_name}`);
    if (inp) {
      inp.value = r.awbInput || '';
      inp.addEventListener('input', () => { r.awbInput = inp.value.trim(); r.bdStatus = null; inp.className = 'awb-input'; updatePending(r); });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') verifyRow(r.order_name); });
    }
  }
  updateBulkPill();
}

function rowHTML(r) {
  const dateStr = r.created_at ? new Date(r.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) : '';
  const statusHtml = bdStatusHtml(r.bdStatus);
  const hasPending = !!pendingPush[r.order_name];
  const pushed = r.result?.ok;
  const errored = r.result && !r.result.ok;

  return `<div class="tr-row${pushed ? ' pushed' : ''}${errored ? ' error-row' : ''}" id="row-${r.order_name}">
    <span class="tr-order">${r.order_name}</span>
    <span class="tr-customer">${escHtml(r.customer)}</span>
    <span class="tr-date">${dateStr}</span>
    <div class="tr-awb">
      <input class="awb-input${r.bdStatus?.ok ? ' verified' : r.bdStatus?.error ? ' err' : ''}"
        id="awb-${r.order_name}"
        type="text" placeholder="AWB number"
        inputmode="numeric" maxlength="15">
      <button class="act-btn" onclick="verifyRow('${r.order_name}')" title="Verify with BlueDart">🔍</button>
    </div>
    ${statusHtml}
    <div class="tr-actions">
      ${!pushed ? `<button class="act-btn push" onclick="pushRow('${r.order_name}')" ${!r.awbInput ? 'disabled' : ''}>⬆ Push</button>` : '<span style="color:var(--green);font-size:.8rem;font-weight:700">✓ Done</span>'}
    </div>
    ${r.result ? `<div class="tr-result ${r.result.ok ? 'ok-msg' : 'err-msg'}">${r.result.ok ? `✓ ${r.result.action?.replace('_', ' ')} — fulfillment updated, WhatsApp triggered` : `✕ ${escHtml(r.result.error)}`}</div>` : ''}
  </div>`;
}

function bdStatusHtml(s) {
  if (!s) return '<span class="tr-status st-none">—</span>';
  if (s.error) return `<span class="tr-status st-err" title="${escHtml(s.error)}">⚠ Not found</span>`;
  const delivered = s.delivered;
  return `<span class="tr-status ${delivered ? 'st-dl' : 'st-ok'}" title="${escHtml(s.statusDesc || '')}">${delivered ? '✓ Delivered' : (s.statusDesc || s.statusCode || 'In transit')}</span>`;
}

// ── VERIFY ROW ────────────────────────────────────────────────────────────────

async function verifyRow(orderName) {
  const r = rows.find(x => x.order_name === orderName);
  if (!r || !r.awbInput) { toast('Enter an AWB number first'); return; }

  const inp = document.getElementById(`awb-${orderName}`);
  if (inp) inp.disabled = true;

  try {
    const data = await apiFetch({ action: 'fetch_tracking', awbs: [r.awbInput] });
    const result = data.results?.[0];
    if (result) {
      r.bdStatus = { ...result, ok: true };
    } else {
      r.bdStatus = { error: 'AWB not found in BlueDart', ok: false };
    }
  } catch(e) {
    r.bdStatus = { error: e.message, ok: false };
  }

  if (inp) inp.disabled = false;
  updatePending(r);
  refreshRow(r);
}

// ── VERIFY ALL WITH AWB ───────────────────────────────────────────────────────

async function verifyAll() {
  const toVerify = rows.filter(r => r.awbInput && !r.bdStatus);
  if (!toVerify.length) { toast('No AWB numbers to verify'); return; }

  const awbs = [...new Set(toVerify.map(r => r.awbInput))];
  try {
    const data = await apiFetch({ action: 'fetch_tracking', awbs });
    const byAwb = {};
    for (const res of data.results || []) if (res.awb) byAwb[res.awb] = res;

    for (const r of toVerify) {
      r.bdStatus = byAwb[r.awbInput]
        ? { ...byAwb[r.awbInput], ok: true }
        : { error: 'AWB not found', ok: false };
      updatePending(r);
    }
    renderRows();
    toast(`Verified ${Object.keys(byAwb).length} AWB numbers`);
  } catch(e) { toast('Verify failed: ' + e.message); }
}

// ── PUSH TO SHOPIFY ───────────────────────────────────────────────────────────

async function pushRow(orderName) {
  const r = rows.find(x => x.order_name === orderName);
  if (!r || !r.awbInput) return;

  const btn = document.querySelector(`#row-${orderName} .act-btn.push`);
  if (btn) { btn.disabled = true; btn.textContent = '…'; }

  try {
    const data = await apiFetch({ action: 'push_tracking', order_name: orderName, awb: r.awbInput, notify_customer: true });
    r.result = { ok: true, ...data };
    delete pendingPush[orderName];
    toast(`✓ ${orderName} — tracking pushed`);
  } catch(e) {
    r.result = { ok: false, error: e.message };
    toast(`✕ ${orderName}: ${e.message}`);
  }

  refreshRow(r);
  updateBulkPill();
}

async function pushAll() {
  const items = Object.entries(pendingPush).map(([order_name, awb]) => ({ order_name, awb }));
  if (!items.length) return;

  const btn = document.querySelector('#bulkPill .pill-push');
  btn.disabled = true; btn.textContent = '…pushing';

  try {
    const data = await apiFetch({ action: 'push_tracking_bulk', items });
    let ok = 0, fail = 0;
    for (const res of data.results || []) {
      const r = rows.find(x => x.order_name === res.order_name);
      if (!r) continue;
      r.result = res;
      if (res.ok) { delete pendingPush[res.order_name]; ok++; } else fail++;
    }
    renderRows();
    toast(`Pushed ${ok} orders${fail ? `, ${fail} failed` : ''}`);
  } catch(e) { toast('Bulk push failed: ' + e.message); }

  btn.disabled = false; btn.textContent = '⬆ Push all to Shopify';
  updateBulkPill();
}

function updatePending(r) {
  if (r.awbInput && !r.result?.ok) pendingPush[r.order_name] = r.awbInput;
  else delete pendingPush[r.order_name];
}

function clearPending() {
  pendingPush = {};
  updateBulkPill();
}

function updateBulkPill() {
  const n = Object.keys(pendingPush).length;
  document.getElementById('bulkCount').textContent = n;
  document.getElementById('bulkPill').classList.toggle('show', n > 0);
  const done = rows.filter(r => r.result?.ok).length;
  const pending = rows.filter(r => r.awbInput && !r.result?.ok).length;
  document.getElementById('pendingLbl').textContent =
    rows.length ? `${done} done · ${pending} with AWB · ${rows.length - done - pending} waiting` : '';
}

function refreshRow(r) {
  const el = document.getElementById(`row-${r.order_name}`);
  if (el) el.outerHTML = rowHTML(r);
  // Re-attach listener
  const inp = document.getElementById(`awb-${r.order_name}`);
  if (inp) {
    inp.value = r.awbInput || '';
    inp.addEventListener('input', () => { r.awbInput = inp.value.trim(); r.bdStatus = null; inp.className = 'awb-input'; updatePending(r); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') verifyRow(r.order_name); });
  }
  updateBulkPill();
}

// ── CSV IMPORT ────────────────────────────────────────────────────────────────
// Expects: order_name,awb  (header row required)

function importCsv(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const lines = e.target.result.trim().split('\n');
    const header = lines[0].toLowerCase().replace(/\r/g, '').split(',');
    const orderIdx = header.indexOf('order_name') >= 0 ? header.indexOf('order_name') : header.indexOf('order');
    const awbIdx   = header.indexOf('awb') >= 0 ? header.indexOf('awb') : header.indexOf('tracking');
    if (orderIdx < 0 || awbIdx < 0) { toast('CSV needs order_name and awb columns'); return; }

    let matched = 0;
    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].replace(/\r/g, '').split(',');
      const name = (cols[orderIdx] || '').trim();
      const awb  = (cols[awbIdx]   || '').trim();
      if (!name || !awb) continue;
      const r = rows.find(x => x.order_name === name || x.order_name === '#' + name || '#' + x.order_name === name);
      if (r) { r.awbInput = awb; r.bdStatus = null; updatePending(r); matched++; }
    }
    renderRows();
    toast(`CSV imported — matched ${matched} orders`);
  };
  reader.readAsText(file);
  input.value = '';
}

// ── UTILS ─────────────────────────────────────────────────────────────────────

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}
</script>
</body>
</html>
